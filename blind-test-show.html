<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Blind Test Show</title>
<!--
  BLIND TEST SHOW — jeu télévisé musical (TV + téléphones) pour Soirée Jeux
  Un seul fichier : la même page sert la TV (par défaut) et les téléphones (?role=player&room=CODE).

  INTÉGRATION (voir INTEGRATION-BLIND-TEST.md) — facultatif, tout a une solution de repli :
    window.BTS_HOST = {
      publicUrl: 'http://192.168.1.20:8080/blind-test-show.html', // adresse que les téléphones atteignent (QR code)
      wsUrl: 'ws://192.168.1.20:8080/bts-ws',                    // relais WebSocket (sinon ws://<hôte>/bts-ws)
      speak(text, optionsJson) {},  stop() {},  hasEndCallback: true // voix de la TV ; appeler window.BTS_onSpeechEnd() à la fin
    };
  Paramètres d'URL utiles : ?transport=bc (démo plusieurs onglets) · ?voice=off · ?fx=low (TV peu puissante) · ?lan=URL
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060f; --bg2:#120c26; --ink:#f6f3ff; --dim:#a9a2c9; --mute:#6f6894;
  --pink:#ff2e88; --cyan:#2de2e6; --gold:#ffc94d; --lime:#3dffa2; --red:#ff4d5e; --violet:#8b5cff;
  --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
  --disp:'Anton','Impact','Haettenschweiler','Arial Narrow Bold',sans-serif;
  --body:'Outfit','Segoe UI',Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}

/* ================= TV ================= */
html.tv{font-size:calc(100vh / 54)}
@media (max-aspect-ratio:16/10){html.tv{font-size:calc(100vw / 96)}}
#tv{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 110%,#2a1260 0%,#130a2e 45%,var(--bg) 75%)}
.stage{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.beam{position:absolute;top:-20%;width:60%;height:140%;opacity:.22;mix-blend-mode:screen;filter:blur(2px);transform-origin:50% 0}
.beam.b1{left:-8%;background:linear-gradient(180deg,var(--pink),transparent 70%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);animation:sweep 9s ease-in-out infinite alternate}
.beam.b2{right:-8%;background:linear-gradient(180deg,var(--cyan),transparent 70%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);animation:sweep 11s ease-in-out infinite alternate-reverse}
.beam.b3{left:20%;background:linear-gradient(180deg,var(--gold),transparent 60%);clip-path:polygon(47% 0,53% 0,80% 100%,20% 100%);opacity:.12;animation:sweep 13s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.floor{position:absolute;left:-10%;right:-10%;bottom:-30%;height:55%;background:repeating-linear-gradient(90deg,rgba(139,92,255,.25) 0 2px,transparent 2px 8%),repeating-linear-gradient(0deg,rgba(139,92,255,.25) 0 2px,transparent 2px 14%);transform:perspective(40rem) rotateX(62deg);mask-image:linear-gradient(transparent,#000 60%);opacity:.5}
.lowfx .beam,.lowfx .floor{display:none}
.lowfx *{backdrop-filter:none!important;filter:none!important}

.tvbar{position:absolute;top:0;left:0;right:0;height:5.2rem;display:flex;align-items:center;gap:1.4rem;padding:0 2.6rem;z-index:5}
.tvbar .mini-logo{white-space:nowrap;flex:none;font-family:var(--disp);font-size:2.2rem;letter-spacing:.06em;background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.tvbar .mini-logo span{color:var(--cyan);-webkit-text-fill-color:var(--cyan)}
.tvbar .grow{flex:1}
.badge{display:inline-flex;align-items:center;gap:.5rem;padding:.45rem 1rem;border-radius:99rem;background:var(--card);border:1px solid var(--line);font-size:1.15rem;color:var(--dim);white-space:nowrap}
.badge b{color:var(--ink)}
.badge.warn{border-color:rgba(255,201,77,.5);color:var(--gold)}
.roomcode{font-family:var(--disp);font-size:1.8rem;letter-spacing:.2em;color:var(--gold)}

#screen{position:absolute;inset:5.2rem 0 6.4rem 0;z-index:3}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center}

/* Logo */
.logo{font-family:var(--disp);line-height:.86;text-transform:uppercase;text-align:center;position:relative}
.logo .l1{display:block;font-size:11rem;letter-spacing:.02em;background:linear-gradient(180deg,#fff 0%,#ffd6ea 40%,var(--pink) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .4rem 2.4rem rgba(255,46,136,.55))}
.logo .l2{display:block;font-size:7.4rem;letter-spacing:.42em;margin-left:.42em;color:transparent;-webkit-text-stroke:.16rem var(--cyan);text-shadow:0 0 2rem rgba(45,226,230,.6)}
.logo .wave{display:flex;justify-content:center;gap:.5rem;height:4rem;margin:1.4rem auto 0;align-items:flex-end}
.logo .wave i{display:block;width:.9rem;border-radius:.5rem;background:linear-gradient(var(--gold),var(--pink));animation:eq 1s ease-in-out infinite}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}
.tagline{margin-top:2rem;font-size:1.8rem;color:var(--dim);letter-spacing:.3em;text-transform:uppercase}
.bigbtn{margin-top:3.2rem;font-family:var(--disp);font-size:3rem;letter-spacing:.08em;padding:1.4rem 4.4rem;border-radius:99rem;background:linear-gradient(90deg,var(--pink),#ff6a3d);box-shadow:0 0 0 .3rem rgba(255,255,255,.12),0 1rem 4rem rgba(255,46,136,.45);transition:transform .15s}
.bigbtn:focus,.bigbtn:hover{outline:none;transform:scale(1.06);box-shadow:0 0 0 .35rem #fff,0 1rem 5rem rgba(255,46,136,.7)}
.ghostbtn{margin-top:1.4rem;font-size:1.5rem;padding:.8rem 2rem;border-radius:99rem;border:1px solid var(--line);color:var(--dim)}
.ghostbtn:focus{outline:none;border-color:#fff;color:#fff}
.note{font-size:1.25rem;color:var(--mute);margin-top:1.4rem;max-width:70rem}

/* Lobby */
.lobby{display:grid;grid-template-columns:32rem 1fr;gap:3rem;height:100%;padding:.6rem 3rem 0;min-height:0}
.qrcard{min-height:0;overflow:hidden;background:linear-gradient(160deg,rgba(255,46,136,.18),rgba(45,226,230,.12));border:1px solid var(--line);border-radius:2.4rem;padding:1.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.8rem}
.qrcard .qr{width:22rem;height:22rem;background:#fff;border-radius:1.4rem;padding:.6rem;box-shadow:0 0 4rem rgba(45,226,230,.35)}
.qrcard .qr svg{width:100%;height:100%;display:block}
.qrcard h3{font-family:var(--disp);font-size:2rem;letter-spacing:.04em;white-space:nowrap}
.qrcard .url{font-size:1rem;color:var(--dim);word-break:break-all}
.qrcard .code{font-family:var(--disp);font-size:3.6rem;letter-spacing:.3em;color:var(--gold);line-height:1}
.lobby-right{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.lobby-title{font-family:var(--disp);font-size:3rem;letter-spacing:.04em;display:flex;align-items:baseline;gap:1.4rem}
.lobby-title small{font-family:var(--body);font-size:1.5rem;color:var(--dim);letter-spacing:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:1.2rem;margin-top:1.4rem;align-content:start;flex:1;overflow:hidden}
.pcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:1.6rem;padding:1.2rem;display:flex;align-items:center;gap:1rem;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.pcard .av{width:4.4rem;height:4.4rem;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;flex:none}
.pcard .nm{font-weight:700;font-size:1.6rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .sub{font-size:1.1rem;color:var(--dim)}
.pcard.off{opacity:.45}
.crown{position:absolute;top:-.9rem;left:.9rem;font-size:1.6rem}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.teamcols{display:grid;gap:1.4rem;margin-top:1.4rem;flex:1}
.teamcol{border-radius:1.8rem;padding:1.2rem;background:var(--card);border:2px solid var(--tc);display:flex;flex-direction:column;gap:.8rem;min-height:0}
.teamcol h4{font-family:var(--disp);font-size:2.2rem;color:var(--tc);letter-spacing:.04em}
.teamcol .pcard{padding:.7rem}
.teamcol .pcard .av{width:3.2rem;height:3.2rem;font-size:1.7rem}
.teamcol .pcard .nm{font-size:1.35rem}
.cfgline{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.cfgline .badge{font-size:1rem;padding:.35rem .8rem}
.waitline{margin-top:.9rem;font-size:1.35rem;color:var(--dim);display:flex;align-items:center;gap:1rem}
.waitline b{color:var(--gold)}
.empty{font-size:1.8rem;color:var(--mute);padding:3rem 0}

/* Plateau */
.game{display:grid;grid-template-rows:auto 1fr auto;height:100%;padding:0 3rem}
.roundhead{display:flex;align-items:center;gap:1.4rem}
.roundno{font-family:var(--disp);font-size:4.4rem;letter-spacing:.04em;line-height:1}
.roundno span{color:var(--mute)}
.special{font-family:var(--disp);font-size:2rem;letter-spacing:.06em;padding:.5rem 1.4rem;border-radius:1rem;background:linear-gradient(90deg,var(--gold),#ff8a3d);color:#1a0f00;animation:pulse 1.6s ease-in-out infinite}
.special.fin{background:linear-gradient(90deg,var(--pink),var(--violet));color:#fff}
@keyframes pulse{50%{transform:scale(1.05)}}
.arena{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:3rem;min-height:0;padding:1rem 0}
.disc-wrap{position:relative;display:grid;place-items:center}
.disc{width:26rem;height:26rem;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 .35rem,#1c1c22 .35rem .7rem);box-shadow:0 0 0 .6rem rgba(255,255,255,.05),0 0 6rem rgba(255,46,136,.35);display:grid;place-items:center;animation:spin 3.2s linear infinite;animation-play-state:paused}
.playing .disc{animation-play-state:running}
.disc .label{width:9rem;height:9rem;border-radius:50%;background:conic-gradient(var(--pink),var(--gold),var(--cyan),var(--violet),var(--pink));display:grid;place-items:center;font-size:4rem}
.disc .label::after{content:'';width:1.4rem;height:1.4rem;border-radius:50%;background:var(--bg);position:absolute}
@keyframes spin{to{transform:rotate(360deg)}}
.viz{position:absolute;inset:-4rem;pointer-events:none}
.viz i{position:absolute;left:50%;top:50%;width:.7rem;height:3rem;margin-left:-.35rem;border-radius:.4rem;background:linear-gradient(var(--cyan),var(--pink));transform-origin:50% 0;opacity:.85}
.side{display:flex;flex-direction:column;align-items:center;gap:2rem}
.ring{position:relative;width:20rem;height:20rem}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:8rem;line-height:1}
.ring.hurry .num{color:var(--red);animation:pulse .5s infinite}
.status{font-size:2.4rem;font-weight:700;text-align:center;min-height:3rem}
.status small{display:block;font-size:1.5rem;color:var(--dim);font-weight:400;margin-top:.4rem}
.strip{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;padding:1rem 0}
.chip{display:flex;align-items:center;gap:.7rem;padding:.5rem 1.2rem .5rem .5rem;border-radius:99rem;background:var(--card);border:2px solid transparent;font-size:1.35rem;transition:border-color .2s,transform .2s}
.chip .av{width:2.8rem;height:2.8rem;border-radius:50%;display:grid;place-items:center;font-size:1.5rem}
.chip b{font-family:var(--disp);font-size:1.5rem;letter-spacing:.03em;margin-left:.3rem;color:var(--gold)}
.chip.ans{border-color:var(--lime)}
.chip.lock{opacity:.45}
.chip.off{opacity:.35}
.chip .st{font-size:1.2rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:1rem;width:100%;max-width:56rem}
.choice{padding:1.2rem 1.4rem;border-radius:1.2rem;background:var(--card);border:2px solid var(--line);font-size:1.6rem;font-weight:600;display:flex;gap:1rem;align-items:center;position:relative;overflow:hidden}
.choice .k{font-family:var(--disp);font-size:2rem;width:2.8rem;height:2.8rem;border-radius:.6rem;display:grid;place-items:center;flex:none;color:#100}
.choice .bar{position:absolute;left:0;bottom:0;height:.5rem;background:var(--dim);transition:width 1s}
.choice.good{border-color:var(--lime);background:rgba(61,255,162,.15)}
.choice.good .bar{background:var(--lime)}
.choice .cnt{margin-left:auto;font-family:var(--disp);font-size:1.8rem}
.k0{background:var(--pink)}.k1{background:var(--cyan)}.k2{background:var(--gold)}.k3{background:var(--lime)}

/* Révélation */
.reveal{display:grid;grid-template-columns:auto 1fr;gap:3.4rem;align-items:center;height:100%;padding:0 4rem}
.cover{width:30rem;height:30rem;border-radius:2rem;background-size:cover;background-position:center;box-shadow:0 2rem 6rem rgba(0,0,0,.6),0 0 0 .3rem rgba(255,255,255,.08);animation:flipin .8s cubic-bezier(.2,1.3,.4,1) both;display:grid;place-items:center;font-size:9rem}
@keyframes flipin{from{transform:perspective(60rem) rotateY(80deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
.rv-kicker{font-size:1.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan)}
.rv-title{font-family:var(--disp);font-size:6rem;line-height:1.02;margin:.6rem 0;animation:rise .7s .2s both}
.rv-artist{font-size:3rem;font-weight:700;color:var(--gold);animation:rise .7s .4s both}
.rv-year{font-size:1.8rem;color:var(--dim);margin-top:.4rem}
@keyframes rise{from{transform:translateY(2rem);opacity:0}to{transform:none;opacity:1}}
.gains{display:flex;flex-wrap:wrap;gap:1rem;margin-top:2rem}
.gain{display:flex;align-items:center;gap:.8rem;padding:.6rem 1.2rem;border-radius:1rem;background:var(--card);font-size:1.5rem;animation:pop .5s both}
.gain .pts{font-family:var(--disp);font-size:2rem;color:var(--lime)}
.gain .pts.neg{color:var(--red)}
.gain .why{font-size:1.1rem;color:var(--dim)}
.mystery{display:inline-block;margin-top:1rem;font-family:var(--disp);font-size:2rem;color:var(--gold);letter-spacing:.06em}

/* Classement */
.scores{max-width:84rem;margin:0 auto;height:100%;display:flex;flex-direction:column;justify-content:center;gap:.8rem;padding:0 2rem}
.scores h2{font-family:var(--disp);font-size:4rem;text-align:center;letter-spacing:.06em;margin-bottom:1rem}
.srow{display:grid;grid-template-columns:4rem 4.4rem 1fr auto 6rem;align-items:center;gap:1.2rem;padding:.9rem 1.6rem;border-radius:1.4rem;background:var(--card);border:1px solid var(--line);animation:slide .6s both}
.srow.first{background:linear-gradient(90deg,rgba(255,201,77,.25),rgba(255,46,136,.12));border-color:rgba(255,201,77,.6)}
@keyframes slide{from{transform:translateX(-6rem);opacity:0}to{transform:none;opacity:1}}
.srow .rk{font-family:var(--disp);font-size:2.6rem;text-align:center}
.srow .av{width:4.4rem;height:4.4rem;border-radius:50%;display:grid;place-items:center;font-size:2.3rem}
.srow .nm{font-size:2rem;font-weight:700}
.srow .mem{font-size:1.15rem;color:var(--dim);font-weight:400}
.srow .sc{font-family:var(--disp);font-size:2.8rem;color:var(--gold)}
.srow .mv{font-size:1.5rem;text-align:right;font-weight:700}
.up{color:var(--lime)}.down{color:var(--red)}

/* Finale & podium */
.finale-title{font-family:var(--disp);font-size:12rem;line-height:.9;background:linear-gradient(180deg,#fff,var(--gold) 50%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 3rem rgba(255,201,77,.6));animation:zoom 1.4s cubic-bezier(.2,1.4,.4,1) both}
@keyframes zoom{from{transform:scale(3);opacity:0}to{transform:none;opacity:1}}
.vs{display:flex;gap:4rem;margin-top:3rem;align-items:center;font-family:var(--disp);font-size:3rem}
.vs .who{display:flex;flex-direction:column;align-items:center;gap:1rem}
.vs .av{width:9rem;height:9rem;border-radius:50%;display:grid;place-items:center;font-size:5rem;box-shadow:0 0 3rem currentColor}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:2rem;height:100%;padding-bottom:4.4rem}
.step{width:24rem;display:flex;flex-direction:column;align-items:center;gap:1rem;opacity:0;transform:translateY(4rem);transition:all .8s cubic-bezier(.2,1.3,.4,1)}
.step.on{opacity:1;transform:none}
.step .av{width:7.5rem;height:7.5rem;border-radius:50%;display:grid;place-items:center;font-size:4.2rem}
.step .nm{font-family:var(--disp);font-size:2.4rem;text-align:center;line-height:1.1}
.step .sc{font-size:2rem;color:var(--gold);font-weight:700}
.step .block{width:100%;border-radius:1.4rem 1.4rem 0 0;display:grid;place-items:center;font-family:var(--disp);font-size:5.6rem;color:rgba(0,0,0,.45)}
.step.p1 .block{height:14rem;background:linear-gradient(var(--gold),#c98a00)}
.step.p2 .block{height:12rem;background:linear-gradient(#e6e9f5,#9aa0b8)}
.step.p3 .block{height:8rem;background:linear-gradient(#ffb37a,#b8622a)}
.step.p1 .av{width:9.5rem;height:9.5rem;font-size:5.4rem;box-shadow:0 0 5rem var(--gold)}
.winner-name{font-family:var(--disp);font-size:2.4rem;color:var(--gold);text-align:center}

/* Présentateur (sous-titres) */
#presenter{position:absolute;left:50%;bottom:1.2rem;transform:translateX(-50%);width:min(150rem,92%);min-height:4.6rem;display:flex;align-items:center;gap:1.2rem;padding:.8rem 1.8rem;border-radius:1.6rem;background:rgba(10,6,24,.82);border:1px solid var(--line);z-index:8;transition:opacity .3s}
#presenter.idle{opacity:.0}
#presenter .mic{width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;background:linear-gradient(var(--pink),var(--violet));font-size:1.5rem;flex:none}
#presenter .pn{font-family:var(--disp);font-size:1.6rem;color:var(--cyan);letter-spacing:.06em}
#presenter .pt{font-size:1.75rem;line-height:1.3}

/* Buzzer plein écran */
#flash{position:absolute;inset:0 0 6.4rem 0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:1.4rem;text-align:center}
#flash.on{display:flex}
#flash .bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,var(--fc) 0%,rgba(7,6,15,.97) 62%),#07060f;animation:flashin .4s both}
@keyframes flashin{from{opacity:0;transform:scale(1.3)}}
#flash .inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:1.1rem}
#flash .big{font-family:var(--disp);font-size:6.4rem;letter-spacing:.08em;line-height:1;animation:zoom .45s both}
#flash .av{width:12rem;height:12rem;border-radius:50%;display:grid;place-items:center;font-size:7rem;background:rgba(0,0,0,.25);box-shadow:0 0 0 .5rem #fff,0 0 6rem var(--fc)}
#flash .nm{font-family:var(--disp);font-size:4.2rem;line-height:1}
#flash .tm{font-family:var(--disp);font-size:3rem;color:#fff;line-height:1}
#flash .said{font-size:2.4rem;background:rgba(0,0,0,.35);padding:.8rem 1.6rem;border-radius:1rem;max-width:80rem}
#flash .wait{font-size:2rem;color:var(--gold)}

#pauseOv{position:absolute;inset:0;z-index:12;background:rgba(7,6,15,.82);display:none;place-items:center;text-align:center}
#pauseOv.on{display:grid}
#pauseOv h2{font-family:var(--disp);font-size:9rem;letter-spacing:.1em}
#pauseOv p{font-size:1.8rem;color:var(--dim)}
#confetti{position:absolute;inset:0;z-index:10;pointer-events:none}
#toast{position:absolute;top:6rem;left:50%;transform:translateX(-50%);z-index:14;background:var(--gold);color:#1a0f00;padding:.8rem 1.8rem;border-radius:99rem;font-size:1.5rem;font-weight:700;opacity:0;transition:opacity .3s}
#toast.on{opacity:1}
.spinner{width:6rem;height:6rem;border-radius:50%;border:.6rem solid rgba(255,255,255,.1);border-top-color:var(--pink);animation:spin 1s linear infinite;margin-bottom:2rem}
.loadtxt{font-size:2.2rem}

/* ================= TÉLÉPHONE ================= */
html.pad{font-size:16px}
html.pad,html.pad body{height:auto;min-height:100%;overflow:auto;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
html.pad.ingame,html.pad.ingame body{height:100%;overflow:hidden}
html.pad.ingame body{touch-action:none;position:fixed;inset:0}
html.pad.ingame #pad{height:100%}
#pad{min-height:100%;display:flex;flex-direction:column;background:radial-gradient(130% 70% at 50% 0%,#2a1260 0%,var(--bg) 70%)}

<script>
'use strict';
/* ===== OUTILS ===== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const setHTML = (el, html) => { if (el && el._h !== html) { el._h = html; el.innerHTML = html; } };
const ord = n => n === 1 ? '1<sup>er</sup>' : n + '<sup>e</sup>';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = n => Math.floor(Math.random() * n);
const pick = arr => arr[rnd(arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = (p = '') => p + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
const PARAMS = new URLSearchParams(location.search);
const FAST = PARAMS.get('fast') === '1';
const AVATARS = ['🎸', '🎤', '🎧', '🥁', '🎹', '🎷', '🎺', '🎻', '🦄', '🐯', '🦊', '🐼', '🐸', '🦉', '🐙', '🦖', '👽', '🤖', '👑', '🌶️', '🍕', '🚀', '⚡', '🔥'];
const COLORS = ['#ff2e88', '#2de2e6', '#ffc94d', '#3dffa2', '#a66bff', '#ff8a3d', '#4da3ff', '#ff5ec7', '#c6ff3d', '#ff4d5e', '#5effd9', '#ffd84d'];
const TEAM_PRESETS = [
  { id: 'T1', name: 'Les Vinyles', color: '#ff2e88', emoji: '💿' },
  { id: 'T2', name: 'Les Platines', color: '#2de2e6', emoji: '🎚️' },
  { id: 'T3', name: 'Les Décibels', color: '#ffc94d', emoji: '🔊' },
  { id: 'T4', name: 'Les Refrains', color: '#3dffa2', emoji: '🎶' }
];

/* ===== COMPARAISON DES RÉPONSES ===== */
const Match = (() => {
  const STOP_LEADING = /^(the|le|la|les|l|un|une|a|an) /;
  function base(s) {
    return String(s || '').toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/œ/g, 'oe').replace(/æ/g, 'ae')
      .replace(/&/g, ' et ').replace(/\+/g, ' et ')
      .replace(/['’`´]/g, ' ').replace(/[^a-z0-9 ]+/g, ' ')
      .replace(/\b(and|und|y)\b/g, 'et')
      .replace(/\s+/g, ' ').trim();
  }
  function norm(s) { return base(s).replace(STOP_LEADING, '').trim(); }
  // Variantes acceptées d'un titre : retire (feat. X), [Remix], " - Remastered 2011", etc.
  function titleVariants(t) {
    const raw = String(t || '');
    const out = new Set([raw]);
    const noParen = raw.replace(/\s*[\(\[][^\)\]]*[\)\]]/g, '').trim();
    out.add(noParen);
    const dash = noParen.split(/\s+[-–—]\s+/)[0].trim();
    out.add(dash);
    out.add(dash.replace(/\b(feat|ft|featuring)\.?\b.*$/i, '').trim());
    // Contenu entre parenthèses quand il s'agit du titre "connu" : "(I Can't Get No) Satisfaction"
    const inner = raw.match(/^\(([^)]+)\)\s*(.+)$/); if (inner) { out.add(inner[2]); out.add(inner[1] + ' ' + inner[2]); }
    const slash = dash.split(/\s*\/\s*/); if (slash.length > 1) slash.forEach(p => out.add(p));
    return [...out].map(norm).filter(v => v.length);
  }
  function artistVariants(list) {
    const out = new Set();
    (Array.isArray(list) ? list : [list]).forEach(a => {
      if (!a) return;
      out.add(a);
      String(a).split(/\s*(?:,|&|\bfeat\.?|\bft\.?|\bx\b|\bet\b|\band\b)\s*/i).forEach(p => p && p.trim().length > 1 && out.add(p.trim()));
    });
    return [...out].map(norm).filter(v => v.length);
  }
  function lev(a, b) {
    if (a === b) return 0; const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, i) => i), cur = new Array(n + 1);
    for (let i = 1; i <= m; i++) { cur[0] = i; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); [prev, cur] = [cur, prev]; }
    return prev[n];
  }
  function sim(a, b) { if (!a || !b) return 0; const L = Math.max(a.length, b.length); return 1 - lev(a, b) / L; }
  const sortTok = s => s.split(' ').sort().join(' ');
  // Score 0..1 entre une réponse et une cible normalisée
  function score(ans, target) {
    if (!ans || !target) return 0;
    if (ans === target) return 1;
    if (sortTok(ans) === sortTok(target)) return 0.97;
    const sa = sim(ans, target);
    const compactA = ans.replace(/ /g, ''), compactT = target.replace(/ /g, '');
    const sc = compactA === compactT ? 0.98 : sim(compactA, compactT);
    const short = compactT.length <= 4;
    let s = Math.max(sa, sc);
    // Les cibles très courtes ("U2", "Abba") doivent être exactes
    if (short && s < 0.98) s = Math.min(s, 0.6);
    // Réponse plus longue qui contient la cible entière ("c est thriller de michael jackson")
    if ((' ' + ans + ' ').includes(' ' + target + ' ')) s = Math.max(s, 0.95);
    // Fenêtre glissante : la meilleure sous-séquence de mots de même longueur
    const aw = ans.split(' '), tw = target.split(' ');
    if (!short && aw.length > tw.length) for (let i = 0; i + tw.length <= aw.length; i++) s = Math.max(s, sim(aw.slice(i, i + tw.length).join(' '), target) * 0.97);
    return s;
  }
  function best(ans, variants) { const a = norm(ans); let b = 0; variants.forEach(v => b = Math.max(b, score(a, v))); return b; }
  const ACCEPT = 0.82, DOUBT = 0.62;
  function verdict(s) { return s >= ACCEPT ? 'ok' : s >= DOUBT ? 'doubt' : 'no'; }
  // Analyse d'une réponse libre (voix ou texte unique) contenant titre et/ou artiste
  function analyze(text, track) {
    const tv = track._tv || (track._tv = titleVariants(track.title));
    const av = track._av || (track._av = artistVariants(track.artists && track.artists.length ? track.artists : [track.artist]));
    const t = best(text, tv), a = best(text, av);
    return { title: t, artist: a, titleV: verdict(t), artistV: verdict(a) };
  }
  function check(text, track, which) {
    const tv = track._tv || (track._tv = titleVariants(track.title));
    const av = track._av || (track._av = artistVariants(track.artists && track.artists.length ? track.artists : [track.artist]));
    const s = best(text, which === 'artist' ? av : tv);
    return { score: s, v: verdict(s) };
  }
  return { norm, base, titleVariants, artistVariants, score, best, analyze, check, sim, ACCEPT, DOUBT };
})();

/* ===== TRANSPORT TEMPS RÉEL =====
   TV = arbitre. Les messages passent par un relais (WebSocket du serveur ou de l'appli Soirée Jeux),
   ou par BroadcastChannel pour une démo locale (plusieurs onglets du même appareil). */
class Transport {
  constructor({ room, id, role, onMessage, onStatus }) {
    Object.assign(this, { room, id, role, onMessage, onStatus });
    this.kind = this.pickKind();
    this.queue = []; this.backoff = 500; this.closed = false;
    this.connect();
  }
  pickKind() {
    const forced = PARAMS.get('transport');
    if (forced) return forced;
    if (window.BTS_HOST && typeof window.BTS_HOST.transport === 'function') return 'host';
    if (location.protocol === 'http:' || location.protocol === 'https:') return 'ws';
    return 'bc';
  }
  wsUrl() {
    if (window.BTS_HOST && window.BTS_HOST.wsUrl) return window.BTS_HOST.wsUrl;
    const p = PARAMS.get('ws');
    if (p) return p;
    return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/bts-ws';
  }
  connect() {
    const q = `room=${encodeURIComponent(this.room)}&id=${encodeURIComponent(this.id)}&role=${this.role}`;
    if (this.kind === 'host') {
      this.ch = window.BTS_HOST.transport({ room: this.room, id: this.id, role: this.role, onMessage: txt => this.recv(txt) });
      this.status('ok'); return;
    }
    if (this.kind === 'bc') {
      this.ch = new BroadcastChannel('bts-' + this.room);
      this.ch.onmessage = e => this.recv(e.data);
      this.status('ok'); this.flush(); return;
    }
    let ws;
    try { ws = new WebSocket(this.wsUrl() + (this.wsUrl().includes('?') ? '&' : '?') + q); } catch (e) { return this.retry(); }
    this.ws = ws;
    ws.onopen = () => { this.backoff = 500; this.status('ok'); this.flush(); };
    ws.onmessage = e => this.recv(e.data);
    ws.onclose = () => { if (this.ws === ws) { this.status('lost'); this.retry(); } };
    ws.onerror = () => { try { ws.close(); } catch (e) { } };
  }
  retry() { if (this.closed) return; clearTimeout(this.rt); this.rt = setTimeout(() => this.connect(), this.backoff); this.backoff = Math.min(this.backoff * 1.6, 5000); }
  reconnectNow() { if (this.kind !== 'ws') return; if (this.ws && this.ws.readyState <= 1) return; this.backoff = 300; this.retry(); }
  status(s) { this.state = s; this.onStatus && this.onStatus(s); }
  recv(txt) {
    let m; try { m = typeof txt === 'string' ? JSON.parse(txt) : txt; } catch (e) { return; }
    if (!m || m.from === this.id) return;
    if (m.room && m.room !== this.room) return;
    if (m.to && m.to !== '*' && m.to !== this.id) return;
    this.onMessage(m);
  }
  send(to, data) {
    const txt = JSON.stringify({ room: this.room, from: this.id, to, ...data });
    if (this.kind === 'host') { this.ch.send(txt); return; }
    if (this.kind === 'bc') { this.ch.postMessage(txt); return; }
    if (this.ws && this.ws.readyState === 1) this.ws.send(txt);
    else { this.queue.push(txt); if (this.queue.length > 50) this.queue.shift(); }
  }
  flush() { const q = this.queue; this.queue = []; q.forEach(t => this.kind === 'bc' ? this.ch.postMessage(t) : this.ws && this.ws.readyState === 1 ? this.ws.send(t) : this.queue.push(t)); }
}

/* ===== QR CODE (octets, correction M, versions 1-10) — sans dépendance ===== */
const QR = (() => {
  const EXP = new Array(512), LOG = new Array(256);
  let x = 1;
  for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11d; }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];

function jsonp(url, timeout = 9000) {

    const cb = 'dz_' + uid();
    const s = document.createElement('script');

    s.src = url + (url.includes('?') ? '&' : '?') + 'output=jsonp&callback=' + cb;
    document.head.appendChild(s);
  });
}
const Deezer = {
  label: 'Deezer — extraits officiels de 30 s',
  api: 'https://api.deezer.com',

  },

const lastUsed = {};
function line(key, vars = {}) {
  let bank = key.split('.').reduce((o, k) => o && o[k], LINES);
  if (!bank || !bank.length) return '';
  let i = rnd(bank.length);
  if (bank.length > 1 && lastUsed[key] === i) i = (i + 1 + rnd(bank.length - 1)) % bank.length;

const Voice = {
  enabled: true, persona: 'max', vol: 1, intensity: 0, engine: 'none', degraded: false,
  queue: [], current: null, voice: null, onSubtitle: null,
  init() {

  pickVoice() {

  },
  setPersona(p) { if (PERSONAS[p]) { this.persona = p; if (this.engine === 'web') this.pickVoice(); } },

  // prio : 0 ambiance, 1 normal, 2 important, 3 urgent (coupe l'annonce en cours)
  say(text, { prio = 1, key = '', wait = false } = {}) {
    if (!text) return Promise.resolve();
    return new Promise(resolve => {
      const item = { text, prio, key, resolve, id: uid() };
      if (this.current && prio >= 3 && this.current.prio < 3) { this.interrupt(); }

      const i = this.queue.findIndex(q => q.prio < prio);

    this.next();
  },
  idle() { return !this.current && !this.queue.length; }
};

    if (showScores) {

      await this.speak(line('scores'), 1, gen);
      if (rk[0] && rk[1] && rk[0].score === rk[1].score && rk[0].score > 0) await this.speak(line('tie'), 1, gen);
      else if (leader && S.lastLeader && leader !== S.lastLeader) await this.speak(line('leader', { name: rk[0].name }), 2, gen);
      else if (leader && S.roundIdx > 1 && Math.random() < 0.5) await this.speak(line('leaderKeep', { name: rk[0].name }), 1, gen);
      await this.sleep(4500, gen);
    }
    if (leader) S.lastLeader = leader;
    S.prevRanking = this.ranking().map(r => ({ id: r.id, rank: r.rank, score: r.score }));
    if (gen !== this.gen) return;
    this.nextRound(gen);
  },
  advance() {
    const S = this.S;
    if (S.phase === 'reveal' && S.cur) { if (S.cur.waitHost || S.config.autoNext) { S.cur.waitHost = false; this.gen++; const g = this.gen; Voice.clear(); this.afterReveal(g); } }
    else if (S.phase === 'scores') { this.gen++; const g = this.gen; Voice.clear(); S.prevRanking = this.ranking().map(r => ({ id: r.id, rank: r.rank, score: r.score })); this.nextRound(g); }
  },
  skip() {
    const S = this.S; if (!S.cur) return;
    if (['listen', 'buzzed', 'judge', 'bet', 'prep'].includes(S.phase)) {
      this.gen++; Voice.clear(); S.paused = false;
      if (!S.cur.track) { AudioEngine.stop(); this.nextRound(this.gen); return; }
      this.closeQuestion('skip', this.gen);
    }
    else this.advance();
  },
  pause() {
    const S = this.S; if (S.paused || ['home', 'lobby', 'podium', 'loading'].includes(S.phase)) return;
    S.paused = true; S.pausedAt = Date.now();
    if (S.timer) S.timer.remaining = Math.max(0, S.timer.endsAt - Date.now());
    S.wasPlaying = AudioEngine.playing; AudioEngine.pause(); Voice.clear();
    this.dirty(true); Voice.say(line('pause'), { prio: 2, key: 'pause' });
  },
  resume() {
    const S = this.S; if (!S.paused) return;
    const pausedMs = Date.now() - S.pausedAt;
    S.paused = false;
    if (S.restored) { S.restored = false; const g = ++this.gen; this.dirty(true); this.preload(); (async () => { const t0 = Date.now(); while (this.sources.status === 'loading' && Date.now() - t0 < 25000) await this.sleep(300, g, true); if (!this.sources.pool.length) { this.sources.pool = Demo.tracks(); this.sources.label = Demo.label; this.sources.status = 'fallback'; } this.nextRound(g); })(); return; }
    if (S.timer) S.timer.endsAt = Date.now() + S.timer.remaining;
    if (S.cur) { S.cur.pausedMs = (S.cur.pausedMs || 0) + pausedMs; if (S.cur.penaltyUntil) S.cur.penaltyUntil += pausedMs; if (S.cur.listenStart) S.cur.listenStart += pausedMs; }
    if (S.wasPlaying && S.phase === 'listen') AudioEngine.resume().catch(() => { });
    this.dirty(true); Voice.say(line('resume'), { prio: 2, key: 'pause' });
  },
  async podium() {
    const S = this.S, gen = ++this.gen;
    Voice.clear(); AudioEngine.stop();
    S.phase = 'podium'; S.podiumStep = 0; this.stopTimer(); this.dirty(true); this.save();
    Voice.intensity = 1;
    const rk = this.ranking();
    await this.speak(line('podiumIntro'), 2, gen, 'podium');
    const third = rk.find(r => r.rank === 3), second = rk.find(r => r.rank === 2);
    if (third) { S.podiumStep = 1; this.dirty(true); await this.speak(line('third', { name: third.name }), 2, gen, 'podium'); }
    if (second) { S.podiumStep = 2; this.dirty(true); await this.speak(line('second', { name: second.name }), 2, gen, 'podium'); }
    await this.sleep(900, gen);
    S.podiumStep = 3; this.dirty(true); AudioEngine.sfx('fanfare'); Show.confetti && Show.confetti();
    const winners = rk.filter(r => r.rank === 1);
    await this.speak(winners.length > 1 ? line('winnerTie', { name: winners.map(w => w.name).join(' et ') }) : line('winner', { name: winners[0] ? winners[0].name : '' }), 3, gen, 'podium');
    Voice.intensity = 0;
  },
  newGame() {
    const S = this.S; this.gen++; Voice.clear(); AudioEngine.stop();
    S.phase = 'lobby'; S.paused = false; S.rounds = []; S.roundIdx = -1; S.cur = null; S.ledger = []; S.corrections = []; S.prevRanking = []; S.finalists = null; S.lastLeader = null; S.timer = null; S.usedIds = [];
    store.del('bts_game');
    if (this.isTeamMode() && S.teams.length < S.config.teamCount) this.setTeams(S.config.teamCount);
    this.dirty(true);
    Voice.say(line('newGame'), { prio: 2, key: 'lobby' });
  },
  /* ---------- Scores ---------- */
  scoreOf(pid) { return this.S.ledger.reduce((a, e) => a + (e.pid === pid ? e.pts : 0), 0); },
  teamScore(tid) { return this.S.ledger.reduce((a, e) => a + (e.team === tid ? e.pts : 0), 0); },
  ranking() {
    const S = this.S;
    let rows = this.isTeamMode()
      ? S.teams.map(t => ({ id: t.id, name: t.name, color: t.color, avatar: t.emoji, score: this.teamScore(t.id), team: true, members: this.competitors().filter(p => p.team === t.id).map(p => ({ id: p.id, name: p.name, avatar: p.avatar, score: this.scoreOf(p.id) })) }))
      : this.competitors().map(p => ({ id: p.id, name: p.name, color: p.color, avatar: p.avatar, score: this.scoreOf(p.id), online: p.online }));
    rows.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
    let rank = 0, prev = null;
    rows.forEach((r, i) => { if (r.score !== prev) { rank = i + 1; prev = r.score; } r.rank = rank; const old = S.prevRanking.find(x => x.id === r.id); r.prevRank = old ? old.rank : null; r.delta = old ? r.score - old.score : r.score; });
    return rows;
  },
  nameOf(id) { const p = this.S.players[id]; if (p) return p.name; const t = this.S.teams.find(t => t.id === id); return t ? t.name : '?'; },
  teamName(tid) { const t = this.S.teams.find(t => t.id === tid); return t ? t.name : ''; },
  /* ---------- Sauvegarde (reprise après rechargement de la TV) ---------- */
  save() {
    const S = this.S; if (['home', 'lobby'].includes(S.phase)) return;
    store.set('bts_game', { at: Date.now(), room: S.room, config: S.config, players: S.players, order: S.order, hostId: S.hostId, teams: S.teams, ledger: S.ledger, corrections: S.corrections, roundIdx: S.roundIdx, rounds: S.rounds, finalists: S.finalists, prevRanking: S.prevRanking, usedIds: S.usedIds, lastLeader: S.lastLeader, phase: S.phase });
  },
  restore(d) {
    const S = this.S;
    Object.assign(S, { config: d.config, players: d.players, order: d.order, hostId: d.hostId, teams: d.teams, ledger: d.ledger, corrections: d.corrections, rounds: d.rounds, finalists: d.finalists, prevRanking: d.prevRanking || [], usedIds: d.usedIds || [], lastLeader: d.lastLeader });
    Object.values(S.players).forEach(p => p.online = false);
    if (d.phase === 'podium') { S.phase = 'podium'; S.podiumStep = 3; S.roundIdx = d.roundIdx; return; }
    S.roundIdx = d.roundIdx; S.phase = 'scores'; S.paused = true; S.restored = true; S.pausedAt = Date.now();
    S.cur = null;
  },
  /* ---------- Vues envoyées aux téléphones ---------- */
  _dirty: false, _force: false,
  dirty(force) { this._dirty = true; if (force) this._force = true; if (!this._raf) this._raf = setTimeout(() => this.flush(), this._force ? 0 : 60); },
  flush() {
    this._raf = null; const force = this._force; this._dirty = false; this._force = false;
    Show.render();
    Object.values(this.S.players).forEach(p => { if (!p.online || p.left) return; const v = this.viewFor(p.id); const js = JSON.stringify(v); if (force || js !== p._lastView) { p._lastView = js; this.net.send(p.id, { type: 'view', view: v }); } });
  },
  viewFor(pid) {
    const S = this.S, p = S.players[pid], cur = S.cur, C = S.config;
    const rk = this.ranking();
    const myRow = this.isTeamMode() ? rk.find(r => r.id === p.team) : rk.find(r => r.id === pid);
    const isHost = pid === S.hostId;
    const team = p.team ? S.teams.find(t => t.id === p.team) : null;
    const v = {
      phase: S.phase, paused: S.paused, room: S.room,
      me: { id: pid, name: p.name, avatar: p.avatar, color: p.color, team: team ? { id: team.id, name: team.name, color: team.color, emoji: team.emoji } : null, score: this.scoreOf(pid), teamScore: team ? this.teamScore(team.id) : null, rank: myRow ? myRow.rank : null, of: rk.length, isHost, referee: p.referee },
      mode: C.mode, teamMode: this.isTeamMode(), teamAssign: C.teamAssign,
      teams: S.teams.map(t => ({ id: t.id, name: t.name, color: t.color, emoji: t.emoji, n: this.competitors().filter(x => x.team === t.id).length })),
      round: S.roundIdx + 1, rounds: S.rounds.length, timeLeft: this.timeLeft(), timeTotal: S.timer ? S.timer.total : 0, betLoss: C.points.betLoss
    };
    if (cur && !['lobby', 'home', 'loading', 'intro', 'podium'].includes(S.phase)) {
      const r = cur.round;
      v.q = cur.q; v.special = r.special && (r.special !== 'mystery' || S.phase === 'reveal') ? r.special : null; v.finale = r.finale;
      v.eligible = this.eligible(pid); v.answerType = this.answerType(r);
      v.captain = cur.captains && p.team ? this.nameOf(cur.captains[p.team]) : null;
      if (cur.duel) v.duel = cur.duel.map(id => this.nameOf(id));
      if (S.phase === 'bet') v.bet = cur.bets[pid] || null;
      if (['listen', 'buzzed', 'judge'].includes(S.phase)) {
        v.canBuzz = v.answerType === 'buzzer' && S.phase === 'listen' && this.canBuzz(pid, true);
        v.penaltyLeft = cur.penaltyUntil ? Math.max(0, cur.penaltyUntil - Date.now()) : 0;
        v.locked = cur.lockedOut.includes(pid) || (this.isTeamMode() && cur.teamLocked.includes(p.team));
        if (v.answerType === 'qcm') { v.choices = cur.choices; v.qField = cur.qField; }
        if (v.answerType === 'text') v.ask = r.special === 'either' ? 'either' : C.classicAsk;
        v.answered = !!cur.answers[pid]; if (cur.answers[pid]) v.myAnswer = cur.answers[pid];
        if (r.special === 'decade') v.decade = cur.decades[pid] ?? null;
        if (cur.buzzer) { const b = S.players[cur.buzzer]; v.buzzer = { id: b.id, name: b.name, avatar: b.avatar, color: b.color, team: this.teamName(b.team) }; v.iBuzzed = cur.buzzer === pid; v.answerSent = !!(cur.judgeInput && v.iBuzzed); }
        if (this.isTeamMode() && cur.buzzer && S.players[cur.buzzer].team === p.team) v.teamHasHand = true;
      }
      if (S.phase === 'reveal' || S.phase === 'scores') {
        v.track = { title: cur.track.title, artist: cur.track.artist, cover: cur.track.cover, year: cur.track.year || null };
        v.gain = (cur.gains || {})[pid] || 0; v.correct = (cur.corrects || []).includes(pid);
        v.myAnswer = cur.answers[pid] || null; if (cur.choices) { v.choices = cur.choices; v.correctIdx = cur.correct; }
        v.waitHost = !!cur.waitHost;
      }
    }
    if (S.phase === 'podium') { v.podium = rk.slice(0, 5).map(r => ({ name: r.name, avatar: r.avatar, score: r.score, rank: r.rank, color: r.color })); }
    if (isHost) v.host = this.hostView();
    return v;
  },
  hostView() {
    const S = this.S, cur = S.cur;
    const h = {
      config: S.config, source: { status: this.sources.status, label: this.sources.label, count: (this.sources.pool || []).length, error: this.sources.error || '', localCount: LocalFiles.tracks.length },
      players: this.players().map(p => ({ id: p.id, name: p.name, avatar: p.avatar, team: p.team, online: p.online, referee: p.referee, score: this.scoreOf(p.id), isHost: p.id === S.hostId })),
      ranking: this.ranking().map(r => ({ id: r.team ? 'team:' + r.id : r.id, name: r.name, score: r.score, rank: r.rank })),
      corrections: S.corrections.slice(-12).reverse(), voice: Voice.label(), restored: !!S.restored
    };
    if (cur && ['buzzed', 'judge'].includes(S.phase) && cur.buzzer) {
      const showAnswer = S.phase === 'judge' || (cur.judgeInput && cur.judgeInput.auto !== 'ok');
      if (showAnswer && !S.players[S.hostId].referee) cur.hostSaw = true;
      h.judge = { name: this.nameOf(cur.buzzer), input: cur.judgeInput ? { text: cur.judgeInput.text, kind: cur.judgeInput.kind, auto: cur.judgeInput.auto, t: Math.round(cur.judgeInput.analysis.title * 100), a: Math.round(cur.judgeInput.analysis.artist * 100) } : null, either: cur.round.special === 'either', answer: showAnswer ? cur.track.title + ' — ' + cur.track.artist : null };
    }
    if (cur && S.phase === 'listen') h.answersIn = Object.keys(cur.answers).length + '/' + this.answerersExpected().length;
    return h;
  }
};

  key_(e) {

        <div class="side"><div class="ring" id="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="7"/><circle id="ringc" cx="50" cy="50" r="44" fill="none" stroke="url(#rg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/><defs><linearGradient id="rg"><stop offset="0" stop-color="#2de2e6"/><stop offset="1" stop-color="#ff2e88"/></linearGradient></defs></svg><div class="num" id="ringn"></div></div>

  buildReveal() {

    const gains = Object.entries(cur.gains || {});

      extra = `<div class="choices" style="margin-top:2rem">${cur.choices.map((c, i) => `<div class="choice ${i === cur.correct ? 'good' : ''}"><span class="k k${i}">${'ABCD'[i]}</span>${esc(c)}<span class="cnt">${counts[i]}</span><span class="bar" style="width:${counts[i] / tot * 100}%"></span></div>`).join('')}</div>`;

      ${extra}
      <div class="gains">${gains.length ? gains.sort((a, b) => b[1] - a[1]).map(([pid, v], i) => { const p = S.players[pid]; return p ? `<div class="gain" style="animation-delay:${0.6 + i * 0.12}s">${this.av(p)}<b>${esc(p.name)}</b><span class="pts ${v < 0 ? 'neg' : ''}">${v > 0 ? '+' : ''}${v}</span></div>` : ''; }).join('') : `<div class="note">${failed ? 'Aucun point attribué sur ce morceau.' : 'Personne ne marque sur ce morceau.'}</div>`}</div>

  buildScores() {
    const rk = Game.ranking().slice(0, 8);
    return `<div class="scores"><h2>CLASSEMENT</h2>${rk.map((r, i) => {
      const mv = r.prevRank == null ? '' : r.prevRank > r.rank ? `<span class="up">▲${r.prevRank - r.rank}</span>` : r.prevRank < r.rank ? `<span class="down">▼${r.rank - r.prevRank}</span>` : '<span style="color:var(--mute)">=</span>';
      return `<div class="srow ${r.rank === 1 ? 'first' : ''}" style="animation-delay:${i * 0.09}s"><div class="rk">${r.rank}</div><div class="av" style="background:${r.color}33">${esc(r.avatar)}</div><div><div class="nm">${esc(r.name)}</div>${r.members ? `<div class="mem">${r.members.map(m => esc(m.name) + ' ' + m.score).join(' · ')}</div>` : ''}</div><div class="sc">${r.score}</div><div class="mv">${r.delta ? `<div style="font-size:1.2rem;color:var(--lime)">${r.delta > 0 ? '+' : ''}${r.delta}</div>` : ''}${mv}</div></div>`;

  buildPodium() {
    const S = Game.S, rk = Game.ranking();
    const at = n => { const g = rk.filter(r => r.rank === n); if (!g.length) return null; return g.length === 1 ? g[0] : { ...g[0], name: g.slice(0, 3).map(r => r.name).join(' · ') + (g.length > 3 ? ' +' + (g.length - 3) : '') + ' (ex æquo)' }; };
    const step = (r, n) => r ? `<div class="step p${n} ${S.podiumStep >= 4 - n ? 'on' : ''}">${n === 1 ? '<div class="winner-name">👑 VAINQUEUR</div>' : ''}<div class="av" style="background:${r.color}33">${esc(r.avatar)}</div><div class="nm">${esc(r.name)}</div><div class="sc">${r.score} pts</div><div class="block">${n}</div></div>` : '';
    const winners = rk.filter(r => r.rank === 1);

    return `<div class="podium">${step(at(2) || (winners.length > 1 ? null : null), 2)}${firstHtml}${step(at(3), 3)}</div><div style="position:absolute;bottom:.4rem;left:0;right:0;text-align:center"><button class="ghostbtn" id="newBtn" style="margin:0;background:rgba(7,6,15,.7)">↻ NOUVELLE PARTIE</button></div>`;

      const C = S.config, src = Game.sources;
      const cats = C.source === 'deezer' ? C.cats.map(c => catById(c) ? catById(c).icon + ' ' + catById(c).name : '').join(' · ') : (C.source === 'local' ? 'Vos fichiers' : 'Catalogue démo');
      const spec = C.specials.map(s => SPECIALS[s].icon).join(' ');

        <span class="badge ${src.status === 'fallback' || src.status === 'error' ? 'warn' : ''}">♪ ${src.status === 'loading' ? 'Chargement des titres…' : src.status === 'ready' ? src.count + ' titres prêts' : src.status === 'fallback' ? 'Secours : catalogue démo (' + esc(src.error) + ')' : src.status === 'error' ? esc(src.error) : '—'}</span>
        ${C.source === 'deezer' ? '<span class="badge">Extraits Deezer : écoute strictement privée et familiale</span>' : ''}`);
      const host = S.players[S.hostId];
      setHTML($('#waitline'), host ? `👑 <b>${esc(host.name)}</b> est l’animateur : il règle et lance la partie depuis son téléphone. ${C.source === 'local' ? '<button class="ghostbtn" id="pickBtn" style="margin:0">📂 Choisir mes fichiers (' + LocalFiles.tracks.length + ')</button>' : ''}` : 'Le premier joueur connecté devient l’animateur de la partie.');
      const p = $('#pickBtn'); if (p) p.onclick = () => $('#files').click();
    }
    if (['prep', 'bet', 'listen', 'buzzed', 'judge'].includes(ph) && S.cur) {
      const cur = S.cur, at = Game.answerType();
      const strip = $('#strip');
      if (strip) {
        const elig = new Set(Game.eligiblePlayers().map(p => p.id));
        setHTML(strip, Game.competitors().map(p => {
          const st = !p.online ? '💤' : cur.buzzer === p.id ? '🔴' : cur.lockedOut.includes(p.id) || (Game.isTeamMode() && cur.teamLocked.includes(p.team)) ? '🔒' : cur.answers[p.id] ? '✅' : cur.bets[p.id] === 'double' ? '🎲' : cur.bets[p.id] === 'pass' ? '🙅' : cur.decades[p.id] ? '📅' : '';
          const team = p.team ? S.teams.find(t => t.id === p.team) : null;
          return `<div class="chip ${cur.answers[p.id] ? 'ans' : ''} ${!elig.has(p.id) || cur.lockedOut.includes(p.id) ? 'lock' : ''} ${p.online ? '' : 'off'}" style="${team ? 'border-color:' + team.color + '66' : ''}"><div class="av" style="background:${p.color}33">${esc(p.avatar)}</div>${esc(p.name)}<b>${Game.scoreOf(p.id)}</b><span class="st">${st}</span></div>`;
        }).join(''));
      }
      const st = $('#status');
      if (st) {
        let txt = '';
        if (ph === 'prep') txt = 'Préparez-vous…';
        else if (ph === 'bet') txt = `Quitte ou double ? <small>${Object.keys(cur.bets).length}/${Game.competitors().length} choix faits</small>`;
        else if (ph === 'listen') {
          if (at === 'buzzer') txt = cur.penaltyUntil && Date.now() < cur.penaltyUntil ? 'Pénalité… buzzers bloqués' : cur.stealMode ? 'VOL DE RÉPONSE ! Buzzers ouverts' : 'BUZZERS OUVERTS !';
          else txt = `Réponses reçues <small>${Object.keys(cur.answers).length} / ${Game.answerersExpected().length}</small>`;
          if (cur.round.special === 'intro' && !AudioEngine.playing) txt += '<small>Plus de musique… à vous de deviner !</small>';
        } else txt = 'Réponse en cours…';
        if (st.innerHTML !== txt) st.innerHTML = txt;
      }
      const db = $('#duelBadge'); if (db) { db.style.display = cur.duel || cur.captains && at !== 'buzzer' || S.config.teamFormat === 'duel' && Game.isTeamMode() ? '' : 'none'; db.textContent = cur.duel ? '⚔️ ' + cur.duel.map(id => Game.nameOf(id)).join(' vs ') : cur.captains ? '🎙 Répondent : ' + Object.values(cur.captains).map(id => Game.nameOf(id)).join(', ') : ''; }
      const qb = $('#qcmbox');
      if (qb && at === 'qcm' && cur.choices && ph === 'listen' && !qb.dataset.on) { qb.dataset.on = 1; qb.innerHTML = `<div class="choices">${cur.choices.map((c, i) => `<div class="choice"><span class="k k${i}">${'ABCD'[i]}</span>${esc(c)}</div>`).join('')}</div>`; }
      const dw = $('#discwrap'); if (dw) dw.classList.toggle('playing', AudioEngine.playing);

  },
  tick() {
    const S = Game.S, ring = $('#ringc');
    if (ring && S.timer) {
      const left = Game.timeLeft(), tot = S.timer.total || 1, k = clamp(left / tot, 0, 1);
      ring.setAttribute('stroke-dashoffset', String(276.5 * (1 - k)));
      const n = $('#ringn'), sec = Math.ceil(left / 1000); if (n.textContent !== String(sec)) { n.textContent = sec; if (sec <= 5 && sec > 0 && !S.paused && S.phase === 'listen') AudioEngine.sfx('tick'); }
      $('#ring').classList.toggle('hurry', sec <= 5);
    } else if (ring) { ring.setAttribute('stroke-dashoffset', '0'); $('#ringn').textContent = ''; }
    const ft = $('#flashTime'); if (ft && S.timer) ft.textContent = Math.ceil(Game.timeLeft() / 1000) + ' s';
    if (S.phase === 'listen' && S.cur && S.cur.penaltyUntil && Math.abs(S.cur.penaltyUntil - Date.now()) < 120) this.update();

  flash() {
    const S = Game.S, el = $('#flash'), cur = S.cur;
    const on = cur && ['buzzed', 'judge'].includes(S.phase) && cur.buzzer;
    if (!on) { el.classList.remove('on'); el.dataset.k = ''; return; }
    const p = S.players[cur.buzzer], k = cur.q + cur.buzzer;
    if (el.dataset.k !== k) {
      el.dataset.k = k; el.style.setProperty('--fc', p.color);
      el.innerHTML = `<div class="bg"></div><div class="inner"><div class="big">BUZZER !</div><div class="av">${esc(p.avatar)}</div><div class="nm">${esc(p.name)}${p.team ? ' · ' + esc(Game.teamName(p.team)) : ''}</div><div class="tm" id="flashTime"></div><div id="flashSaid"></div></div>`;
      el.classList.add('on');
    }
    const ji = cur.judgeInput;
    $('#flashSaid').innerHTML = (ji ? `<div class="said">${ji.kind === 'voice' ? '🎤' : '⌨️'} « ${esc(ji.text)} »</div>` : '<div class="said">À toi ! Le titre et l’artiste…</div>') + (S.phase === 'judge' ? '<div class="wait">L’animateur vérifie la réponse…</div>' : '');
  },
  flashJoin() { },
  flashBuzz() { },
  startViz() {
    cancelAnimationFrame(this.vizRaf);
    const bars = $$('.viz i'); let ph = 0;
    const bpm = () => AudioEngine.synth ? 60 / AudioEngine.synth.beat : 118;
    const loop = () => {
      if (!document.body.contains(bars[0])) return;
      const playing = AudioEngine.playing; ph += 1;
      const t = performance.now() / 1000, beat = (t * bpm() / 60) % 1, kick = Math.pow(1 - beat, 3);
      if (ph % 2 === 0) bars.forEach((b, i) => { const v = playing ? 0.25 + 0.55 * kick * (0.6 + 0.4 * Math.sin(i * 1.7 + t * 3)) + 0.3 * Math.random() * Math.abs(Math.sin(i + t)) : 0.12; b.style.transform = `rotate(${i * 9}deg) translateY(14.6rem) scaleY(${v.toFixed(2)})`; });
      this.vizRaf = requestAnimationFrame(loop);
    };
    loop();
  },
  confetti() {
    const c = $('#confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
    const parts = Array.from({ length: document.documentElement.classList.contains('lowfx') ? 90 : 220 }, () => ({ x: Math.random() * c.width, y: -Math.random() * c.height, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, s: 6 + Math.random() * 8, r: Math.random() * 6, c: pick(COLORS) }));
    const t0 = performance.now();
    const loop = () => { x.clearRect(0, 0, c.width, c.height); parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; if (p.y > c.height) { p.y = -10; } x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }); if (performance.now() - t0 < 9000) requestAnimationFrame(loop); else x.clearRect(0, 0, c.width, c.height); };
    loop();
  }
};

/* ===== INTERFACE TÉLÉPHONE (manette) ===== */
const Pad = {
  view: null, key: '', recvAt: 0, sentBuzz: {}, drafts: {}, sheet: null, joined: false,
  boot() {
    document.documentElement.classList.add('pad');
    document.body.innerHTML = `<div id="pad"><div class="ptop" id="ptop"></div><div class="pmain" id="pmain"></div><div id="hostbar"></div></div><div id="overlay"></div>`;
    this.room = (PARAMS.get('room') || '').toUpperCase();
    this.profile = store.get('bts_profile', { name: '', avatar: pick(AVATARS) });
    if (!this.room) return this.askRoom();
    this.pid = store.get('bts_pid_' + this.room) || uid('p');
    store.set('bts_pid_' + this.room, this.pid);
    this.net = new Transport({ room: this.room, id: this.pid, role: 'player', onMessage: m => this.onMessage(m), onStatus: s => { this.netState = s; this.top(); if (s === 'ok' && this.joined) this.hello(); } });
    setInterval(() => { if (this.joined) this.net.send('tv', { type: 'ping', t: Date.now() }); }, 3000);
    setInterval(() => this.tick(), 200);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { this.net.reconnectNow(); if (this.joined) this.hello(); } else this.releaseAll(); });
    window.addEventListener('blur', () => this.releaseAll());
    window.addEventListener('pageshow', () => { if (this.joined) this.hello(); });
    if (this.profile.name && store.get('bts_joined_' + this.room)) { this.joined = true; this.hello(); this.waiting(); }
    else this.joinForm();
    window.BTS = { Pad };
  },
  send(type, data = {}) { this.net.send('tv', { type, ...data }); },
  host(cmd, data = {}) { this.send('host', { cmd, ...data }); },
  hello() { this.send('hello', { name: this.profile.name, avatar: this.profile.avatar }); },
  askRoom() {
    $('#pmain').innerHTML = `<div class="pcenter"><div class="plogo">BLIND TEST<span>SHOW</span></div><label class="lbl">Code de la salle (affiché sur la TV)</label><input class="field" id="roomIn" maxlength="6" style="text-transform:uppercase;text-align:center;font-size:1.6rem;letter-spacing:.3em" autocomplete="off"><button class="pbtn" id="roomGo">Continuer</button></div>`;
    $('#roomGo').onclick = () => { const r = $('#roomIn').value.trim().toUpperCase(); if (r.length >= 4) { const u = new URL(location.href); u.searchParams.set('room', r); u.searchParams.set('role', 'player'); location.href = u.toString(); } };
  },
  joinForm() {
    const p = this.profile;
    $('#pmain').innerHTML = `<div class="pcenter" style="justify-content:flex-start;padding-top:1rem"><div class="plogo">BLIND TEST<span>SHOW</span></div>
      <div class="psub">Salle <b style="color:var(--gold)">${esc(this.room)}</b> — choisis ton pseudo et ton avatar</div>
      <label class="lbl" for="nameIn">Pseudo</label><input class="field" id="nameIn" maxlength="16" value="${esc(p.name)}" placeholder="Ton pseudo" autocomplete="nickname">
      <label class="lbl">Avatar</label><div class="avgrid">${AVATARS.map(a => `<button data-a="${a}" class="${a === p.avatar ? 'on' : ''}">${a}</button>`).join('')}</div>
      <button class="pbtn" id="joinBtn">ENTRER SUR LE PLATEAU</button><div class="psub" style="font-size:.85rem">Aucun compte nécessaire. Si les extraits viennent de Deezer, l’écoute est réservée à un usage privé et familial.</div></div>`;
    $$('.avgrid button').forEach(b => b.onclick = () => { $$('.avgrid button').forEach(x => x.classList.remove('on')); b.classList.add('on'); this.profile.avatar = b.dataset.a; });
    const go = () => { const n = $('#nameIn').value.trim(); if (!n) { $('#nameIn').focus(); return; } this.profile.name = n.slice(0, 16); store.set('bts_profile', this.profile); store.set('bts_joined_' + this.room, true); this.joined = true; this.hello(); this.waiting(); this.wake(); };
    $('#joinBtn').onclick = go; $('#nameIn').onkeydown = e => { if (e.key === 'Enter') go(); };
  },
  waiting() { if (!this.view) $('#pmain').innerHTML = `<div class="pcenter"><div class="spinner" style="width:3rem;height:3rem;border-width:.35rem"></div><div class="psub">Connexion au plateau…</div></div>`; this.top(); },
  async wake() { try { if ('wakeLock' in navigator) this.wl = await navigator.wakeLock.request('screen'); } catch (e) { } },
  onMessage(m) {
    if (m.from !== 'tv') return;
    if (m.type === 'view') { this.view = m.view; this.recvAt = Date.now(); this.render(); }
    else if (m.type === 'rejoin') { if (this.joined) this.hello(); }
    else if (m.type === 'kicked') { store.del('bts_joined_' + this.room); store.del('bts_pid_' + this.room); this.joined = false; $('#pmain').innerHTML = '<div class="pcenter"><div class="ptitle">Tu as été retiré de la partie</div><button class="pbtn" onclick="location.reload()">Rejoindre à nouveau</button></div>'; }
    else if (m.type === 'buzzAck') { if (!m.ok && this.sentBuzz[m.q]) { this.sentBuzz[m.q] = false; this.key = ''; this.render(); } else if (m.ok && navigator.vibrate) navigator.vibrate([60, 40, 120]); }
    else if (m.type === 'pong') { this.lat = Date.now() - m.t; }
  },
  left() { const v = this.view; return v ? Math.max(0, v.timeLeft - (v.paused ? 0 : Date.now() - this.recvAt)) : 0; },
  top() {
    const v = this.view, me = v && v.me;
    $('#ptop').innerHTML = `<span class="net ${this.netState === 'ok' ? '' : 'lost'}" title="connexion"></span>${me ? `<div class="me"><div class="av" style="background:${me.color}44">${esc(me.avatar)}</div><span>${esc(me.name)}${me.isHost ? ' 👑' : ''}</span></div><div class="sc">${v.teamMode && me.team ? me.team.emoji + ' ' + me.teamScore : me.score} pts${me.rank ? ' · ' + ord(me.rank) : ''}</div>` : `<div class="me">Salle ${esc(this.room)}</div>`}`;
  },
  screenOf(v) {

        <div class="rowkv">Musique<input type="range" min="0" max="1" step="0.05" value="${C.musicVol}" data-vol="musicVol"></div>
        <div class="rowkv">Voix du présentateur<input type="range" min="0" max="1" step="0.05" value="${C.voiceVol}" data-vol="voiceVol"></div>
        <div class="rowkv">Effets sonores<input type="range" min="0" max="1" step="0.05" value="${C.sfxVol}" data-vol="sfxVol"></div>
        <div class="rowkv">Présentateur vocal<button class="tog ${C.voice ? 'on' : ''}" id="voiceTog"></button></div>
        <button class="pbtn alt" data-hm="endgame">🏁 Terminer et voir le podium</button>
        <button class="pbtn alt" data-hm="newgame">↻ Nouvelle partie (garder les joueurs)</button>
        <button class="pbtn alt" id="closeSheet">Fermer</button></div>`;
    }
    if (force || el._h !== html) {
      if (!force && el.contains(document.activeElement) && document.activeElement.type === 'range') return;
      el._h = html; el.innerHTML = html;
      const cs = $('#closeSheet', el); if (cs) cs.onclick = () => this.closeSheet();
      $$('[data-c]', el).forEach(b => b.onclick = () => {
        const target = b.dataset.c, name = h.ranking.find(r => r.id === target).name;
        let d = b.dataset.d;
        if (d === 'x') { const val = prompt('Points à ajouter (négatif pour retirer) pour ' + name + ' :', '200'); if (val === null) return; d = parseInt(val, 10); if (!d) return; }
        this.confirm(`${+d > 0 ? 'Ajouter' : 'Retirer'} ${Math.abs(+d)} points ${+d > 0 ? 'à' : 'à'} ${name} ?`, () => this.host('correct', { target, delta: +d, reason: 'correction animateur' }));
      });
      $$('[data-vol]', el).forEach(r => r.onchange = () => this.host('applyAudio', { [r.dataset.vol]: +r.value }));
      const vt = $('#voiceTog', el); if (vt) vt.onclick = () => this.host('applyAudio', { voice: !h.config.voice });
      $$('[data-hm]', el).forEach(b => b.onclick = () => this.confirm(b.dataset.hm === 'endgame' ? 'Terminer la partie maintenant ?' : 'Lancer une nouvelle partie ? Les scores seront remis à zéro.', () => { this.host(b.dataset.hm); this.closeSheet(); }));
    }
  },
  confirm(msg, ok) {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box"><div style="font-weight:700;font-size:1.1rem">${esc(msg)}</div><button class="pbtn ok" id="mOk">Confirmer</button><button class="pbtn alt" id="mNo">Annuler</button></div>`;
    document.body.appendChild(m);
    $('#mOk', m).onclick = () => { m.remove(); ok(); }; $('#mNo', m).onclick = () => m.remove();
  },
  // Réglages de la partie (salon)
  hostConfig(v, force) {
    const box = $('#hostcfg'); if (!box) return;
    if (!force && box.contains(document.activeElement) && /INPUT/.test(document.activeElement.tagName)) return;
    const h = v.host, C = h.config, src = h.source;
    const seg = (key, opts, multi) => `<div class="seg">${Object.entries(opts).map(([k, lbl]) => `<button data-k="${key}" data-v="${k}" class="${multi ? (C[key].includes(k) ? 'on' : '') : (String(C[key]) === String(k) ? 'on' : '')}">${lbl}</button>`).join('')}</div>`;
    const tog = (key, lbl) => `<div class="rowkv">${lbl}<button class="tog ${C[key] ? 'on' : ''}" data-tog="${key}"></button></div>`;
    const buzzerish = C.mode === 'buzzer' || (C.mode === 'equipes' && C.teamFormat !== 'capitaine');
    const html = `<div class="cfg">
      ${h.restored ? '<div class="notice">Partie restaurée après un redémarrage de la TV.</div>' : ''}
      <section><h4>Mode de jeu</h4><div class="modes">${Object.entries(MODES).map(([k, m]) => `<button data-k="mode" data-v="${k}" class="${C.mode === k ? 'on' : ''}"><span class="i">${m.icon}</span><span class="t">${m.name}</span></button>`).join('')}</div>
        ${C.mode === 'equipes' ? `<div style="margin-top:.7rem"></div>${seg('teamFormat', TEAM_FORMATS)}<div class="rowkv" style="margin-top:.5rem">Nombre d’équipes</div>${seg('teamCount', { 2: '2', 3: '3', 4: '4' })}<div class="rowkv">Composition</div>${seg('teamAssign', { auto: 'Automatique', manual: 'Chacun choisit' })}` : ''}
        ${C.mode === 'classique' ? `<div class="rowkv" style="margin-top:.5rem">Réponse attendue</div>${seg('classicAsk', CLASSIC_ASK)}` : ''}</section>
      <section><h4>Musique</h4>${seg('source', { deezer: 'Deezer (extraits 30 s)', local: 'Mes fichiers (sur la TV)', demo: 'Catalogue démo' })}
        <div class="srcstate ${src.status === 'fallback' || src.status === 'error' ? 'bad' : ''}" style="margin-top:.5rem">${src.status === 'loading' ? '⏳ Chargement des titres…' : src.status === 'ready' ? '✅ ' + src.count + ' titres prêts — ' + esc(src.label) : src.status === 'fallback' ? '⚠️ ' + esc(src.error) + ' → catalogue démo de secours' : src.status === 'error' ? '⚠️ ' + esc(src.error) : ''}</div>
        ${C.source === 'local' ? `<div class="notice" style="margin-top:.5rem">Les fichiers se choisissent sur la TV (bouton « Choisir mes fichiers », OK sur la télécommande). Nommez-les « Artiste - Titre.mp3 ». ${src.localCount} fichier(s) chargé(s).</div><button class="pbtn alt" data-hcmd="pickFiles" style="margin-top:.5rem">Montrer le bouton sur la TV</button>` : ''}
        ${C.source === 'deezer' ? `<div class="rowkv" style="margin-top:.6rem">Catégories</div>${seg('cats', Object.fromEntries(CATS.map(c => [c.id, c.icon + ' ' + c.name])), true)}` : ''}
        <div class="rowkv" style="margin-top:.6rem">Difficulté</div>${seg('difficulty', { facile: 'Facile', normal: 'Normale', expert: 'Expert' })}</section>
      <section><h4>Partie</h4><div class="rowkv">Nombre de manches</div>${seg('rounds', { 5: '5', 10: '10', 15: '15', 20: '20' })}
        <div class="rowkv" style="margin-top:.4rem">Temps d’écoute</div>${seg('listenSec', { 15: '15 s', 20: '20 s', 30: '30 s' })}
        ${buzzerish ? `<div class="rowkv" style="margin-top:.4rem">Temps pour répondre après un buzz</div>${seg('answerSec', { 8: '8 s', 10: '10 s', 15: '15 s' })}${tog('steal', 'Vol de réponse après une erreur')}<div class="rowkv">Pénalité avant de rebuzzer</div>${seg('penaltySec', { 1: '1 s', 2: '2 s', 4: '4 s' })}` : ''}
        ${tog('finale', 'Grande finale entre les meilleurs')}${C.finale ? `<div class="rowkv">Manches de finale</div>${seg('finalRounds', { 1: '1', 2: '2', 3: '3' })}<div class="rowkv">Multiplicateur de finale</div>${seg('finalMult', { 2: '×2', 3: '×3' })}` : ''}
        ${tog('autoNext', 'Enchaîner automatiquement')}</section>
      <section><h4>Manches spéciales</h4><div class="seg">${Object.entries(SPECIALS).map(([k, s]) => `<button data-k="specials" data-v="${k}" class="${C.specials.includes(k) ? 'on' : ''}" ${s.buzzerOnly && !buzzerish ? 'disabled' : ''}>${s.icon} ${s.name}</button>`).join('')}</div><div class="psub" style="text-align:left;font-size:.8rem;margin-top:.4rem">${C.specials.map(k => '• ' + SPECIALS[k].name + ' : ' + SPECIALS[k].desc).join('<br>')}</div></section>
      <section><h4>Présentateur & son</h4>${tog('voice', 'Présentateur vocal')}${seg('persona', Object.fromEntries(Object.entries(PERSONAS).map(([k, p]) => [k, p.name + ' — ' + p.desc])))}
        <div class="rowkv">Musique<input type="range" min="0" max="1" step="0.05" value="${C.musicVol}" data-num="musicVol"></div>
        <div class="rowkv">Voix<input type="range" min="0" max="1" step="0.05" value="${C.voiceVol}" data-num="voiceVol"></div>
        <div class="psub" style="text-align:left;font-size:.8rem">${esc(h.voice)}</div></section>
      <section><h4>Barème</h4>${[['title', 'Titre trouvé'], ['artist', 'Artiste trouvé'], ['speed', 'Bonus rapidité max (QCM, classique)'], ['firstBuzz', 'Bonus 1er buzzer'], ['steal', 'Bonus vol de réponse'], ['duel', 'Bonus duel'], ['decade', 'Bonus décennie'], ['betLoss', 'Perte quitte ou double']].map(([k, l]) => `<div class="rowkv">${l}<input type="number" min="0" max="5000" step="50" value="${C.points[k]}" data-pt="${k}"></div>`).join('')}</section>
      <section><h4>Joueurs</h4><div class="plist">${h.players.map(p => `<div class="prow"><span>${esc(p.avatar)}</span><span class="nm">${esc(p.name)}${p.isHost ? ' 👑' : ''}${p.online ? '' : ' 💤'}</span>${C.mode === 'equipes' && !p.referee ? `<select data-move="${p.id}" style="background:#221a44;color:#fff;border-radius:.4rem;border:1px solid var(--line);padding:.2rem">${v.teams.map(t => `<option value="${t.id}" ${p.team === t.id ? 'selected' : ''}>${t.emoji} ${esc(t.name)}</option>`).join('')}</select>` : ''}${!p.isHost ? `<button data-kick="${p.id}">Retirer</button>` : ''}</div>`).join('')}</div>
        ${C.mode === 'equipes' ? '<button class="pbtn alt" data-hcmd="shuffleTeams" style="margin-top:.5rem">🔀 Mélanger les équipes</button>' : ''}
        <div class="rowkv" style="margin-top:.5rem">Je ne joue pas (arbitre seulement)<button class="tog ${v.me.referee ? 'on' : ''}" id="refTog"></button></div></section>
      <button class="pbtn" id="startGame" style="font-size:1.3rem;padding:1.2rem;position:sticky;bottom:.6rem">🎬 LANCER LA PARTIE</button></div>`;
    if (box._h === html) return;
    box._h = html; box.innerHTML = html;
    const set = patch => this.host('config', { config: patch });
    $$('[data-k]', box).forEach(b => b.onclick = () => {
      const k = b.dataset.k, val = b.dataset.v;
      if (k === 'cats' || k === 'specials') { const arr = C[k].includes(val) ? C[k].filter(x => x !== val) : C[k].concat(val); set({ [k]: arr }); }
      else set({ [k]: /^\d+(\.\d+)?$/.test(val) ? +val : val });
    });
    $$('[data-tog]', box).forEach(b => b.onclick = () => set({ [b.dataset.tog]: !C[b.dataset.tog] }));
    $$('[data-num]', box).forEach(r => r.onchange = () => set({ [r.dataset.num]: +r.value }));
    $$('[data-pt]', box).forEach(r => r.onchange = () => set({ points: { ...C.points, [r.dataset.pt]: +r.value } }));
    $$('[data-move]', box).forEach(s => s.onchange = () => this.host('moveTeam', { pid: s.dataset.move, team: s.value }));
    $$('[data-kick]', box).forEach(b => b.onclick = () => this.confirm('Retirer ce joueur ?', () => this.host('kick', { pid: b.dataset.kick })));
    $$('[data-hcmd]', box).forEach(b => b.onclick = () => this.host(b.dataset.hcmd));
    $('#refTog', box).onclick = () => this.host('referee', { on: !v.me.referee });
    $('#startGame', box).onclick = () => this.host('start');
  }
};

(function () {
  if (PARAMS.get('role') === 'player') Pad.boot(); else Show.boot();
})();
</script>
</body>
</html>
