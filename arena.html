<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060607">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>IMPACT ARENA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Saira+Semi+Condensed:wght@400;600;700&display=swap">
<style>
/* Direction : combat clandestin haut de gamme. Noir profond, anthracite, blanc cassé, rouge incandescent, orange chaud ; cyan réservé au joueur 2 et aux jauges.
   Typographie sportive étroite (Teko) pour les titres, Saira pour les textes. */
:root{--k:#060607;--a:#1d1e21;--a2:#2a2b2f;--w:#f5f3ee;--m:#9c9a94;--r:#ff3b2f;--o:#ff9a1f;--c:#25e0ff;
  --fd:"Teko","sans-serif-condensed","Roboto Condensed","Arial Narrow","DejaVu Sans Condensed",Impact,sans-serif;--fb:"Saira Semi Condensed","Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--k);color:var(--w);font-family:var(--fb);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3{margin:0;font-family:var(--fd);font-weight:700;line-height:.9;letter-spacing:.01em}
p{margin:0}
/* ---------------- TÉLÉVISION (1rem = 1/96 de la largeur) ---------------- */
html.tv{font-size:calc(100vw/192)}
.tv #cv{position:fixed;inset:0;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;margin:auto;background:#000}
.tv #ui{position:fixed;inset:0;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;margin:auto}
.tv .scr{position:absolute;inset:0;padding:5rem 5rem 4rem}
.mbtn{font-family:var(--fd);font-weight:600;font-size:3.8rem;line-height:1;letter-spacing:.03em;padding:1.1rem 2.6rem .7rem;background:rgba(29,30,33,.88);color:var(--w);
  clip-path:polygon(1.2rem 0,100% 0,calc(100% - 1.2rem) 100%,0 100%);outline:none;transition:transform .12s,background .12s;white-space:nowrap}
.mbtn.main{background:var(--r)}
.mbtn.small{font-size:2.2rem;padding:.8rem 2rem .5rem;background:rgba(29,30,33,.6)}
.mbtn:focus{background:var(--w);color:var(--k);transform:translateX(.6rem) scale(1.04)}
.mbtn.main:focus{background:var(--o);color:var(--k)}
.row{display:flex;gap:1.6rem;align-items:center;flex-wrap:wrap}.row.center{justify-content:center}
.tv h1{font-size:7.4rem}
/* menu */
.menu .logo{position:absolute;left:5rem;top:6rem}
.logo .l1,.logo .l2{font-family:var(--fd);font-weight:700;font-size:17rem;line-height:.78;letter-spacing:-.01em;
  background:linear-gradient(180deg,#fff 0%,#ffd9b0 38%,var(--o) 62%,var(--r) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .6rem 2rem rgba(255,59,47,.35));animation:slam .7s cubic-bezier(.2,1.4,.3,1) both}
.logo .l2{animation-delay:.12s;margin-left:6rem}
.logo .sig{font-family:var(--fd);font-size:2.9rem;letter-spacing:.12em;color:var(--w);margin-top:2rem;opacity:.9;animation:fade 1s .6s both}
@keyframes slam{from{transform:scale(2.4) translateY(-4rem);opacity:0;filter:blur(.6rem)}}
@keyframes fade{from{opacity:0}}
.mnav{position:absolute;left:5rem;bottom:8rem;display:flex;flex-direction:column;align-items:flex-start;gap:1.1rem}
.menu .foot{position:absolute;right:5rem;bottom:4rem;font-size:2rem;color:var(--m)}
/* connexion */
.connect h1{margin-bottom:2.6rem}
.cgrid{display:grid;grid-template-columns:46rem 1fr;gap:5rem;align-items:start}
.qr{background:#fff;padding:2rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
.qr svg{width:42rem;height:42rem;display:block}
.qr.small svg{width:20rem;height:20rem}
.qr .url{color:#111;font-size:2.2rem;font-weight:700}
.cside .lab{font-size:2.4rem;color:var(--m);letter-spacing:.1em}
.cside .code{font-family:var(--fd);font-weight:700;font-size:13rem;line-height:.85;letter-spacing:.18em;color:var(--w)}
.cside .how{font-size:2.5rem;line-height:1.4;color:var(--m);max-width:62rem;margin:1rem 0 2.4rem}
.cside .how b{color:var(--w)}
.slot{position:relative;display:flex;align-items:baseline;gap:2rem;padding:1.6rem 2.4rem 1.2rem;margin-bottom:1rem;background:rgba(29,30,33,.85);border-left:.8rem solid var(--c);max-width:70rem;overflow:hidden}
.slot b{font-family:var(--fd);font-size:5rem;color:var(--c)}
.slot span{font-family:var(--fd);font-size:3.8rem;letter-spacing:.04em}
.slot:not(.on):not(.ai) span{color:var(--m)}
.slot.on span{color:var(--w)}
.slot .pulse{position:absolute;right:2rem;top:50%;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--c);transform:translateY(-50%);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--c)}100%{box-shadow:0 0 0 2.4rem transparent}}
.status{font-family:var(--fd);font-size:4.6rem;margin:1.6rem 0 2rem;color:var(--m);letter-spacing:.05em}
.status.ok{color:var(--o)}
/* sélection */
.select h1{text-align:center}
.pside{position:absolute;top:13rem;width:38rem;background:linear-gradient(180deg,rgba(6,6,7,.0),rgba(6,6,7,.75) 20%);padding:2rem}
.pside.s0{left:3rem}.pside.s1{right:3rem;text-align:right}
.pside .who{font-family:var(--fd);font-size:2.6rem;color:var(--c);letter-spacing:.08em}
.pside.s0 .who{color:var(--r)}.pside.s1 .who{color:var(--c)}
.pside h2{font-size:9rem}
.pside .ttl{font-family:var(--fd);font-size:3rem}
.pside .sty{color:var(--m);font-size:1.7rem;margin-bottom:1.4rem}
.sb{display:flex;align-items:center;justify-content:space-between;gap:1rem;font-size:1.6rem;text-transform:capitalize;margin:.4rem 0}
.sb i{display:flex;gap:.3rem}.sb em,.sb u{display:block;width:2.4rem;height:1rem;transform:skewX(-20deg)}
.sb em{background:var(--o)}.sb u{background:rgba(255,255,255,.12)}
.pside .state{font-family:var(--fd);font-size:2.8rem;margin-top:1.6rem;color:var(--m)}.pside .state.ok{color:var(--o)}
.pgrid{position:absolute;left:50%;bottom:5rem;transform:translateX(-50%);display:flex;gap:1.6rem}
.pcard{position:relative;width:15rem;background:var(--a);padding:.6rem;outline:.4rem solid transparent;transition:transform .15s}
.pcard img{width:100%;display:block}
.pcard b{display:block;font-family:var(--fd);font-size:2.6rem;text-align:center;padding-top:.4rem}
.pcard.p0{outline-color:var(--r);transform:translateY(-1rem)}.pcard.p1{outline-color:var(--c);transform:translateY(-1rem)}.pcard.p0.p1{outline-color:var(--o)}
.pcard .tag{position:absolute;top:-1.8rem;font-style:normal;font-family:var(--fd);font-size:2.2rem;padding:.2rem .8rem 0;color:var(--k)}
.pcard .t0{left:0;background:var(--r)}.pcard .t1{right:0;background:var(--c)}
/* arène */
.arena h1{text-align:center;margin-bottom:3rem}
.agrid{display:flex;gap:2.4rem;justify-content:center}
.acard{width:46rem;background:rgba(29,30,33,.9);padding:1rem;outline:.4rem solid transparent;opacity:.75}
.acard.sel{outline-color:var(--o);opacity:1;transform:scale(1.03)}
.acard img{width:100%;display:block}
.acard b{display:block;font-family:var(--fd);font-size:3.4rem;margin-top:1rem}
.acard span{font-size:1.6rem;color:var(--m)}
.arena .status{text-align:center}
/* duel */
.vs{display:grid;place-items:center}
.vn{position:absolute;top:8rem;font-family:var(--fd);font-weight:700;font-size:12rem;line-height:.8;animation:slide .6s cubic-bezier(.2,1.2,.3,1) both}
.vn small{display:block;font-size:3.2rem;font-weight:500;letter-spacing:.05em}
.v1{left:5rem}.v2{right:5rem;text-align:right;animation-name:slide2}
.vsx{font-family:var(--fd);font-weight:700;font-size:26rem;color:var(--w);text-shadow:0 0 4rem var(--o);animation:slam .5s .45s cubic-bezier(.2,1.6,.3,1) both}
.vsa{position:absolute;bottom:24rem;font-family:var(--fd);font-size:4rem;letter-spacing:.12em;animation:fade .6s .8s both}
@keyframes slide{from{transform:translateX(-60rem)}}@keyframes slide2{from{transform:translateX(60rem)}}
/* résultats */
.rbox{position:absolute;left:5rem;top:5rem;width:72rem}
.rbox .who{font-family:var(--fd);font-size:3.4rem;letter-spacing:.08em}
.rbox h1{font-size:15rem}
.rbox .score{font-family:var(--fd);font-size:6rem;margin:.4rem 0 1.6rem}.rbox .score small{font-size:2.6rem;color:var(--m)}
.rbox table{width:100%;border-collapse:collapse;font-size:2rem;margin-bottom:2.4rem;background:rgba(6,6,7,.6)}
.rbox th{text-align:left;font-weight:400;color:var(--m);padding:.5rem 1.2rem}.rbox td{font-family:var(--fd);font-size:3rem;text-align:center;padding:.3rem 1rem;width:16rem}
.rbox tr:first-child td{font-size:2.6rem}
/* galerie */
.glist{position:absolute;left:5rem;top:5rem;display:flex;flex-direction:column;gap:1rem;width:26rem}
.gbtn{display:flex;align-items:center;gap:1.4rem;font-family:var(--fd);font-size:3.6rem;padding:.6rem 1rem;background:rgba(29,30,33,.85);text-align:left;outline:none}
.gbtn img{width:7rem;height:7rem}.gbtn.sel{background:var(--a2);box-shadow:inset .6rem 0 0 var(--o)}.gbtn:focus{background:var(--w);color:var(--k)}
.ginfo{position:absolute;right:5rem;top:5rem;width:52rem;background:rgba(6,6,7,.78);padding:2.6rem;font-size:1.8rem;line-height:1.45}
.ginfo h1{font-size:9rem}.ginfo .ttl{font-family:var(--fd);font-size:2.8rem;color:var(--o)}.ginfo .bio{color:var(--m);margin:1rem 0 1.4rem}
.ginfo h3{font-size:3rem;margin-top:1.8rem}.ginfo i{color:var(--m)}
/* arènes */
.abox{position:absolute;left:5rem;bottom:5rem;max-width:80rem;background:rgba(6,6,7,.75);padding:2.6rem}
.abox .lab{font-family:var(--fd);font-size:2.4rem;color:var(--o);letter-spacing:.1em}
.abox h1{font-size:9rem}.abox p{font-size:2rem;color:var(--m);margin:1rem 0 2rem}
/* paramètres */
.opts{display:grid;gap:.8rem;max-width:90rem;margin:3rem 0 2.4rem}
.opt{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 2rem;background:rgba(29,30,33,.88);font-size:2.2rem;outline:none;text-align:left}
.opt b{font-family:var(--fd);font-size:3rem;color:var(--o)}
.opt:focus{background:var(--w);color:var(--k)}.opt:focus b{color:var(--r)}
/* surimpressions */
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,6,7,.6);z-index:10}
.panel{background:rgba(20,20,23,.96);padding:3.4rem 4rem;display:flex;flex-direction:column;gap:1.2rem;align-items:flex-start;min-width:56rem;border-top:.6rem solid var(--r)}
.panel.wide{max-width:110rem}
.panel h2{font-size:7rem}
.panel p{font-size:2rem;color:var(--m);max-width:80rem;line-height:1.4}
.guide p{font-size:2.1rem;color:var(--w);margin:.6rem 0}
.neterr{position:absolute;left:0;right:0;bottom:0;background:var(--r);color:#fff;font-size:1.8rem;padding:1rem 2rem;text-align:center;z-index:20}
/* ---------------- TÉLÉPHONE ---------------- */
html.pad,html.pad body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html.pad body{position:fixed;inset:0;width:100%}
.pad #cv{display:none}
.pad #ui{position:fixed;inset:0;overflow-y:auto}
.ph{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--a);border-bottom:4px solid var(--c)}
.ph b{font-family:var(--fd);font-size:28px;color:var(--c)}.ph span{color:var(--m);font-size:14px}
.pm{padding:28px 20px;display:flex;flex-direction:column;gap:16px;align-items:stretch;text-align:center;max-width:480px;margin:0 auto}
.pm h1{font-size:64px}.pm h2{font-size:42px}.pm p{color:var(--m);font-size:16px;line-height:1.45}
.plogo{font-size:72px!important;line-height:.8;background:linear-gradient(180deg,#fff,var(--o) 60%,var(--r));-webkit-background-clip:text;background-clip:text;color:transparent}
.win{color:var(--o)}.lose{color:var(--m)}
.pb{display:block;width:100%;padding:16px;font-family:var(--fd);font-size:28px;line-height:1;letter-spacing:.03em;background:var(--a2);color:var(--w);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.pb.main{background:var(--r)}.pb:active{transform:scale(.98)}
.code{font-family:var(--fd);font-size:56px;text-align:center;letter-spacing:.3em;text-transform:uppercase;padding:10px;background:var(--a);color:var(--w);border:2px solid var(--a2);outline:none;width:100%}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--a2);border-top-color:var(--o);animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.psel{padding:16px;display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
.psel h2{font-size:32px;text-align:center}
.psel>*,.pm>*{flex-shrink:0}
@media (orientation:landscape) and (max-height:500px){.psel .pgrid{max-width:420px;margin:0 auto;width:100%}.psel h2{font-size:26px}.pm h1{font-size:48px}.pm{gap:10px;padding:14px 20px}}
.psel .pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pc{background:var(--a);padding:4px;outline:3px solid transparent}.pc img{width:100%;display:block}.pc b{font-family:var(--fd);font-size:20px;display:block;padding-top:2px}
.pc.sel{outline-color:var(--c)}
.pinfo{text-align:center;font-family:var(--fd);font-size:24px}.pinfo small{font-family:var(--fb);font-size:14px;color:var(--m)}
.okmsg{text-align:center;color:var(--o);font-family:var(--fd);font-size:26px}
.pa{display:block;width:100%;text-align:left;background:var(--a);padding:14px 16px;outline:3px solid transparent}
.pa b{display:block;font-family:var(--fd);font-size:28px}.pa small{color:var(--m);font-size:14px}.pa.sel{outline-color:var(--o)}
/* manette */
.padwrap{position:fixed;inset:0;background:radial-gradient(ellipse at 70% 120%,#2a1410,transparent 60%),radial-gradient(ellipse at 10% 110%,#0f2226,transparent 55%),var(--k);touch-action:none}
.pbar{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;padding-top:env(safe-area-inset-top);background:rgba(29,30,33,.9);border-bottom:3px solid var(--c)}
.pbar b{font-family:var(--fd);font-size:26px;color:var(--c)}.pbar .nm{font-family:var(--fd);font-size:22px;min-width:70px}
.pbar .hp,.pbar .spg{flex:1;height:10px;background:rgba(255,255,255,.1);display:block;transform:skewX(-20deg)}.pbar .spg{flex:.6}
.pbar .hp em,.pbar .spg em{display:block;height:100%;background:linear-gradient(90deg,var(--r),var(--o));transition:width .2s}.pbar .spg em{background:var(--c)}
.mini{width:40px;height:32px;background:var(--a2);font-family:var(--fd);font-size:22px}
.jzone{position:absolute;left:0;top:46px;bottom:0;width:44%}
.bzone{position:absolute;right:0;top:46px;bottom:0;width:56%}
.jbase{position:absolute;left:30%;top:62%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,.02) 60%,transparent 61%),rgba(29,30,33,.7);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.12),0 0 30px rgba(0,0,0,.6)}
.jbase.act{box-shadow:inset 0 0 0 3px var(--c),0 0 30px rgba(37,224,255,.25)}
.knob{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a4b50,#1f2023 70%);box-shadow:0 6px 14px rgba(0,0,0,.6),inset 0 0 0 3px rgba(255,255,255,.15)}
.jbase span{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--fd);font-size:14px;color:var(--m)}.ju{top:6px}.jd{bottom:4px}
.btn{position:absolute;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-size:18px;letter-spacing:.04em;color:#fff;
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.28),transparent 55%),var(--bc,#333);box-shadow:0 6px 0 rgba(0,0,0,.5),0 10px 20px rgba(0,0,0,.5),inset 0 0 0 3px rgba(255,255,255,.18);transition:transform .05s}
.btn span{pointer-events:none;text-shadow:0 2px 3px rgba(0,0,0,.6)}
.btn.on{transform:translateY(4px) scale(.94);box-shadow:0 2px 0 rgba(0,0,0,.5),0 0 26px var(--bc),inset 0 0 0 3px #fff}
.btn.pu{--bc:#d8352a}.btn.kk{--bc:#e2741a}.btn.hv{--bc:#8e1a12;font-size:16px}.btn.gd{--bc:#1b6f80}.btn.dg{--bc:#3a3c42}.btn.gr{--bc:#5a3a1a}.btn.sp{--bc:#202227;color:var(--m)}
.btn.sp.ready{--bc:#13697a;color:#fff}.btn.sp.full{--bc:#25e0ff;color:#06232a;animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 6px 0 rgba(0,0,0,.5),0 0 30px #25e0ff,inset 0 0 0 3px #fff}}
.hitflash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px rgba(255,59,47,0)}
.hitflash.go{animation:hf .35s}
@keyframes hf{from{box-shadow:inset 0 0 80px rgba(255,59,47,.85)}}
.pov{position:absolute;inset:46px 0 0;background:rgba(6,6,7,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.pov h2{font-size:56px}.pov .pb{max-width:320px}
.rot{display:none;position:absolute;left:0;right:0;top:50px;text-align:center;font-size:13px;color:var(--m)}
@media (orientation:portrait){.pad .rot{display:block}.jzone{top:auto;height:46%;width:46%}.bzone{top:auto;height:52%;width:54%}.jbase{top:55%;left:45%}}
.gov{position:fixed;inset:0;background:rgba(6,6,7,.92);z-index:30;overflow-y:auto;padding:20px}
.gbox{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.45}.gbox h2{font-size:44px}.gbox b{color:var(--o)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
"use strict";
const Q = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
/* ===================================================================
   RENDU — combattants articulés, arènes, effets, interface de combat.
   Tout est dessiné dans un repère 1920×1080 (mis à l'échelle du canevas).
   =================================================================== */
const R = (function () {
  const W = 1920, H = 1080, G = IA.GROUND;
  const TAU = Math.PI * 2;
  /* ---------- couleurs ---------- */
  const colCache = {};
  function rgb(h) { if (colCache[h]) return colCache[h]; const n = parseInt(h.slice(1), 16); return (colCache[h] = [n >> 16, (n >> 8) & 255, n & 255]); }
  function mix(a, b, t) { const x = rgb(a), y = rgb(b); return "rgb(" + Math.round(x[0] + (y[0] - x[0]) * t) + "," + Math.round(x[1] + (y[1] - x[1]) * t) + "," + Math.round(x[2] + (y[2] - x[2]) * t) + ")"; }
  const shade = (c, t) => mix(c, "#000000", t), tint = (c, t) => mix(c, "#ffffff", t);

  /* ---------- formes de base ---------- */
  function capsule(ctx, a, b, r1, r2, fill, edge) {
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 0.001, nx = -dy / L, ny = dx / L;
    const ang = Math.atan2(dy, dx);
    ctx.beginPath();
    ctx.moveTo(a[0] + nx * r1, a[1] + ny * r1);
    ctx.lineTo(b[0] + nx * r2, b[1] + ny * r2);

    if (t.kind === "j") { jx = 0; jy = 0; const kn = document.querySelector(".knob"); if (kn) kn.style.transform = ""; const base = document.querySelector(".jbase"); if (base) base.classList.remove("act"); }
    else unpress(t.k);
    pushInput();
  }
  let fsTried = false;
  function tryFullscreen() {
    if (fsTried) return; fsTried = true;
    try { const d = document.documentElement; const p = d.requestFullscreen ? d.requestFullscreen({ navigationUI: "hide" }) : null; if (p && p.then) p.then(() => { try { screen.orientation.lock("landscape").catch(() => { }); } catch (e) { } }).catch(() => { }); } catch (e) { }
  }
  document.addEventListener("pointerdown", e => { if (e.target.closest && e.target.closest("#pad") && !e.target.closest("button")) onDown(e); }, { passive: false });
  document.addEventListener("pointermove", onMove, { passive: false });
  document.addEventListener("pointerup", onUp, { passive: false });
  document.addEventListener("pointercancel", onUp, { passive: false });
  document.addEventListener("lostpointercapture", onUp, { passive: false });
  /* plus aucun doigt sur l'écran : tout est relâché, même si un « lever » s'est perdu */
  ["touchend", "touchcancel"].forEach(ev => document.addEventListener(ev, e => { if (e.touches && e.touches.length === 0 && touches.size) { dropStale(); pushInput(); } }, { passive: true }));
  /* la page ne doit jamais défiler pendant un match */
  window.addEventListener("scroll", () => { if (document.getElementById("pad") && (window.scrollX || window.scrollY)) window.scrollTo(0, 0); }, { passive: true });
  if (window.visualViewport) ["resize", "scroll"].forEach(ev => window.visualViewport.addEventListener(ev, () => setTimeout(layoutPad, 60)));
  window.addEventListener("orientationchange", () => setTimeout(layoutPad, 300));
  ["touchstart", "touchmove"].forEach(ev => document.addEventListener(ev, e => { if (e.target.closest && e.target.closest("#pad") && !e.target.closest("button")) e.preventDefault(); }, { passive: false }));
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("dblclick", e => e.preventDefault());
  document.addEventListener("contextmenu", e => { if (e.target.closest && e.target.closest("#pad")) e.preventDefault(); });

  /* ---------- boutons des écrans ---------- */
  function bind() {
    const on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
    on("code-go", () => { const v = (document.getElementById("code").value || "").toUpperCase().replace(/[^A-Z]/g, ""); if (v.length !== 4) return; room = v; store.set("ia.room", room); codeEdit = false; err = null; render(); connect(); });
    on("chg", () => { codeEdit = true; try { ws && ws.close(); } catch (e) { } render(); });
    const gr = document.getElementById("go-room"); if (gr) gr.onclick = () => { room = gr.dataset.r; store.set("ia.room", room); err = null; send({ t: "join", room, tok }); render(); };
    IA.ROSTER.forEach((_, i) => on("pk-" + i, () => { ui("pick", i); vib(10); }));
    on("pick-ok", () => { ui("confirm"); vib(25); });
    on("unpick", () => ui("cancel"));
    R.ARENAS.forEach((_, i) => on("ar-" + i, () => { ui("arena", i); vib(10); }));
    on("ready", () => { ui("ready"); vib(25); });
    on("ar-back", () => ui("back"));
    on("r-again", () => ui("rematch")); on("r-change", () => ui("change")); on("r-menu", () => ui("menu"));
    on("pause", () => ui("pause")); on("resume", () => ui("resume"));
    on("guide", () => { root.insertAdjacentHTML("beforeend", guideHTML()); const c = document.getElementById("gclose"); if (c) c.onclick = () => c.closest(".gov").remove(); });
    const code = document.getElementById("code"); if (code) code.onkeydown = e => { if (e.key === "Enter") document.getElementById("code-go").click(); };
  }
  function guideHTML() {
    return `<div class="gov"><div class="gbox"><h2>COMMANDES</h2>
  <p><b>Joystick</b> : avancer, reculer · haut : saut · bas : accroupi</p>
  <p><b>POING</b> rapide · <b>PIED</b> portée · <b>PUISSANT</b> lent et lourd</p>
  <p><b>GARDE</b> (maintenir) : bloque. Accroupi : bloque les coups bas.</p>
  <p><b>ESQUIVE</b> : pas de côté · avec joystick arrière : recul</p>
  <p><b>PRISE</b> : de près · joystick arrière = projection derrière · <b>PRISE</b> juste après avoir été saisi = dégagement</p>
  <p><b>SPÉCIAL</b> : technique du combattant à 50 % de jauge · finition à 100 %, au contact</p>
  <p><b>Combos</b> : POING, POING, PIED · garde réussie puis POING = contre · esquive réussie puis PUISSANT = punition · avant + PIED = attaque d'approche</p>
  <button class="pb main" id="gclose">Compris</button></div></div>`;
  }

  window.__pad = { get state() { return S; }, get held() { return held; }, tok: () => tok, release };
  render();
  connect();
}

if (Q.has("tv")) startTV(); else startPad();
})();
