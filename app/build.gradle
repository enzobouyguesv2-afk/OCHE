plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.oche.flechettes'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.oche.flechettes'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
