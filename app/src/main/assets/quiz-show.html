<style>
:root{
  --bg:#050714;--bg2:#0b1235;--panel:rgba(16,24,66,.78);--panel2:rgba(28,40,104,.72);--line:rgba(130,160,255,.22);
  --txt:#f2f5ff;--mut:#9aa6cf;--bl:#3b82f6;--cy:#38bdf8;--vi:#8b5cf6;--gd:#f5c542;--gr:#34d399;--rd:#f87171;
  --disp:"LA Display","Roboto",Arial,sans-serif;--body:"LA Text","Roboto","Segoe UI",Arial,sans-serif;color-scheme:dark
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
/* ================= TÉLÉ : scène fixe 1920×1080 mise à l'échelle ================= */
html.tv,html.tv body{overflow:hidden}
html.tv body{background:#03040c}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:radial-gradient(ellipse 120% 80% at 50% 115%,#1b2a8a 0,#0a0f33 45%,#04050f 75%)}
#stage .safe{position:absolute;inset:54px 96px}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fx .beam{position:absolute;top:-200px;width:340px;height:1500px;background:linear-gradient(180deg,rgba(120,150,255,.16),transparent 70%);filter:blur(6px);transform-origin:top center;animation:sway 9s ease-in-out infinite alternate}
.fx .b1{left:180px;transform:rotate(18deg)}.fx .b2{left:820px;animation-delay:-3s;transform:rotate(-6deg)}.fx .b3{right:180px;animation-delay:-6s;transform:rotate(-20deg);background:linear-gradient(180deg,rgba(170,120,255,.16),transparent 70%)}
@keyframes sway{from{rotate:-6deg}to{rotate:6deg}}
.fx .floor{position:absolute;left:-10%;right:-10%;bottom:-260px;height:520px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(59,130,246,.35),transparent 65%)}
html.lowfx .fx .beam{animation:none}
.logo{font-family:var(--disp);line-height:.86;letter-spacing:-.01em;text-transform:uppercase}
.logo b{display:block;color:var(--txt)}
.logo span{display:block;background:linear-gradient(90deg,var(--gd),#ffe9a3,var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent}
.tvbtn{display:inline-flex;align-items:center;justify-content:center;gap:14px;padding:20px 40px;border-radius:22px;border:3px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(40,56,140,.9),rgba(22,32,90,.9));box-shadow:0 8px 0 rgba(6,10,40,.9),0 14px 40px rgba(0,0,0,.4);font-family:var(--disp);font-size:34px;letter-spacing:.01em;color:var(--txt);outline:none;transition:transform .15s,border-color .15s,box-shadow .15s}
.tvbtn.gold{background:linear-gradient(180deg,#ffe28a,#e0a91f);color:#1d1400;box-shadow:0 8px 0 #8a6200,0 14px 50px rgba(245,197,66,.35)}
.tvbtn.blue{background:linear-gradient(180deg,#60a5fa,#2563eb);box-shadow:0 8px 0 #1e3a8a,0 14px 50px rgba(59,130,246,.35)}
.tvbtn:focus{border-color:#fff;transform:translateY(-3px) scale(1.04);box-shadow:0 11px 0 rgba(6,10,40,.9),0 0 0 6px rgba(56,189,248,.35),0 18px 60px rgba(56,189,248,.35)}
.tvbtn.gold:focus{box-shadow:0 11px 0 #8a6200,0 0 0 6px rgba(255,226,138,.45),0 18px 70px rgba(245,197,66,.5)}
.tvbtn:disabled{opacity:.45}
.badge{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:24px;font-weight:700;color:var(--mut);white-space:nowrap}
.badge b{color:var(--txt)}
.screen{position:absolute;inset:0}
.glass{background:linear-gradient(180deg,rgba(28,40,110,.72),rgba(12,18,58,.82));border:1px solid var(--line);border-radius:30px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.35)}
.av{display:grid;place-items:center;border-radius:50%;flex:none}
/* Accueil */
#home{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#home .ring{position:relative;width:760px;height:430px;display:grid;place-items:center}
#home .ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:4px solid rgba(245,197,66,.55);box-shadow:0 0 60px rgba(245,197,66,.35),inset 0 0 60px rgba(245,197,66,.2);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 100px rgba(245,197,66,.55),inset 0 0 80px rgba(245,197,66,.3)}}
html.lowfx #home .ring::before{animation:none}
#home .logo{font-size:170px}
#home .tag{font-size:32px;color:#c8d2f5;margin:20px 0 34px;font-weight:600}
#home .acts{display:flex;gap:24px}
#home .cats{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
#home .cats span{padding:10px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:22px;font-weight:700}
/* Salon */
#lobby .head{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center}
#lobby .head .logo{font-size:64px}
#lobby .qr{position:absolute;left:0;top:130px;width:540px;padding:24px;text-align:center}
#lobby .qr .code{background:#fff;border-radius:20px;padding:16px;display:inline-block}
#lobby .qr .code svg{display:block;width:330px;height:330px}
#lobby .qr .room{font-family:var(--disp);font-size:76px;letter-spacing:.14em;color:var(--gd);line-height:1;margin-top:14px}
#lobby .qr .url{font-size:19px;color:var(--mut);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lobby .qr .help{font-size:22px;color:#c8d2f5;margin-top:10px}
#lobby .pl{position:absolute;left:580px;right:0;top:130px;height:560px;padding:26px 30px}
#lobby .pl h3{margin:0 0 20px;font-size:32px;color:var(--mut);font-weight:700}
#lobby .pl h3 b{color:var(--txt);font-family:var(--disp);font-size:44px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.slot{height:200px;border-radius:24px;border:2px dashed rgba(130,160,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut);font-size:22px}
.slot.on{border:2px solid;background:rgba(255,255,255,.05);color:var(--txt);animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
.slot .av{width:100px;height:100px;font-size:58px}
.slot b{font-size:28px;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot small{font-size:18px;color:var(--mut)}
.slot.off{opacity:.45}
@keyframes pop{from{transform:scale(.4);opacity:0}}
html.lowfx .slot.on{animation:none}
.teamcols{display:grid;gap:16px}
.tcol{border-radius:22px;border:2px solid;padding:16px;min-height:420px}
.tcol h4{margin:0 0 12px;font-family:var(--disp);font-size:36px}
.tcol .pm{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.05);margin-bottom:8px;font-size:24px;font-weight:700}
.tcol .pm .av{width:46px;height:46px;font-size:26px}
#lobby .cfg{position:absolute;left:580px;right:0;top:716px;display:flex;flex-wrap:wrap;gap:10px}
#lobby .acts{position:absolute;left:580px;right:0;bottom:0;display:flex;gap:20px;align-items:center}
#lobby .why{font-size:22px;color:var(--gd);font-weight:700}
/* Réglages télé */
#settings .head{display:flex;justify-content:space-between;align-items:center}
#settings h2{font-family:var(--disp);font-size:64px;margin:0}

.evchip{padding:12px 22px;border-radius:999px;font-size:26px;font-weight:800;background:linear-gradient(90deg,rgba(139,92,246,.5),rgba(59,130,246,.5));border:2px solid rgba(255,255,255,.25);animation:rise2 .5s cubic-bezier(.2,1.5,.4,1)}

/* Scores */
#scores h2{font-family:var(--disp);font-size:80px;margin:0;text-align:center}

.fcard .av{width:170px;height:170px;font-size:100px;margin:0 auto 14px}

/* Victoire */
#victory .champ{position:absolute;left:470px;right:470px;top:0;text-align:center}

.pod{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pod .av{width:76px;height:76px;font-size:44px;margin-bottom:6px}
.pod b{font-size:24px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .blk{width:100%;border-radius:18px 18px 0 0;display:grid;place-items:start center;padding-top:10px;font-family:var(--disp);font-size:60px;color:rgba(0,0,0,.45)}
.pod.p1 .blk{height:170px;background:linear-gradient(#ffe28a,#c99410)}.pod.p2 .blk{height:120px;background:linear-gradient(#eef2fb,#a3b0c9)}.pod.p3 .blk{height:85px;background:linear-gradient(#ffb47a,#b8641f)}

#victory .list .brow{height:70px}
#victory .list .brow b{font-size:24px}
#victory .list .brow .sc{font-size:32px}

#victory .stats{position:absolute;left:0;top:0;width:430px;display:flex;flex-direction:column;gap:12px}
.stat{padding:16px 20px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}

.netbad{position:absolute;right:96px;top:10px;z-index:25;border-color:rgba(245,197,66,.6)!important;color:var(--gd)!important}
.jkban{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:12;padding:30px 60px;border-radius:30px;background:linear-gradient(135deg,#7c3aed,#2563eb);border:3px solid rgba(255,255,255,.4);font-family:var(--disp);font-size:56px;text-align:center;box-shadow:0 30px 120px rgba(124,58,237,.6);animation:jk 2.4s ease-in-out forwards;pointer-events:none;white-space:nowrap}

/* ================= TÉLÉPHONE ================= */
html.ph,html.ph body{height:100%;overflow:hidden;overscroll-behavior:none}

.card h3{margin:0 0 10px;font-size:18px}
.card p{margin:0 0 8px;color:#cfd8f5;line-height:1.4;font-size:15px}
.h{font-family:var(--disp);font-size:32px;line-height:1.05;margin:4px 0 10px}
.lbl{display:block;font-size:13px;font-weight:800;color:var(--mut);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.field{width:100%;padding:15px 14px;border-radius:14px;border:2px solid var(--line);background:#0b1440;color:var(--txt);font-size:18px;outline:none}

.pbtn{display:block;width:100%;padding:16px;border-radius:16px;border:none;background:linear-gradient(180deg,#ffe28a,#e0a91f);color:#1d1400;font-weight:900;font-size:18px;margin-top:12px;box-shadow:0 5px 0 #8a6200;touch-action:manipulation;user-select:none;-webkit-user-select:none}

<script>
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const Q = new URLSearchParams(location.search);
const store = {

const rid = n => { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const b = new Uint8Array(n); (self.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_, i) => b[i] = Math.random() * 256); return Array.from(b, x => A[x % A.length]).join(""); };
function loadScript(src) { return new Promise((ok, ko) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => ko(new Error("Chargement impossible : " + src)); document.head.appendChild(s); }); }
const HOST = window.QS_HOST || null;
const IS_TV = !!(HOST && HOST.tv) && !Q.get("room") && Q.get("role") !== "player";
const LETTERS = ["A", "B", "C", "D"];
const TYPE_LABEL = { qcm: "QCM", vf: "VRAI OU FAUX", texte: "RÉPONSE ÉCRITE", rapide: "⚡ RAPIDITÉ" };
const mmss = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
/* Transport WebSocket commun : messages {room, from, to, type, ...}. Reconnexion automatique. */
class Net {
  constructor(room, id, role, onMsg, onState) {
    Object.assign(this, { room, id, role, onMsg, onState, ws: null, q: [], backoff: 400, closed: false, state: "init" });
    this.connect();
  }
  url() {
    const base = (HOST && HOST.wsUrl) || ((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/qs-ws");
    return base + "?room=" + encodeURIComponent(this.room) + "&id=" + encodeURIComponent(this.id) + "&role=" + this.role;
  }
  connect() {
    if (this.closed) return;
    let ws; try { ws = new WebSocket(this.url()); } catch (e) { return this.retry(); }
    this.ws = ws;
    ws.onopen = () => { this.backoff = 400; this.set("ok"); const q = this.q; this.q = []; q.forEach(t => ws.send(t)); };
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (_) { return; } if (!m || m.from === this.id) return; if (m.room && m.room !== this.room) return; if (m.to && m.to !== "*" && m.to !== this.id) return; this.onMsg(m); };
    ws.onclose = () => { if (this.ws === ws) { this.set("lost"); this.retry(); } };

  send(to, data) {
    const t = JSON.stringify(Object.assign({ room: this.room, from: this.id, to }, data));
    if (t.length > 250000) { console.warn("Message trop gros, non envoyé", data.type); return 0; }
    if (this.ws && this.ws.readyState === 1) this.ws.send(t); else { this.q.push(t); if (this.q.length > 40) this.q.shift(); }
    return t.length;

}

/* Sons originaux, synthétisés (aucun fichier audio). Ne démarrent qu'après une interaction autorisée. */
const Sfx = {
  ctx: null, vol: 0.7, on: true,
  unlock() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === "suspended") this.ctx.resume(); } catch (e) { } },
  tone(f, t, d, type, g) {
    if (!this.on || !this.ctx || this.ctx.state !== "running") return;
    const c = this.ctx, o = c.createOscillator(), a = c.createGain(), s = c.currentTime + t;
    o.type = type || "sine"; o.frequency.setValueAtTime(f, s);
    a.gain.setValueAtTime(0.0001, s); a.gain.exponentialRampToValueAtTime(Math.max(0.0002, (g || 0.3) * this.vol), s + 0.015); a.gain.exponentialRampToValueAtTime(0.0001, s + d);
    o.connect(a).connect(c.destination); o.start(s); o.stop(s + d + 0.05);
  },
  sweep(f1, f2, d, g) {
    if (!this.on || !this.ctx || this.ctx.state !== "running") return;
    const c = this.ctx, o = c.createOscillator(), a = c.createGain(), s = c.currentTime;
    o.type = "sawtooth"; o.frequency.setValueAtTime(f1, s); o.frequency.exponentialRampToValueAtTime(f2, s + d);
    a.gain.setValueAtTime(0.0001, s); a.gain.exponentialRampToValueAtTime((g || 0.12) * this.vol, s + 0.05); a.gain.exponentialRampToValueAtTime(0.0001, s + d);
    const fl = c.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = 2400;
    o.connect(fl).connect(a).connect(c.destination); o.start(s); o.stop(s + d + 0.05);
  },
  play(k) {
    switch (k) {
      case "launch": [392, 523, 659, 784].forEach((f, i) => this.tone(f, i * 0.09, 0.35, "triangle", 0.28)); this.tone(1046, 0.38, 0.6, "triangle", 0.22); break;
      case "tick": this.tone(1200, 0, 0.06, "square", 0.08); break;
      case "count": this.tone(660, 0, 0.18, "square", 0.16); break;
      case "go": this.tone(990, 0, 0.35, "square", 0.2); break;
      case "buzz": this.tone(220, 0, 0.18, "sawtooth", 0.3); this.tone(330, 0.12, 0.25, "sawtooth", 0.3); break;
      case "good": [523, 659, 784, 1046].forEach((f, i) => this.tone(f, i * 0.06, 0.4, "triangle", 0.25)); break;
      case "bad": this.tone(180, 0, 0.3, "square", 0.18); this.tone(140, 0.12, 0.35, "square", 0.16); break;
      case "level": this.tone(880, 0, 0.12, "sine", 0.12); this.tone(1320, 0.07, 0.15, "sine", 0.1); break;
      case "reveal": this.sweep(200, 1400, 0.55, 0.1); this.tone(1568, 0.5, 0.5, "triangle", 0.18); break;
      case "round": this.tone(523, 0, 0.12, "sine", 0.15); this.tone(784, 0.1, 0.18, "sine", 0.15); break;
      case "win": [523, 523, 523, 659, 784, 659, 784, 1046].forEach((f, i) => this.tone(f, i * 0.13, i === 7 ? 0.9 : 0.16, "triangle", 0.26)); break;
      case "click": this.tone(1500, 0, 0.04, "square", 0.06); break;
    }
  }
};



/* Musiques d'ambiance originales, synthétisées (aucun fichier). Elles ne bloquent jamais le jeu. */
const Music = {
  mode: "", t: null, step: 0, next: 0, on: true,
  PROG: { lobby: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], round: [[45, 52, 57], [41, 48, 53], [43, 50, 55], [40, 47, 52]], final: [[38, 45, 50], [38, 45, 49], [36, 43, 48], [37, 44, 49]] },
  f: n => 440 * Math.pow(2, (n - 69) / 12),
  set(mode) {
    if (mode === this.mode) return; this.mode = mode; clearInterval(this.t); this.t = null;
    if (!mode) return;
    this.step = 0; this.next = 0;
    this.t = setInterval(() => { try { this.pump(); } catch (e) { } }, 60);
  },
  pump() {
    const c = Sfx.ctx; if (!c || c.state !== "running" || !this.on || !Sfx.on) return;
    const bpm = this.mode === "round" ? 112 : this.mode === "final" ? 84 : 96, beat = 60 / bpm / 2;
    if (!this.next || this.next < c.currentTime) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.25) {
      const prog = this.PROG[this.mode] || this.PROG.lobby, ch = prog[Math.floor(this.step / 16) % prog.length], s = this.step % 16, t = this.next;
      const v = Sfx.vol * 0.06;
      if (s === 0) ch.forEach(n => this.note(this.f(n), t, beat * 15, "triangle", v * 0.8));          // nappe
      if (this.mode !== "final") { const arp = [0, 1, 2, 1][s % 4]; if (s % 2 === 0) this.note(this.f(ch[arp] + 12), t, beat * 0.9, "sine", v * 0.9); }
      if (s % 4 === 0) this.note(this.f(ch[0] - 12), t, beat * 1.6, "sine", v * 2.2);               // basse
      if (this.mode === "final" && (s === 0 || s === 2)) this.note(55, t, 0.18, "sine", v * 3);       // battement de cœur
      if (this.mode === "round" && s % 2 === 1) this.noise(t, v * 0.5);                                // charleston léger
      this.step++; this.next += beat;

  },
  note(f, t, d, type, g) { const c = Sfx.ctx, o = c.createOscillator(), a = c.createGain(); o.type = type; o.frequency.value = f; a.gain.setValueAtTime(0.0001, t); a.gain.exponentialRampToValueAtTime(Math.max(0.0002, g), t + 0.03); a.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(a).connect(c.destination); o.start(t); o.stop(t + d + 0.05); },

};
Sfx.play2 = function (k) {
  if (k === "joker") { [660, 880, 1175, 1568].forEach((f, i) => this.tone(f, i * 0.07, 0.3, "square", 0.12)); return; }
  if (k === "jingle") { [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => this.tone(f, i * 0.12, i === 6 ? 1 : 0.2, "triangle", 0.26)); return; }
  if (k === "lock") { this.tone(1046, 0, 0.08, "square", 0.08); return; }
  if (k === "suspense") { this.sweep(110, 330, 1.4, 0.08); return; }
  this.play(k);
};

/* ========================================================================================
   TÉLÉ
   ======================================================================================== */
const TV = {
  game: null, net: null, room: "", screen: "", lastSeq: -1, lastViews: {}, lastViewAt: 0, netState: "init", netLostAt: 0, built: "", lastPhase: "", setRow: 0,
  async boot() {
    document.documentElement.classList.add("tv");
    document.body.innerHTML = '<div id="stage"><div class="fx"><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div><div class="floor"></div></div><div class="safe" id="safe"></div><canvas id="confetti"></canvas><div id="toast"></div></div>';
    $("#stage").addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b) this.act(b.dataset.act, b); });
    this.fit(); addEventListener("resize", () => this.fit());
    try { await loadScript("/qs-engine.js"); await loadScript("/qs-questions.js"); await loadScript("/ia-qr.js"); }
    catch (e) { return this.fatal("Les fichiers du jeu n'ont pas pu être chargés.", "Revenez au menu Soirée Jeux puis relancez QUIZ SHOW."); }
    this.restoreOrNew();
    this.applyFx();
    document.addEventListener("keydown", e => this.key(e));
    document.addEventListener("pointerdown", () => Sfx.unlock());
    addEventListener("pagehide", () => this.save());
    setInterval(() => this.loop(), 100);
    setInterval(() => this.housekeeping(), 2000);
    this.show(this.game.st.phase === "lobby" ? (Q.get("screen") || "home") : "game");
    window.QS_TV = this;
  },
  fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080), st = $("#stage"); if (!st) return; st.style.transform = "translate(" + Math.round((innerWidth - 1920 * s) / 2) + "px," + Math.round((innerHeight - 1080 * s) / 2) + "px) scale(" + s + ")"; this.fitTexts(); },
  applyFx() {
    const C = this.game.st.config;
    document.documentElement.classList.toggle("lowfx", !C.anim || matchMedia("(prefers-reduced-motion: reduce)").matches);
    Sfx.on = !!C.sound; Sfx.vol = (C.volume == null ? 70 : C.volume) / 100; Music.on = !!C.music;
  },
  restoreOrNew() {
    const saved = store.get("qs_state", null);
    this.game = new QS.Game({ bank: QS_BANK });
    let restored = false;
    if (saved && saved.room && Date.now() - (saved.savedAt || 0) < 6 * 3600e3) restored = this.game.restore(saved, Date.now());
    if (!restored) { this.game.st.room = rid(6); const cfg = store.get("qs_cfg", null); if (cfg) this.game.applyConfig(cfg); }
    this.room = this.game.st.room; this.connect();
    if (restored && this.game.st.paused) setTimeout(() => this.toast("Partie retrouvée : OK pour reprendre"), 800);
  },
  newRoom() {
    if (this.net) this.net.close(); store.del("qs_state");
    const cfg = this.game.st.config; this.game = new QS.Game({ bank: QS_BANK, config: cfg });
    this.game.st.room = rid(6); this.room = this.game.st.room; this.lastViews = {}; this.connect();
  },
  connect() {
    this.net = new Net(this.room, "tv", "tv", m => this.onMsg(m), s => { this.netState = s; if (s !== "ok" && !this.netLostAt) this.netLostAt = Date.now(); if (s === "ok") { this.netLostAt = 0; this.lastViews = {}; } this.renderNet(); });
  },
  publicUrl() { return ((HOST && HOST.publicUrl) || (location.origin + "/quiz-show")) + "?room=" + this.room; },
  save() { this.saveAt = Date.now(); try { localStorage.setItem("qs_state", this.game.save(this.saveAt)); } catch (e) { } },
  saveCfg() { store.set("qs_cfg", this.game.st.config); this.applyFx(); },
  /* ----- Messages des téléphones ----- */
  onMsg(m) {
    const g = this.game, now = Date.now(), pid = m.from;
    try {
      if (pid === "server") { if (m.type === "peer-left") g.offline(m.id); return; }
      if (typeof pid !== "string" || !pid) return;
      const known = g.st.players[pid];
      if (known && known.key && m.k !== known.key) { this.net.send(pid, { type: "refused", reason: "identifiant déjà utilisé par un autre téléphone" }); return; }
      const before = !!known;
      const r = g.handle(pid, m, now) || {};
      if (m.type === "hello") {
        if (!r.ok) { this.net.send(pid, { type: r.reason === "pleine" ? "full" : "refused", reason: r.reason }); return; }
        const np = g.st.players[pid]; if (np && !np.key && typeof m.k === "string") np.key = m.k.slice(0, 40);
        this.lastViews[pid] = ""; if (!before) Sfx.play2("lock");
      } else if (r.rejoin) { this.net.send(pid, { type: "rejoin" }); return; }
      if (m.mid) this.net.send(pid, Object.assign({ type: "ack", mid: m.mid, for: m.type }, r));
      if (m.type === "answer" && r.ok) Sfx.play2("lock");
      if (m.type === "joker" && r.ok) this.jokerFx(g.st.events[g.st.events.length - 1]);
    } catch (e) { console.error(e); this.toast("Erreur interne : " + e.message); }
  },
  loop() {
    const g = this.game, now = Date.now();
    try { g.tick(now); } catch (e) { console.error(e); }
    const S = g.st;
    if (S.seq !== this.lastSeq || now - this.lastViewAt > 1000) this.sendViews(now, S.seq !== this.lastSeq);
    if (S.seq !== this.lastSeq) {
      this.lastSeq = S.seq;
      if (now - (this.saveAt || 0) > 600) this.save(); else if (!this.saveT) this.saveT = setTimeout(() => { this.saveT = 0; this.save(); }, 650);
      this.react(); this.render();
    } else this.renderTimers(now);
  },
  housekeeping() {
    const g = this.game, now = Date.now(); this.save();
    Object.values(g.st.players).forEach(p => { if (p.online && now - (p.lastSeen || 0) > 12000) g.offline(p.id); });
    this.renderNet();
  },
  sendViews(now, changed) {
    const g = this.game; this.lastViewAt = now;
    for (const p of Object.values(g.st.players)) {
      if (!p.online) continue;
      const v = g.viewFor(p.id, now), key = JSON.stringify(v).replace(/"(remain|reading)":\d+/g, "");
      if (changed && this.lastViews[p.id] === key) continue;
      this.lastViews[p.id] = key; this.net.send(p.id, { type: "view", v });
    }
  },
  react() {
    const S = this.game.st;
    if (S.phase !== this.lastPhase) {
      const was = this.lastPhase; this.lastPhase = S.phase;
      const map = { lobby: this.screen === "settings" || this.screen === "home" ? this.screen : "lobby", themes: "game", roundIntro: "game", question: "game", reveal: "game", scores: "game", finalIntro: "game", fquestion: "game", freveal: "game", victory: "game" };
      if (map[S.phase] && this.screen !== map[S.phase]) this.show(map[S.phase]);
      if (S.phase === "roundIntro") Sfx.play2("jingle");
      if (S.phase === "question" || S.phase === "fquestion") { Sfx.play("round"); this.lastTick = 0; }
      if (S.phase === "reveal" || S.phase === "freveal") { const L = S.last, any = L && Object.values(L.results).some(r => r === "ok"); Sfx.play(L && L.cancelled ? "reveal" : any ? "good" : "bad"); }
      if (S.phase === "finalIntro") Sfx.play2("suspense");
      if (S.phase === "victory") { Sfx.play("win"); setTimeout(() => this.confetti(), 300); }
      const mus = { lobby: "lobby", themes: "lobby", roundIntro: "round", question: "round", reveal: "round", scores: "lobby", finalIntro: "final", fquestion: "final", freveal: "final" }[S.phase] || "";
      Music.set(S.paused ? "" : mus);
    }
    Music.set(S.paused ? "" : ({ lobby: "lobby", themes: "lobby", roundIntro: "round", question: "round", reveal: "round", scores: "lobby", finalIntro: "final", fquestion: "final", freveal: "final" }[S.phase] || ""));
  },
  /* ----- Écrans ----- */
  show(name) { if (name !== "game") { this.confettiStop = true; const cv = $("#confetti"); if (cv) cv.getContext("2d").clearRect(0, 0, cv.width, cv.height); } this.screen = name; this.built = ""; $("#safe").innerHTML = ""; this.render(); const f = $("#safe .tvbtn, #safe .row, #safe .catc[tabindex]"); if (f) f.focus(); },
  render() {
    try {
      const S = this.game.st;
      if (this.screen === "home") this.renderHome();
      else if (this.screen === "lobby") this.renderLobby();
      else if (this.screen === "settings") this.renderSettings();
      else if (this.screen === "game") {
        const map = { themes: "renderThemes", roundIntro: "renderRoundIntro", question: "renderQuestion", fquestion: "renderQuestion", reveal: "renderQuestion", freveal: "renderQuestion", scores: "renderScores", finalIntro: "renderFinalIntro", victory: "renderVictory" };
        if (map[S.phase]) this[map[S.phase]](); else if (S.phase === "lobby") this.show("lobby");
      }
      this.renderPause();
    } catch (e) { console.error(e); this.fatal("Un problème d'affichage est survenu.", e.message); }

  },
  rankList(v) { return '<div class="rows">' + v.ranking.map(r => '<div class="r' + (r.cid === (v.mode === "equipes" ? v.me.team : v.me.id) ? " me" : "") + '"><b style="flex:none;width:22px">' + r.rank + '</b><div class="av" style="background:' + r.color + '30">' + esc(r.avatar) + '</div><b>' + esc(r.name) + '</b><span class="s">' + r.score + '</span></div>').join("") + '</div>'; },
  html(v) {
    if (v.paused) return '<div class="card center"><div class="h">⏸ Pause</div><p>' + (v.pauseWhy === "restauree" ? "La télé a été rechargée : partie et scores conservés." : "L'organisateur a mis la partie en pause.") + '</p></div>';
    switch (v.phase) {
      case "lobby": {
        let h = '<div class="card center"><div class="h">Vous êtes sur le plateau !</div><p>Attendez que l\'organisateur lance la partie depuis la télé.</p><p class="mut small">' + v.players.length + ' joueur(s) connecté(s)</p></div>';
        if (v.mode === "equipes") h += '<div class="card"><h3>Choisissez votre équipe</h3><div class="seg">' + v.teams.map(t => '<button data-team="' + t.id + '" class="' + (v.me.team === t.id ? "on" : "") + '" style="' + (v.me.team === t.id ? "background:" + t.color + ";border-color:" + t.color : "color:" + t.color) + '">' + esc(t.name) + '</button>').join("") + '</div></div>';
        return h + '<div class="card"><h3>Comment jouer</h3><p>Les questions s\'affichent sur la télé. Répondez ici, le plus vite possible : 4 types de questions, 3 jokers à utiliser une fois chacun, et une grande finale pour les deux meilleurs.</p></div>';
      }
      case "themes": {
        const T = v.themes; if (!this.votesInit) { this.votesInit = true; this.myVotes = T.mine.slice(); } const mine = this.myVotes;
        if (T.mode !== "vote") return '<div class="card center"><div class="h">Choix des thèmes</div><p>L\'organisateur choisit les thèmes sur la télé.</p></div>';
        if (T.done) return '<div class="card center"><div class="h">Vote enregistré ✓</div><p>Vos thèmes : ' + esc(T.cats.filter(c => T.mine.includes(c.id)).map(c => c.icon + " " + c.name).join(", ") || "aucun") + '</p><p class="mut">En attente des autres joueurs… <b id="threm"></b></p></div>';
        return '<div class="card"><h3>Votez pour 3 thèmes maximum <span class="mut" id="threm"></span></h3><div class="tgrid">' + T.cats.map(c => '<button data-vote="' + c.id + '" class="' + (mine.includes(c.id) ? "on" : "") + '"><span class="i">' + c.icon + '</span>' + esc(c.name) + '</button>').join("") + '</div><button class="pbtn" id="voteGo">VALIDER MES THÈMES (' + mine.length + '/3)</button><div class="fb" id="fb"></div></div>';
      }
      case "roundIntro": return '<div class="card center"><div class="h">' + esc(v.next || "") + '</div><p>' + esc((v.cats || []).join(" · ")) + '</p><p class="mut">Regardez la télé, ça commence !</p></div><div class="card"><h3>Vos jokers</h3>' + this.jokerRow(v, true) + '</div>';
      case "scores": return '<div class="card center"><div class="h">Fin de la manche</div><p>Vous êtes <b>' + v.me.rank + (v.me.rank === 1 ? "er" : "e") + '</b> avec <b>' + v.me.score + ' pts</b> · ' + v.me.ok + ' bonne(s) réponse(s)</p><p class="mut">Ensuite : ' + esc(v.next || "") + '</p></div><div class="card"><h3>Classement</h3>' + this.rankList(v) + '</div>';
      case "finalIntro": return '<div class="card center"><div class="h">🏆 La grande finale</div><p>' + esc(v.final.names.join(" contre ")) + '</p><p>' + (v.final.me ? "<b>Vous êtes finaliste !</b> 3 points par bonne réponse, 15 secondes par question." : "Vous êtes spectateur : encouragez les finalistes !") + '</p></div>';
      case "victory": {
        const V = v.victory;
        return '<div class="card big"><div class="e">' + (V.iWon ? "🏆" : V.myRank <= 3 ? ["", "🥇", "🥈", "🥉"][V.myRank] : "🎉") + '</div><div class="g">' + (V.iWon ? "CHAMPION !" : V.myRank + (V.myRank === 1 ? "er" : "e")) + '</div><p>' + (V.iWon ? "Vous êtes le grand champion du QUIZ SHOW !" : "Champion : " + esc(V.champion)) + '</p><p class="mut">' + v.me.ok + ' bonne(s) réponse(s) · ' + v.me.score + ' pts</p></div><div class="card"><h3>Classement final</h3><div class="rows">' + V.ranking.map(r => '<div class="r' + (r.cid === (v.mode === "equipes" ? v.me.team : v.me.id) ? " me" : "") + '"><b style="flex:none;width:22px">' + r.rank + '</b><div class="av" style="background:' + r.color + '30">' + esc(r.avatar) + '</div><b>' + esc(r.name) + '</b><span class="s">' + r.score + '</span></div>').join("") + '</div></div><p class="center mut">L\'organisateur peut relancer une partie depuis la télé.</p>';
      }
      case "question": case "fquestion": return this.questionHtml(v);
      case "reveal": case "freveal": return this.revealHtml(v);
    }
    return '<div class="card center"><p>Synchronisation…</p></div>';
  },
  jokerRow(v, preview) {
    const c = v.cur, J = [["fifty", "½", "50/50"], ["double", "×2", "Double"], ["steal", "🦹", "Vol"]].filter(j => v.jokersOn[j[0]]);
    if (!J.length) return '<p class="mut small">Pas de jokers dans cette partie.</p>';
    return '<div class="jks">' + J.map(([k, ic, n]) => { const avail = v.myJokers.includes(k), on = c && c.joker === k;
      const dis = preview || !avail || !c || c.answered || c.joker || c.final || (k === "fifty" && !(c.type === "qcm" || c.type === "rapide")) || this.reading() > 0 || this.pending.joker;
      return '<button data-jk="' + k + '" class="' + (avail || on ? "" : "used") + (on ? " on" : "") + '"' + (dis && !on ? " disabled" : on ? " disabled" : "") + '><b>' + ic + '</b>' + n + '</button>'; }).join("") + '</div>';
  },
  questionHtml(v) {
    const c = v.cur, rd = this.reading();
    let h = '<div class="qhead"><span class="cat" style="border-color:' + c.cat.color + ';background:' + c.cat.color + '22">' + c.cat.icon + " " + esc(c.cat.name) + '</span><span class="chip">' + (c.final ? (c.sd ? "Mort subite" : "Finale " + c.n + "/" + c.total) : "Q" + c.n + "/" + c.total) + '</span><span class="chip gd">' + c.points + ' pts</span><span class="chip" id="tleft"></span></div><div class="tbar" id="tbar"><i></i></div>';
    if (c.why === "spectateur") return h + '<div class="card center"><div class="h">👀 Finale en cours</div><p>' + esc(v.final.names.join(" " + v.final.scores[0] + " – " + v.final.scores[1] + " ")) + '</p><p class="mut">Seuls les finalistes répondent.</p></div>';
    if (!c.final) h += this.jokerRow(v);
    if (rd > 0) return h + '<div class="card center" id="rdg"><div class="h">Lisez la question</div><p>Elle est affichée sur la télé…</p></div>';
    if (c.answered) {
      const lab = c.type === "texte" ? "« " + esc(c.mine) + " »" : (c.type === "vf" ? (c.mine === 0 ? "Vrai" : "Faux") : LETTERS[c.mine] + ". " + esc(c.opts[c.mine]));
      return h + '<div class="card big"><div class="e">🔒</div><div class="a">' + lab + '</div><p>' + (c.answeredBy && c.answeredBy !== v.me.name ? "Réponse de votre équipe (" + esc(c.answeredBy) + ")." : "Réponse enregistrée.") + ' Verdict à la fin du temps.</p></div><div class="fb" id="fb"></div>';
    }
    if (c.type === "texte") return h + '<div class="card"><label class="lbl" for="ans">Votre réponse</label><input class="field" id="ans" maxlength="60" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="Tapez votre réponse" value="' + esc(this.draft) + '"><button class="pbtn" id="ansGo"' + (this.pending.answer ? " disabled" : "") + '>VALIDER</button><div class="fb" id="fb"></div></div>';
    const vf = c.type === "vf";
    return h + '<div class="popts' + (vf ? " vf" : "") + '">' + c.opts.map((o, i) => '<button data-o="' + i + '" class="' + (c.removed && c.removed.includes(i) ? "gone" : "") + '"' + (this.pending.answer ? " disabled" : "") + '><span class="l">' + (vf ? (i === 0 ? "✓" : "✗") : LETTERS[i]) + '</span><span>' + esc(o) + '</span></button>').join("") + '</div><div class="fb" id="fb"></div>';
  },
  revealHtml(v) {
    const R = v.result || {}, c = v.cur;
    if (R.cancelled) return '<div class="card big"><div class="e">⚠️</div><div class="a">Question annulée</div><p>Aucun point pour personne.</p></div>';
    const spect = c && c.why === "spectateur";
    let h = '<div class="card big"><div class="e">' + (spect ? "👀" : R.mine === "ok" ? "✅" : R.mine === "ko" ? "❌" : "⏱️") + '</div>' + (spect ? "" : '<div class="g" style="color:' + (R.mine === "ok" ? "var(--gr)" : "var(--rd)") + '">' + (R.mine === "ok" ? (R.gain >= 0 ? "+" : "") + R.gain : R.mine === "ko" ? "RATÉ" : "PAS DE RÉPONSE") + '</div>') +
      '<div class="a">' + esc(R.correctText) + '</div><p class="small">' + esc(R.expl) + '</p></div>';
    (R.stolenFrom || []).forEach(s => h += '<div class="fb ' + (s.ok ? "ok" : "ko") + '">' + (s.ok ? "🦹 Vous volez " + s.pts + " pts à " + esc(s.name) + " !" : "🦹 Vol raté sur " + esc(s.name)) + '</div>');
    (R.stolenBy || []).forEach(s => h += '<div class="fb ko">🦹 ' + esc(s.name) + ' vous a volé ' + s.pts + ' pts</div>');
    if (v.final) h += '<div class="card center"><p>Finale : ' + esc(v.final.names[0]) + ' <b>' + v.final.scores[0] + '</b> – <b>' + v.final.scores[1] + '</b> ' + esc(v.final.names[1]) + '</p></div>';
    else h += '<div class="card"><h3>Classement</h3>' + this.rankList(v) + '</div>';
    return h;
  },
  bind(v) {
    $$("[data-team]").forEach(b => b.onclick = () => this.act("team", { team: b.dataset.team }, "team"));
    $$("[data-vote]").forEach(b => b.onclick = () => {
      const id = b.dataset.vote, i = this.myVotes.indexOf(id);
      if (i >= 0) this.myVotes.splice(i, 1); else { if (this.myVotes.length >= 3) { this.feedback("ko", "3 thèmes maximum"); return; } this.myVotes.push(id); }
      this.send("vote", { cats: this.myVotes, done: false }); this.render(true);
    });
    const vg = $("#voteGo"); if (vg) vg.onclick = () => this.act("vote", { cats: this.myVotes, done: true }, "vote");
    if (v.phase !== "themes") this.votesInit = false;
    $$("[data-o]").forEach(b => b.onclick = () => { if (b.disabled) return; if (this.act("answer", { choice: +b.dataset.o, q: v.cur.q }, "answer")) { $$("[data-o]").forEach(x => x.disabled = true); b.classList.add("on"); } });
    const inp = $("#ans"), go = $("#ansGo");
    if (inp) { inp.oninput = () => this.draft = inp.value; const send = () => { const t = inp.value.trim(); if (!t) { this.feedback("ko", "Tapez une réponse"); return; } if (this.act("answer", { text: t, q: v.cur.q }, "answer")) go.disabled = true; }; go.onclick = send; inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); send(); } }; }
    $$("[data-jk]").forEach(b => b.onclick = () => {
      if (b.disabled) return; const j = b.dataset.jk;
      if (j === "steal") return this.stealSheet(v);
      this.act("joker", { j, q: v.cur.q }, "joker");
    });
  },
  stealSheet(v) {
    const t = v.cur.targets; if (!t.length) return this.feedback("ko", "Aucun adversaire");
    document.body.insertAdjacentHTML("beforeend", '<div class="sheet" id="sheet"><div class="in"><div class="h">🦹 Voler les points de…</div><p class="mut small">Si vous répondez juste, vous prenez les points qu\'il gagnera sur cette question.</p><div class="rows">' + t.map(x => '<button class="pbtn alt" data-tg="' + esc(x.cid) + '" style="margin-top:6px">' + esc(x.name) + '</button>').join("") + '</div><button class="pbtn alt" id="shX">Annuler</button></div></div>');
    $$("#sheet [data-tg]").forEach(b => b.onclick = () => { this.act("joker", { j: "steal", target: b.dataset.tg, q: v.cur.q }, "joker"); $("#sheet").remove(); });
    $("#shX").onclick = () => $("#sheet").remove();
  }
};
const QS_AV = ["🦊", "🐼", "🦉", "🐯", "🐸", "🦄", "🐙", "🦖", "👽", "🤖", "👑", "🚀", "🎩", "🔥", "🎧", "🍕", "🌶️", "🐝", "🦁", "🧠"];

window.addEventListener("error", e => { if (IS_TV && window.QS_TV) TV.toast("Erreur : " + (e.message || "inconnue")); });
if (IS_TV) TV.boot(); else PH.boot();
</script>
</body>
</html>
