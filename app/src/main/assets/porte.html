<style>
:root{
  --bg:#04060d;--panel:rgba(8,14,30,.80);--panel2:rgba(20,32,64,.78);--line:rgba(140,175,230,.20);
  --txt:#eef3ff;--mut:#93a0bf;--cy:#4cc9f0;--vx:#7dd3fc;--gd:#e9b44c;--gr:#4ade80;--rd:#f87171;--vi:#c084fc;--or:#fb923c;
  --disp:"LA Display","Roboto",Arial,sans-serif;--body:"LA Text","Roboto","Segoe UI",Arial,sans-serif;color-scheme:dark
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
/* ================= TÉLÉ : scène 1920×1080 mise à l'échelle ================= */
html.tv,html.tv body{overflow:hidden}
html.tv body{background:#020308}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:radial-gradient(ellipse 110% 90% at 50% 40%,#0b1730 0,#050a18 55%,#020308 100%)}
#bgart{position:absolute;inset:0;transition:opacity .8s}
#bgart svg{width:100%;height:100%;display:block}
#bgart::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,4,10,.55),rgba(2,4,10,.25) 30%,rgba(2,4,10,.7))}
#stage .safe{position:absolute;inset:54px 96px}
.logo{font-family:var(--disp);text-transform:uppercase;line-height:.9;letter-spacing:.04em}
.logo small{display:block;font-size:.26em;letter-spacing:.3em;color:var(--vx);margin-bottom:.25em}
.logo b{display:block;background:linear-gradient(180deg,#fff7e0,var(--gd) 60%,#a8741e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 24px rgba(233,180,76,.25))}
.tvbtn{display:inline-flex;align-items:center;justify-content:center;gap:14px;padding:18px 36px;border-radius:16px;border:3px solid rgba(255,255,255,.07);background:linear-gradient(180deg,rgba(30,48,92,.95),rgba(14,24,52,.95));box-shadow:0 7px 0 rgba(3,6,16,.95),0 14px 40px rgba(0,0,0,.45);font-family:var(--disp);font-size:30px;letter-spacing:.03em;color:var(--txt);outline:none;transition:transform .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.tvbtn.gold{background:linear-gradient(180deg,#f6d27e,#c98a22);color:#1c1200;box-shadow:0 7px 0 #6e4a0b,0 14px 50px rgba(233,180,76,.3)}
.tvbtn.blue{background:linear-gradient(180deg,#5cc8f0,#1f7fb8);box-shadow:0 7px 0 #0c3d5c,0 14px 50px rgba(76,201,240,.3)}
.tvbtn:focus{border-color:#fff;transform:translateY(-3px) scale(1.04);box-shadow:0 10px 0 rgba(3,6,16,.95),0 0 0 6px rgba(125,211,252,.4),0 18px 60px rgba(76,201,240,.35)}
.tvbtn.gold:focus{box-shadow:0 10px 0 #6e4a0b,0 0 0 6px rgba(246,210,126,.5),0 18px 70px rgba(233,180,76,.5)}
.tvbtn:disabled{opacity:.4}
.badge{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:24px;font-weight:700;color:var(--mut);white-space:nowrap}
.badge b{color:var(--txt)}
.screen{position:absolute;inset:0}
.glass{background:linear-gradient(180deg,rgba(14,24,48,.86),rgba(6,10,22,.9));border:1px solid var(--line);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(3px)}
.kick{font-size:22px;font-weight:800;letter-spacing:.3em;color:var(--vx);text-transform:uppercase}
.av{display:grid;place-items:center;border-radius:50%;flex:none}
/* La Porte (dessin original) */
.gate{display:block}
.gate .glyphs{transform-origin:500px 500px;transition:transform 1.1s cubic-bezier(.5,0,.3,1)}
.gate .chev .lt{fill:#3a2a12;transition:fill .25s}
.gate .chev.on .lt{fill:#ffb648;filter:drop-shadow(0 0 14px #ffb648)}
.gate .vortex{opacity:0;transition:opacity .4s}
.gate.open .vortex{opacity:1}
.gate .vortex .sp{transform-origin:500px 500px;animation:spin 14s linear infinite}
.gate .vortex .sp2{animation-duration:9s;animation-direction:reverse}
.gate.burst .vortex{animation:burst 1.4s ease-out}
.gate.idle .glyphs{animation:spin 160s linear infinite}
.gate.idle .halo{animation:pulse 4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes burst{0%{transform:scale(.2);opacity:0}35%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
.gate .vortex{transform-origin:500px 500px}
html.lowfx .gate .vortex .sp,html.lowfx .gate.idle .glyphs,html.lowfx .gate.idle .halo,html.lowfx .flick,html.lowfx .aur,html.lowfx .spk{animation:none!important}
.flick{animation:flick 2.4s ease-in-out infinite alternate}
@keyframes flick{0%{opacity:.75}40%{opacity:1}60%{opacity:.82}100%{opacity:.95}}
.aur{animation:aur 12s ease-in-out infinite alternate}
@keyframes aur{to{transform:translateX(120px) skewX(-8deg);opacity:.55}}
.spk{animation:spk 3s linear infinite}
@keyframes spk{0%{opacity:0}20%{opacity:1}100%{opacity:0;transform:translate(40px,-60px)}}
/* Accueil */
#home{display:grid;grid-template-columns:840px 1fr;align-items:center;gap:30px}
#home .gwrap{position:relative;width:840px;height:840px}
#home .gwrap .gate{width:840px;height:840px}
#home .side{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
#home .logo{font-size:118px}
#home .tag{font-size:30px;color:#c4cee8;line-height:1.35;margin:4px 0 22px;max-width:820px}
#home .acts{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:820px}
#home .acts .tvbtn{justify-content:flex-start}
#home .acts .wide{grid-column:span 2;justify-content:center;font-size:36px;padding:24px}
#home .foot{font-size:20px;color:var(--mut);margin-top:12px}
/* Choix de mission */
#missions h2,#settings h2,#rules h2,#archives h2{font-family:var(--disp);font-size:66px;margin:0;letter-spacing:.02em}
.head{display:flex;justify-content:space-between;align-items:center;height:110px}
#missions .grid{position:absolute;top:140px;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.mcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:0;overflow:hidden;border-radius:26px;border:3px solid rgba(255,255,255,.07);background:#081020;outline:none;transition:transform .15s,border-color .15s}
.mcard:focus{border-color:#fff;transform:translateY(-6px) scale(1.02);box-shadow:0 0 0 6px rgba(125,211,252,.35)}
.mcard .art{width:100%;height:330px;position:relative;overflow:hidden}
.mcard .art svg{width:100%;height:100%}
.mcard .bd{padding:22px 24px;display:flex;flex-direction:column;gap:10px;flex:1;width:100%}
.mcard .code{font-family:var(--disp);font-size:26px;color:var(--vx);letter-spacing:.12em}
.mcard .nm{font-family:var(--disp);font-size:42px;line-height:1.05}
.mcard .sb{font-size:22px;color:var(--mut);line-height:1.35}
.mcard .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.mcard .meta span{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.07);font-size:19px;font-weight:700}
.mcard .best{position:absolute;top:16px;right:16px;padding:8px 14px;border-radius:999px;font-size:19px;font-weight:900;background:rgba(0,0,0,.6)}
/* Salle d'attente */
#lobby .qrbox{position:absolute;left:0;top:130px;width:560px;height:842px;padding:34px;display:flex;flex-direction:column;align-items:center;text-align:center}
#lobby .qr{background:#fff;padding:20px;border-radius:20px;width:440px;height:440px}
#lobby .qr svg{width:100%;height:100%;display:block}
#lobby .code{font-family:var(--disp);font-size:84px;letter-spacing:.2em;margin:20px 0 4px;color:var(--gd)}
#lobby .url{font-size:22px;color:var(--mut);word-break:break-all}
#lobby .steps{font-size:23px;color:#c4cee8;line-height:1.5;margin-top:16px}
#lobby .team{position:absolute;left:590px;right:0;top:130px;height:560px;padding:28px 32px}
#lobby .team h3,#lobby .cfgp h3{margin:0 0 16px;font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:var(--vx)}
#lobby .tl{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
#lobby .tl .p{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid var(--line);min-height:205px;text-align:center}
#lobby .tl .p .av{width:96px;height:96px;font-size:54px}
#lobby .tl .p b{font-size:28px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lobby .tl .p span{font-size:19px;color:var(--mut)}
#lobby .tl .p.off{opacity:.45}
#lobby .tl .slot{border-style:dashed;justify-content:center;color:var(--mut);font-size:22px}
#lobby .cfgp{position:absolute;left:590px;right:0;top:712px;height:120px;padding:14px 28px;display:flex;align-items:center;align-content:center;gap:10px;flex-wrap:wrap}
#lobby .cfgp .badge{font-size:20px;padding:6px 14px}
#lobby .acts{position:absolute;left:590px;right:0;bottom:0;display:flex;gap:18px;align-items:center}
#lobby .why{font-size:22px;color:var(--or);font-weight:700;max-width:420px;line-height:1.3}
/* Réglages */
#settings .list{position:absolute;top:140px;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}
.row{display:flex;justify-content:space-between;align-items:center;padding:20px 28px;border-radius:20px;background:var(--panel);border:3px solid rgba(255,255,255,.06);font-size:28px;font-weight:700;outline:none;text-align:left}
.row:focus{border-color:#fff;box-shadow:0 0 0 6px rgba(125,211,252,.3)}
.row .val{display:flex;align-items:center;gap:16px;color:var(--gd);font-family:var(--disp);font-size:30px}
.row .val i{font-style:normal;color:var(--mut);font-size:26px}
.row small{display:block;font-size:19px;color:var(--mut);font-weight:600;margin-top:4px}
#settings .hint{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:22px;color:var(--mut)}
/* Règles & archives */
#rules .cols,#archives .cols{position:absolute;top:140px;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px}
#archives .cols{grid-template-columns:1fr 2fr}
#archives .cxg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#archives .cxg .cx{margin:0}
#archives .c1 .cx{padding:8px 14px;margin-bottom:8px}
#archives .c1 .cx b{font-size:21px}
#archives .c1 .cx span{font-size:18px!important}
#rules .c,#archives .c{padding:28px 30px;overflow:hidden}
#rules h3,#archives h3{margin:0 0 14px;font-size:30px;color:var(--gd);font-family:var(--disp)}
#rules p,#rules li,#archives p,#archives li{font-size:23px;line-height:1.42;color:#d3dbf0;margin:0 0 10px}
#rules ul,#archives ul{margin:0;padding-left:26px}
#archives .cx{padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.05);margin-bottom:10px}
#archives .cx b{display:block;font-size:24px;color:var(--vx)}
#archives .cx.lock{opacity:.4}
/* Jeu */
#hud{position:absolute;left:0;right:0;top:0;height:84px;display:flex;align-items:center;gap:18px}
#hud .mi{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1}
#hud .mi b{font-family:var(--disp);font-size:24px;letter-spacing:.14em;color:var(--vx)}
#hud .mi span{font-family:var(--disp);font-size:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauges{display:flex;gap:12px}
.gg{width:166px;padding:8px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);transition:box-shadow .3s}
.gg .t{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:15px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.gg .t b{color:var(--txt);font-size:20px}
.gg .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}
.gg .bar i{display:block;height:100%;border-radius:4px;transition:width .6s}
.gg.flash-down{box-shadow:0 0 0 3px var(--rd),0 0 30px rgba(248,113,113,.6)}
.gg.flash-up{box-shadow:0 0 0 3px var(--gr),0 0 30px rgba(74,222,128,.5)}
.gg.danger .t b{color:var(--rd)}
.chrono{position:relative;width:84px;height:84px;flex:none}
.chrono svg{width:100%;height:100%;transform:rotate(-90deg)}
.chrono b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:28px}
.chrono.low .ring{stroke:var(--rd)}
.chrono.off{opacity:0}
#left{position:absolute;left:0;top:104px;width:1060px;height:728px;padding:38px 44px;display:flex;flex-direction:column}
#left .stitle{display:flex;align-items:baseline;gap:18px;margin-bottom:18px}
#left .stitle h1{font-family:var(--disp);font-size:56px;margin:0;line-height:1.05}
#left .stitle span{font-size:22px;color:var(--mut);font-weight:700;white-space:nowrap}
#left .narr{flex:1;min-height:0;overflow:hidden;font-size:30px;line-height:1.45;color:#e3e9f8}
#left .narr p{margin:0 0 18px;animation:fadeup .7s both}
#left .narr p:nth-child(2){animation-delay:.5s}#left .narr p:nth-child(3){animation-delay:1s}
#left .radio{margin-top:12px;padding:14px 20px;border-radius:14px;background:rgba(76,201,240,.08);border-left:4px solid var(--cy);font-size:24px;color:var(--vx);font-style:italic}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}
html.lowfx #left .narr p{animation:none}
#right{position:absolute;left:1090px;width:638px;top:104px;height:728px;padding:30px 32px;display:flex;flex-direction:column;overflow:hidden}
#right .k{font-size:21px;font-weight:900;letter-spacing:.28em;color:var(--vx);text-transform:uppercase;margin-bottom:12px}
#right h2{font-family:var(--disp);font-size:40px;line-height:1.1;margin:0 0 14px}
#right p{font-size:25px;line-height:1.42;color:#d8e0f2;margin:0 0 14px}
#right .info{font-size:24px;line-height:1.42;color:#c4cee8}
.ch{display:flex;gap:16px;padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin-bottom:12px}
.ch .l{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--disp);font-size:30px;background:rgba(76,201,240,.18);color:var(--vx)}
.ch b{display:block;font-size:27px;line-height:1.2}
.ch span{display:block;font-size:20px;color:var(--mut);margin-top:4px;line-height:1.3}
.ch .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ch .tags i{font-style:normal;font-size:16px;font-weight:800;padding:3px 10px;border-radius:999px;background:rgba(233,180,76,.14);color:var(--gd)}
.ch.lock{opacity:.4}
.ch.win{border-color:var(--gd);background:rgba(233,180,76,.12)}
.vcount{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:26px;font-weight:800;padding-top:10px}
.vcount .ord{color:var(--gd)}
.pzd{padding:24px;border-radius:18px;background:#050a16;border:2px solid rgba(76,201,240,.35);font-family:var(--disp);font-size:40px;line-height:1.35;text-align:center;letter-spacing:.06em;color:var(--vx);margin-bottom:16px;word-break:break-word}
.pips{display:flex;gap:10px;align-items:center;font-size:24px;font-weight:800;margin-bottom:12px}
.pips i{width:26px;height:26px;border-radius:50%;background:var(--gd);box-shadow:0 0 12px rgba(233,180,76,.6)}
.pips i.off{background:rgba(255,255,255,.12);box-shadow:none}
.tries{display:grid;gap:8px}
.tries div{padding:10px 14px;border-radius:12px;background:rgba(248,113,113,.1);font-size:21px;color:#fecaca}
.stamp{display:inline-block;padding:8px 20px;border-radius:12px;font-family:var(--disp);font-size:34px;letter-spacing:.06em;margin-bottom:12px}
.stamp.ok{background:rgba(74,222,128,.16);color:var(--gr);border:2px solid var(--gr)}
.stamp.ko{background:rgba(248,113,113,.14);color:var(--rd);border:2px solid var(--rd)}
.stamp.ev{background:rgba(251,146,60,.14);color:var(--or);border:2px solid var(--or)}
.stamp.gd{background:rgba(74,222,128,.12);color:var(--gr);border:2px solid var(--gr)}
.deltas{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.deltas span{padding:8px 14px;border-radius:999px;font-size:22px;font-weight:900}
.deltas .up{background:rgba(74,222,128,.15);color:var(--gr)}.deltas .dn{background:rgba(248,113,113,.15);color:var(--rd)}.deltas .nt{background:rgba(125,211,252,.14);color:var(--vx)}
.tally{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;font-size:19px;color:var(--mut)}
.tally span{padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.06)}
.tally span.w{color:var(--gd)}
#strip{position:absolute;left:0;right:0;bottom:0;height:120px;display:flex;gap:12px}
#strip .p{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:var(--panel);border:2px solid var(--line);position:relative}
#strip .p .av{width:62px;height:62px;font-size:34px}
#strip .p .nm{min-width:0}
#strip .p .nm b{display:block;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#strip .p .nm span{display:block;font-size:17px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#strip .p .st{position:absolute;top:8px;right:10px;font-size:22px}
#strip .p.off{opacity:.4}
#strip.many .p{padding:8px 10px;gap:8px}#strip.many .p .av{width:46px;height:46px;font-size:26px}#strip.many .p .nm b{font-size:20px}#strip.many .p .nm span{font-size:15px}#strip.many .p .st{font-size:18px;top:4px;right:6px}
#strip .p.done{border-color:var(--gr)}
#ann{position:absolute;left:84px;top:50px;width:740px;height:92px;display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;transform:translateY(-14px);padding:0 30px;border-radius:24px;background:#08101f;border:2px solid var(--gd);font-size:28px;font-weight:800;opacity:0;transition:all .4s;z-index:5;pointer-events:none;white-space:nowrap}
#ann.on{opacity:1;transform:none}
/* Rôles / briefing / porte / fin */
#roles{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:70px}
#roles h1{font-family:var(--disp);font-size:84px;margin:10px 0 8px}
#roles .sub{font-size:28px;color:#c4cee8;margin-bottom:40px}
#roles .rg{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;max-width:1700px}
#roles .rc{width:400px;padding:24px;border-radius:24px;background:var(--panel);border:2px solid var(--line);display:flex;gap:18px;align-items:center;animation:fadeup .6s both}
#roles .rc .ic{width:84px;height:84px;border-radius:20px;display:grid;place-items:center;font-size:48px;flex:none}
#roles .rc b{display:block;font-size:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#roles .rc span{display:block;font-size:22px;color:var(--mut)}
#roles .rc.ok{border-color:var(--gr)}
#roles .foot,#brief .foot{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;font-size:26px;color:var(--mut)}
#brief .hdr{display:flex;align-items:flex-end;gap:28px;height:150px}
#brief .hdr .code{font-family:var(--disp);font-size:52px;color:var(--vx);letter-spacing:.1em;margin-right:14px}
#brief .hdr h1{font-family:var(--disp);font-size:80px;margin:10px 0 0;line-height:1}
#brief .hdr span{font-size:24px;color:var(--mut);margin-left:auto;padding-bottom:12px}
#brief .lines{position:absolute;top:170px;left:0;width:1060px;height:500px;padding:34px 40px;font-size:29px;line-height:1.5;color:#e3e9f8}
#brief .lines p{margin:0 0 16px}
#brief .cols{position:absolute;top:170px;left:1090px;right:0;height:500px;display:grid;gap:16px}
#brief .cols .c{padding:20px 26px}
#brief .cols h3{margin:0 0 8px;font-size:21px;letter-spacing:.24em;color:var(--vx);text-transform:uppercase}
#brief .cols li{font-size:22px;line-height:1.38;color:#d8e0f2}
#brief .cols ul{margin:0;padding-left:24px}
#brief .eq{position:absolute;top:692px;left:0;right:0;height:150px;padding:20px 32px;display:flex;align-items:center;gap:20px}
#brief .eq .it{display:flex;align-items:center;gap:12px;padding:14px 20px;border-radius:16px;background:rgba(255,255,255,.04);border:2px solid var(--line);font-size:23px;font-weight:700;opacity:.5}
#brief .eq .it.on{opacity:1;border-color:var(--gd);background:rgba(233,180,76,.12)}
#brief .eq .it i{font-style:normal;font-size:36px}
#gatescr{display:flex;flex-direction:column;align-items:center}
#gatescr .gate{width:780px;height:780px;margin-top:-10px}
#gatescr .addr{display:flex;gap:18px;margin-top:6px}
#gatescr .addr div{width:96px;height:96px;border-radius:18px;background:rgba(255,255,255,.04);border:2px solid var(--line);display:grid;place-items:center;transition:all .3s}
#gatescr .addr div.on{border-color:#ffb648;background:rgba(255,182,72,.12);box-shadow:0 0 24px rgba(255,182,72,.4)}
#gatescr .addr svg{width:66px;height:66px}
#gatescr .cap{position:absolute;top:900px;left:0;right:0;text-align:center;font-family:var(--disp);font-size:40px;letter-spacing:.2em;color:var(--vx)}
#end .banner{text-align:center;margin-top:6px}
#end .banner .ty{font-family:var(--disp);font-size:36px;letter-spacing:.3em}
#end .banner h1{font-family:var(--disp);font-size:88px;margin:4px 0 0;line-height:1}
#end .txt{position:absolute;top:190px;left:0;width:1100px;height:250px;padding:28px 36px;font-size:27px;line-height:1.45;color:#e3e9f8;overflow:hidden}
#end .grade{position:absolute;top:190px;left:1130px;right:0;height:250px;display:flex;align-items:center;justify-content:center;gap:30px;padding:20px}
#end .grade .g{font-family:var(--disp);font-size:170px;line-height:1}
#end .grade .s{font-size:26px;color:var(--mut);line-height:1.5}
#end .grade .s b{color:var(--txt)}
#end .cols{position:absolute;top:462px;left:0;right:0;height:380px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px}
#end .cols .c{padding:22px 26px;overflow:hidden}
#end .cols h3{margin:0 0 12px;font-size:21px;letter-spacing:.24em;color:var(--vx);text-transform:uppercase}
#end .cols li{font-size:21px;line-height:1.35;margin-bottom:6px;color:#d8e0f2}
#end .cols ul{margin:0;padding-left:0;list-style:none}
#end .acts{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:20px}
/* Superpositions */
.ov{position:absolute;inset:0;background:rgba(2,4,10,.84);display:grid;place-items:center;text-align:center;z-index:20}
.ov h2{font-family:var(--disp);font-size:110px;margin:0 0 10px}
.ov p{font-size:30px;color:#c4cee8;max-width:1300px;margin:0 auto 34px;line-height:1.4}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:40px;border-radius:30px;background:#0a1226;border:1px solid var(--line);min-width:1040px}
.menu h3{grid-column:span 2;margin:0 0 6px;font-family:var(--disp);font-size:44px}
.menu .tvbtn{justify-content:flex-start;font-size:27px}
#toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%) translateY(30px);padding:18px 34px;border-radius:999px;background:#0f1a36;border:1px solid var(--line);font-size:28px;font-weight:700;opacity:0;transition:all .3s;z-index:30;pointer-events:none;max-width:1500px;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.netbad{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:25;color:#fecaca;border-color:var(--rd)}
/* ================= TÉLÉPHONE ================= */
html.ph,html.ph body{height:100%;overflow:hidden;overscroll-behavior:none}
html.ph body{background:radial-gradient(ellipse at 50% -10%,#10284a 0,#04060d 65%) fixed;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#ph{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom))}
#ph .top{display:flex;align-items:center;gap:10px;min-height:52px}
#ph .top .me{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
#ph .top .me .av{width:42px;height:42px;font-size:24px}
#ph .top .me b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ph .top .me small{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:800;white-space:nowrap}
#pres{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:4px 0 2px}
#pres div{padding:5px 4px;border-radius:10px;background:var(--panel);border:1px solid var(--line);text-align:center;font-size:12px;font-weight:800;color:var(--mut);line-height:1.2}
#pres div b{display:block;font-size:15px;color:var(--txt)}
#pres div.dg b{color:var(--rd)}
#pm{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0 4px}
.card{padding:16px;border-radius:20px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:18px}
.card p{margin:0 0 8px;color:#d0d9f0;line-height:1.45;font-size:15.5px}
.card.sec{border-color:rgba(233,180,76,.5);background:linear-gradient(180deg,rgba(60,42,10,.55),rgba(14,12,8,.8))}
.card.sec .rl{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--gd);text-transform:uppercase;margin-bottom:6px}
.card.sec p{color:#f6ead2;font-size:16.5px}
.card.rev{border-color:rgba(125,211,252,.55);background:linear-gradient(180deg,rgba(10,50,80,.55),rgba(6,14,26,.85))}
.card.rev .rl{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--vx);text-transform:uppercase;margin-bottom:6px}
.h{font-family:var(--disp);font-size:30px;line-height:1.08;margin:4px 0 10px}
.lbl{display:block;font-size:13px;font-weight:800;color:var(--mut);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.field{width:100%;padding:15px 14px;border-radius:14px;border:2px solid var(--line);background:#081226;color:var(--txt);font-size:18px;outline:none}
.field:focus{border-color:var(--cy)}
.pbtn{display:block;width:100%;padding:16px;border-radius:16px;border:none;background:linear-gradient(180deg,#f6d27e,#c98a22);color:#1c1200;font-weight:900;font-size:18px;margin-top:12px;box-shadow:0 5px 0 #6e4a0b;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pbtn.alt{background:var(--panel2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.pbtn.blue{background:linear-gradient(180deg,#5cc8f0,#1f7fb8);color:#fff;box-shadow:0 5px 0 #0c3d5c}
.pbtn:disabled{opacity:.45}
.pbtn.done{background:rgba(74,222,128,.15);color:var(--gr);box-shadow:none;border:1px solid rgba(74,222,128,.5)}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.avs button{aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:var(--panel);font-size:22px;touch-action:manipulation;padding:0}
.avs button.on{border-color:var(--gd);background:rgba(233,180,76,.15)}
.tbar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin:4px 0 10px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--vi));transition:width .25s linear}
.tbar.low i{background:var(--rd)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 4px}
.sh b{font-family:var(--disp);font-size:20px;line-height:1.1}

const ENV_LABEL = { base: "Base", jungle: "Jungle", temple: "Temple", village: "Village", domes: "Village", ice: "Glace", tower: "Tour", outpost: "Avant-poste", lab: "Intérieur" };
const TV = {
  game: null, net: null, room: "", screen: "", lastSeq: -1, lastViews: {}, lastViewAt: 0, netState: "init", netLostAt: 0, built: {}, lastPhase: "", lastKind: "", prog: null,
  async boot() {
    document.documentElement.classList.add("tv");
    document.body.innerHTML = '<div id="stage"><div id="bgart"></div><div class="safe" id="safe"></div><div id="ann"></div><div id="toast"></div></div>';
    $("#stage").addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b) this.act(b.dataset.act, b); });
    this.fit(); addEventListener("resize", () => this.fit());
    try { await loadScript("/sg-engine.js"); await loadScript("/sg-missions.js"); await loadScript("/ia-qr.js"); }
    catch (e) { return this.fatal("Les fichiers du jeu n'ont pas pu être chargés.", "Revenez au menu Soirée Jeux puis relancez AU-DELÀ DE LA PORTE."); }
    this.prog = Object.assign(SG.newProgress(), store.get("sg_prog", {}));
    this.restoreOrNew();
    this.applyFx();
    document.addEventListener("keydown", e => this.key(e));
    document.addEventListener("pointerdown", () => Sfx.unlock());
    addEventListener("pagehide", () => this.save());
    setInterval(() => this.loop(), 100);
    setInterval(() => this.housekeeping(), 2000);
    const ph = this.game.st.phase;
    this.show(ph === "lobby" ? (Q.get("screen") || "home") : ph === "ending" ? "game" : "game");
    window.SG_TV = this;
  },
  fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080), st = $("#stage"); if (!st) return; st.style.transform = "translate(" + Math.round((innerWidth - 1920 * s) / 2) + "px," + Math.round((innerHeight - 1080 * s) / 2) + "px) scale(" + s + ")"; },
  applyFx() { const C = this.game.st.config; document.documentElement.classList.toggle("lowfx", !C.anim || matchMedia("(prefers-reduced-motion: reduce)").matches); Sfx.on = !!C.sound; Sfx.vol = (C.volume == null ? 70 : C.volume) / 100; Music.on = !!C.music; },
  restoreOrNew() {
    const saved = store.get("sg_state", null);
    this.game = new SG.Game({ missions: SG_MISSIONS, prog: this.prog });
    let restored = false;
    if (saved && saved.room && Date.now() - (saved.savedAt || 0) < 12 * 3600e3) restored = this.game.restore(saved, Date.now());
    if (restored) this.game.st.prog = this.prog;
    if (!restored) { this.game.st.room = rid(6); const cfg = store.get("sg_cfg", null); if (cfg) this.game.applyConfig(cfg); }
    this.room = this.game.st.room; this.connect();
    if (restored && this.game.st.paused) setTimeout(() => this.toast("Mission retrouvée : OK pour reprendre"), 800);
  },
  newRoom(keepPlayers) {
    const cfg = this.game.st.config;
    if (keepPlayers && this.game.st.phase !== "lobby") { this.game.toLobby(); return; }
    if (keepPlayers) return;
    if (this.net) this.net.close(); store.del("sg_state");
    this.game = new SG.Game({ missions: SG_MISSIONS, config: cfg, prog: this.prog });
    this.game.st.room = rid(6); this.room = this.game.st.room; this.lastViews = {}; this.connect();
  },
  connect() { this.net = new Net(this.room, "tv", "tv", m => this.onMsg(m), s => { this.netState = s; if (s !== "ok" && !this.netLostAt) this.netLostAt = Date.now(); if (s === "ok") { this.netLostAt = 0; this.lastViews = {}; } this.renderNet(); }); },
  publicUrl() { return ((HOST && HOST.publicUrl) || (location.origin + "/porte")) + "?room=" + this.room; },
  save() { this.saveAt = Date.now(); try { localStorage.setItem("sg_state", this.game.save(this.saveAt)); } catch (e) { } },
  saveCfg() { store.set("sg_cfg", this.game.st.config); this.applyFx(); },
  saveProg() { store.set("sg_prog", this.prog); },
  onMsg(m) {
    const g = this.game, now = Date.now(), pid = m.from;
    try {
      if (pid === "server") { if (m.type === "peer-left") g.offline(m.id); return; }
      if (typeof pid !== "string" || !pid) return;
      const known = g.st.players[pid];
      if (known && known.key && m.k !== known.key) { this.net.send(pid, { type: "refused", reason: "identifiant déjà utilisé par un autre téléphone" }); return; }
      const before = !!known;
      const r = g.handle(pid, m, now) || {};
      if (m.type === "hello") {
        if (!r.ok) { this.net.send(pid, { type: r.reason === "pleine" ? "full" : r.reason === "en_cours" ? "busy" : "refused", reason: r.reason }); return; }
        const np = g.st.players[pid]; if (np && !np.key && typeof m.k === "string") np.key = m.k.slice(0, 40);
        this.lastViews[pid] = ""; if (!before) Sfx.sg("vote");
      } else if (r.rejoin) { this.net.send(pid, { type: "rejoin" }); return; }
      if (m.mid) { const a = Object.assign({ type: "ack", mid: m.mid, for: m.type }, r); this.net.send(pid, a); }
      if (m.type === "vote" && r.ok) Sfx.sg("vote");
      if (m.type === "power" && r.ok) Sfx.sg(m.power === "scan" ? "scan" : "power");
      if (m.type === "answer" && r.ok && !r.good) Sfx.sg("ko");
    } catch (e) { console.error(e); this.toast("Erreur interne : " + e.message); }
  },
  loop() {
    const g = this.game, now = Date.now();
    try { g.tick(now); } catch (e) { console.error(e); this.toast("Erreur : " + e.message); }
    const S = g.st;
    if (S.seq !== this.lastSeq || now - this.lastViewAt > 1000) this.sendViews(now, S.seq !== this.lastSeq);
    if (S.seq !== this.lastSeq) {
      this.lastSeq = S.seq;
      if (now - (this.saveAt || 0) > 600) this.save(); else if (!this.saveT) this.saveT = setTimeout(() => { this.saveT = 0; this.save(); }, 650);
      this.react(); this.render();
    } else this.renderTimers(now);
  },
  housekeeping() {
    const g = this.game, now = Date.now(); this.save();
    Object.values(g.st.players).forEach(p => { if (p.online && now - (p.lastSeen || 0) > 12000) g.offline(p.id); });
    this.renderNet();
  },
  sendViews(now, changed) {
    const g = this.game; this.lastViewAt = now;
    for (const p of Object.values(g.st.players)) {
      if (!p.online) continue;
      const v = g.viewFor(p.id, now), key = JSON.stringify(v).replace(/"remain":\d+/g, "");
      if (changed && this.lastViews[p.id] === key) continue;
      this.lastViews[p.id] = key; this.net.send(p.id, { type: "view", v });
    }
  },
  react() {
    const S = this.game.st, k = S.step && S.step.kind;
    if (S.phase !== this.lastPhase) {
      this.lastPhase = S.phase;
      if (S.phase !== "lobby" && this.screen !== "game") this.show("game");
      if (S.phase === "lobby" && this.screen === "game") this.show("lobby");
      if (S.phase === "roles") Sfx.sg("secret");
      if (S.phase === "briefing") Sfx.sg("static");
      if (S.phase === "ending") { const t = S.ending && S.ending.type; Sfx.sg(t === "critique" ? "endbad" : "end"); if (S.ending && S.ending.unlocks.length) this.saveProg(); this.saveProg(); }
    }
    if (k !== this.lastKind || (S.step && S.step.until !== this.lastUntil)) {
      const was = this.lastKind; this.lastKind = k; this.lastUntil = S.step && S.step.until;
      if (k === "narr" && was !== "narr") { Sfx.sg("open"); if ((this.game.sc() || {}).radio) setTimeout(() => Sfx.sg("static"), 600); }
      if (k === "vote") Sfx.sg("secret");
      if (k === "puzzle") Sfx.sg("scan");
      if (k === "outcome") Sfx.sg(S.step.success === false ? "ko" : S.step.success ? "ok" : "open");
      if (k === "event") Sfx.sg(S.step.tone === "good" ? "ok" : "alarm");
    }
    if (S.announce && S.announce.id !== this.lastAnn) { this.lastAnn = S.announce.id; this.announce(S.announce.icon + " " + S.announce.text); }
    const mus = S.paused ? "" : { lobby: "base", roles: "base", briefing: "base", gate: "", scene: S.res && S.res.menace >= 3 ? "tension" : "explore", ending: "base" }[S.phase] || "";
    Music.set(this.screen === "home" || this.screen === "missions" || this.screen === "lobby" ? (S.phase === "lobby" ? "base" : mus) : mus);
    // flash des jauges
    if (S.res) { const prev = this.prevRes || S.res; this.flash = {}; Object.keys(S.res).forEach(r => { if (S.res[r] !== prev[r]) this.flash[r] = (r === "menace" ? S.res[r] < prev[r] : S.res[r] > prev[r]) ? "up" : "down"; }); this.prevRes = Object.assign({}, S.res); }
  },
  announce(t) { const a = $("#ann"); if (!a) return; a.textContent = t; a.classList.add("on"); clearTimeout(this.annT); this.annT = setTimeout(() => a.classList.remove("on"), 3800); },
  /* ----- Écrans ----- */
  bg(env) { if (this.curEnv === env) return; this.curEnv = env; $("#bgart").innerHTML = env ? Art.env(env) : ""; },
  show(name) { this.screen = name; this.built = {}; $("#safe").innerHTML = ""; clearTimeout(this.gateT); this.gateRun = null; this.render(); const f = $("#safe .row, #safe .mcard") || $("#safe .tvbtn"); if (f && !$("#safe").contains(document.activeElement)) f.focus(); },
  region(id, key, html, parent) {
    let el = document.getElementById(id);
    if (!el) { (parent || $("#safe")).insertAdjacentHTML("beforeend", '<div id="' + id + '"></div>'); el = document.getElementById(id); }
    if (this.built[id] === key) return false; this.built[id] = key;
    const had = el.contains(document.activeElement); el.outerHTML = html.replace(/^<div/, '<div id="' + id + '"'); el = document.getElementById(id);
    if (had || !$("#safe").contains(document.activeElement)) { const f = el.querySelector(".tvbtn, .row"); if (f && !$("#menu")) f.focus(); }

  },
  build(key, html) { if (this.built._ === key) return false; this.built = { _: key }; $("#safe").innerHTML = html; const f = $("#safe .row, #safe .mcard") || $("#safe .tvbtn"); if (f && !$("#menu")) f.focus(); return true; },
  render() {
    try {
      const S = this.game.st;
      if (this.screen === "home") this.renderHome();
      else if (this.screen === "missions") this.renderMissions();
      else if (this.screen === "lobby") this.renderLobby();
      else if (this.screen === "settings") this.renderSettings();
      else if (this.screen === "rules") this.renderRules();
      else if (this.screen === "archives") this.renderArchives();
      else if (this.screen === "game") {
        if (S.phase === "lobby") return this.show("lobby");

      '<div class="acts">' + (ip ? '<button class="tvbtn gold wide" data-act="resume_game">▶ REPRENDRE LA MISSION</button>' : '<button class="tvbtn gold wide" data-act="missions">▶ LANCER UNE MISSION</button>') +

  onAck(m) {
    const key = Object.keys(this.pending).find(k => this.pending[k] === m.mid); if (key) delete this.pending[key];
    const R = { pause: "Mission en pause", ferme: "Trop tard : c'est terminé", option: "Option indisponible", solveur: "Seul le spécialiste désigné peut répondre", longueur: "Réponse incomplète", format: "Réponse invalide", pas_maintenant: "Pas maintenant", epuise: "Plus d'utilisation disponible", deja: "Déjà utilisé dans cette scène", inutile: "Inutile pour l'instant (déjà au maximum)", chef: "Seul le chef choisit", verrouille: "Équipement verrouillé", role: "Ce pouvoir n'est pas le vôtre", en_cours: "La mission a commencé" };
    if (m.for === "vote") { if (m.ok) { navigator.vibrate && navigator.vibrate(30); this.feedback("ok", "Vote enregistré ✓ (modifiable jusqu'à la clôture)"); } else this.feedback("ko", R[m.reason] || "Vote refusé"); }
    if (m.for === "answer") { if (m.ok && m.good) { this.feedback("ok", "Bonne réponse !"); navigator.vibrate && navigator.vibrate([40, 40, 80]); } else if (m.ok) { this.feedback("ko", "✖ " + m.fb + " · " + m.left + " essai(s) restant(s)"); navigator.vibrate && navigator.vibrate(200); this.sel = []; this.code = ""; } else this.feedback("ko", R[m.reason] || "Refusé"); }
    if (m.for === "power") { if (m.ok) { this.feedback("ok", "Pouvoir activé"); navigator.vibrate && navigator.vibrate([30, 30, 60]); } else this.feedback("ko", R[m.reason] || "Pouvoir refusé"); }
    if (m.for === "equip" && !m.ok) this.feedback("ko", R[m.reason] || "Refusé");
    if (m.for === "ready" && !m.ok) this.feedback("ko", R[m.reason] || "Refusé");
    this.render(true);
  },
  feedback(kind, txt) { this.fb = { kind, txt, at: Date.now(), k: this.stepKey() }; const el = $("#fb"); if (el) { el.className = "fb " + kind; el.textContent = txt; } },
  stepKey() { const v = this.v; return v ? v.phase + ":" + (v.scene ? v.scene.n + v.scene.step : "") : ""; },
  remain() { const v = this.v; if (!v) return 0; const r = v.scene ? v.scene.remain : v.remain; if (v.paused) return r; return Math.max(0, (r || 0) - (Date.now() - this.vAt)); },
  tickUi() {
    const v = this.v; if (!v) return;
    const bar = $("#tbar i"), len = v.len; if (bar && len) { const r = this.remain(); bar.style.width = (100 * r / len) + "%"; $("#tbar").classList.toggle("low", r < 10000); const t = $("#tleft"); if (t) t.textContent = Math.ceil(r / 1000) + " s"; }
  },
  render(force) {
    const v = this.v; if (!v || !this.joined) return;
    if (v.phase === "unknown") { this.hello(); return; }
    const me = v.me;
    $("#ph-me").innerHTML = '<div class="av" style="background:' + me.color + '30;box-shadow:inset 0 0 0 2px ' + me.color + '">' + esc(me.avatar) + '</div><div style="min-width:0"><b>' + esc(me.name) + '</b><small>' + (me.role ? esc(me.roleIcon + " " + me.roleName) : "Recrue · " + esc(v.team.length) + " dans l'équipe") + '</small></div>';
    $("#pres").innerHTML = v.res && v.phase !== "lobby" ? Object.keys(RES_UI).map(r => { const val = v.res[r], dg = (r === "menace" && val >= 3) || (r !== "menace" && r !== "donnees" && val <= (r === "temps" ? 2 : 25)); return '<div class="' + (dg ? "dg" : "") + '">' + RES_UI[r][0] + '<b>' + val + '</b></div>'; }).join("") : "";
    const sig = JSON.stringify(v).replace(/"remain":\d+/g, "") + JSON.stringify([this.sel, this.code, Object.keys(this.pending)]);
    if (!force && sig === this.sig) return;
    this.sig = sig;
    const sc = $("#pm").scrollTop, sameStep = this.lastStepKey === this.stepKey(); this.lastStepKey = this.stepKey();
    $("#pm").innerHTML = this.html(v);
    this.bind(v);
    if (sameStep) $("#pm").scrollTop = sc;
    if (this.fb && $("#fb") && Date.now() - this.fb.at < 7000 && this.fb.k === this.stepKey()) { $("#fb").className = "fb " + this.fb.kind; $("#fb").textContent = this.fb.txt; }
    this.tickUi();
  },
  timer(label) { return '<div class="sh"><span>' + esc(label || "") + '</span><span id="tleft"></span></div><div class="tbar" id="tbar"><i></i></div>'; },
  powers(v, title) {
    const me = v.me, s = v.scene; if (!me.powers || !me.powers.length) return "";
    return '<div class="card"><h3>' + (title || "Vos pouvoirs") + '</h3><div class="pws' + (me.powers.length === 1 ? " one" : "") + '">' + me.powers.map(p => { const can = s && p.steps.includes(s.step) && p.left > 0 && !p.usedHere && !this.pending.power && !(p.id === "ordre" && s.vote && s.vote.ordreOn);
      return '<button data-pw="' + p.id + '"' + (can ? "" : " disabled") + '><i>' + p.icon + '</i>' + esc(p.name) + '<small>' + (p.usedHere ? "utilisé ici" : p.left + " restant" + (p.left > 1 ? "s" : "")) + '</small></button>'; }).join("") + '</div></div>';
  },
  secrets(v) {
    const s = v.scene; let h = "";
    (s.reveals || []).forEach(r => h += '<div class="card rev"><div class="rl">' + r.icon + " " + esc(r.title) + ' · pour vous seul</div><p>' + esc(r.text) + '</p></div>');
    (s.secrets || []).forEach(x => h += '<div class="card sec"><div class="rl">🔒 ' + (x.clue ? "Indice" : "Confidentiel") + " · " + esc(x.role) + '</div><p>' + esc(x.text) + '</p></div>');
    if (!h) h = '<div class="card"><p class="mut">Aucune information confidentielle pour votre rôle dans cette scène. Écoutez les autres.</p></div>';
    return h;
  },
  readyBtn(v, label) { return v.me.ready ? '<button class="pbtn done" disabled>✓ Prêt — en attente des autres</button>' : '<button class="pbtn" id="rdy"' + (this.pending.ready ? " disabled" : "") + '>' + esc(label || "JE SUIS PRÊT") + '</button>'; },
  html(v) {
    const me = v.me;
    if (v.paused) return '<div class="card center"><div class="h">⏸ Pause</div><p>' + (v.pauseWhy === "restauree" ? "La télé a été rechargée : la mission et vos informations sont conservées." : "L'organisateur a mis la mission en pause.") + '</p></div>' + (v.scene ? this.secrets(v) : "");
    switch (v.phase) {
      case "lobby": {
        let h = '<div class="card center"><div class="h">Vous êtes dans l\'équipe !</div><p>' + v.team.length + ' membre(s) : ' + v.team.map(t => esc(t.avatar + " " + t.name)).join(", ") + '</p><p class="mut small">L\'organisateur lance la mission depuis la télé.</p></div>';
        if (v.cfg.roleMode === "choix") h += '<div class="card"><h3>Quel rôle souhaitez-vous ?</h3><div class="seg">' + Object.keys(BASE_UI).map(b => '<button data-want="' + b + '" class="' + (me.want === b ? "on" : "") + '">' + BASE_UI[b][0] + " " + BASE_UI[b][1] + '</button>').join("") + '</div><p class="mut small" style="margin-top:8px">Selon le nombre de joueurs, vous pouvez recevoir une variante (médecin, éclaireur…) ou un rôle double.</p></div>';
        return h + '<div class="card"><h3>Comment jouer</h3><ul class="ul"><li>La télé raconte l\'histoire.</li><li>Votre téléphone affiche des <b>informations confidentielles</b> réservées à votre rôle.</li><li>Votez en secret, utilisez vos pouvoirs, résolvez les énigmes en combinant les indices de chacun.</li><li>Parlez entre vous : c\'est la clé.</li></ul></div>';
      }
      case "roles": {
        const R = me;
        return '<div class="card rolec" style="border-color:' + R.roleColor + '"><div class="mut small">VOTRE RÔLE</div><div class="ic" style="background:' + R.roleColor + '22;box-shadow:inset 0 0 0 3px ' + R.roleColor + '">' + R.roleIcon + '</div><div class="nm" style="color:' + R.roleColor + '">' + esc(R.roleName) + '</div><p style="margin-top:8px">' + esc(R.roleDesc) + '</p>' +
          (R.bases.length > 1 ? '<p class="small mut">Vous recevez les informations de : ' + R.bases.map(b => BASE_UI[b][1]).join(" et ") + '.</p>' : "") +
          (R.powers || []).map(p => '<div class="pw"><i>' + p.icon + '</i><div><b>' + esc(p.name) + ' · ×' + p.left + '</b><span>' + esc(p.desc) + '</span></div></div>').join("") + '</div>' +
          (v.roleBrief ? '<div class="card sec"><div class="rl">🔒 Confidentiel</div><p>' + esc(v.roleBrief) + '</p></div>' : "") + this.timer("Lecture") + this.readyBtn(v) + '<div class="fb" id="fb"></div>';
      }
      case "briefing": {
        const B = v.briefing, E = v.equip;
        let h = '<div class="card"><div class="mut small">BRIEFING · ' + esc(v.mission.code) + '</div><div class="h">' + esc(v.mission.name) + '</div><h3>Objectifs</h3><ul class="ul">' + B.objectives.map(o => '<li>' + esc(o) + '</li>').join("") + '</ul></div>';
        (v.privateBrief || []).forEach(x => h += '<div class="card sec"><div class="rl">🔒 Confidentiel · ' + esc(x.role) + '</div><p>' + esc(x.text) + '</p></div>');
        if (E.mine) h += '<div class="card"><h3>Choisissez l\'équipement de l\'équipe</h3><div class="vopts">' + E.choices.map(c => '<button data-eq="' + c.id + '" class="' + (E.chosen === c.id ? "on" : "") + '"><span class="l">' + c.icon + '</span><div><b>' + esc(c.name) + '</b><span>' + esc(c.desc) + '</span></div></button>').join("") + '</div>' + (E.choices.length === 1 ? '<p class="mut small" style="margin-top:8px">D\'autres équipements se débloquent en réussissant des missions.</p>' : "") + '</div>';
        else { const c = E.choices.find(x => x.id === E.chosen); h += '<div class="card"><h3>Équipement</h3><p>' + (c ? c.icon + " " + esc(c.name) + " — " + esc(c.desc) : "Le chef d'équipe choisit…") + '</p></div>'; }
        return h + this.timer("Briefing") + this.readyBtn(v, "PRÊT À PARTIR") + '<div class="fb" id="fb"></div>';
      }
      case "gate": return '<div class="card center"><div class="spin"></div><div class="h">Activation de la Porte</div><p>Regardez la télé. Les chevrons se verrouillent un à un…</p></div>';
      case "scene": return this.sceneHtml(v);
      case "ending": {
        const E = v.ending, T = { parfaite: ["★", "#4ade80"], partielle: ["◐", "#4cc9f0"], controle: ["↩", "#e9b44c"], critique: ["✖", "#f87171"], exceptionnelle: ["✦", "#e879f9"] }[E.type];
        return '<div class="card big"><div class="e" style="color:' + T[1] + '">' + T[0] + '</div><div class="mut small" style="color:' + T[1] + '">' + esc(E.name) + '</div><div class="g">' + esc(E.title) + '</div><p>' + esc(E.text) + '</p><p><b>Évaluation ' + E.grade + '</b> · ' + E.score + ' / 100</p></div>' +
          '<div class="card"><h3>Objectifs secondaires</h3><ul class="ul">' + E.sec.map(x => '<li>' + (x.ok ? "✅ " : "▫️ ") + esc(x.text) + '</li>').join("") + '</ul></div>' + (E.unlocks.length ? '<div class="card"><h3>Déblocages</h3><ul class="ul">' + E.unlocks.map(u => '<li>🔓 ' + esc(u) + '</li>').join("") + '</ul></div>' : "") + '<p class="center mut small">L\'organisateur peut relancer une mission depuis la télé.</p>';
      }
    }
    return '<div class="card center"><div class="spin"></div><p>Synchronisation…</p></div>';
  },
  sceneHtml(v) {
    const s = v.scene, k = s.step;
    let h = '<div class="sh"><b>' + esc(s.title) + '</b></div>';
    if (k === "narr") return h + this.timer("Lecture et discussion") + this.secrets(v) + this.powers(v) + this.readyBtn(v, "J'AI LU — PASSER À LA DÉCISION") + '<div class="fb" id="fb"></div>';
    if (k === "vote") {
      const V = s.vote;
      h += this.timer("Vote secret · " + V.voted + "/" + V.total + " votes") + '<div class="vopts">' + V.choices.map((c, i) => '<button data-vote="' + c.id + '" class="' + (V.mine === c.id ? "on" : "") + '"><span class="l">' + LET[i] + '</span><div><b>' + esc(c.label) + '</b>' + (c.desc ? '<span>' + esc(c.desc) + (c.tags.length ? " · " + esc(c.tags.join(" · ")) : "") + '</span>' : "") + '</div></button>').join("") + '</div>' +
        (V.ordre ? '<div class="fb ok">🎖️ Ordre de mission : votre vote est décisif.</div>' : V.ordreOn ? '<div class="fb info">🎖️ Le chef a donné un ordre de mission.</div>' : "") + '<div class="fb" id="fb"></div>' + this.secrets(v) + this.powers(v);
      return h;
    }
    if (k === "puzzle") return h + this.puzzleHtml(v);
    if (k === "outcome" || k === "event") {
      const R = s.result;
      if (k === "event") h += '<div class="card big"><div class="e">' + (R.tone === "good" ? "✨" : "⚠️") + '</div><div class="g" style="font-size:30px">' + esc(R.title) + '</div><p>' + esc(R.text) + '</p><div class="dl" style="justify-content:center">' + fmtDelta(R.deltas) + '</div></div>';
      else h += '<div class="card big"><div class="e">' + (R.success === true ? "✅" : R.success === false ? "❌" : "📜") + '</div>' + (R.label ? '<div class="g" style="font-size:26px">' + esc(R.label) + '</div>' : "") + '<p>' + esc(R.text) + '</p><div class="dl" style="justify-content:center">' + fmtDelta(R.deltas) + '</div></div>';
      return h + this.timer("Suite") + this.readyBtn(v, "CONTINUER") + '<div class="fb" id="fb"></div>' + this.powers(v);
    }
    return h;
  },
  puzzleHtml(v) {
    const P = v.scene.puzzle, key = v.scene.n + ":" + P.tries.length;
    if (this.pzKey !== key) { this.pzKey = key; this.sel = []; this.code = ""; }
    let h = this.timer("Énigme · " + P.attempts + " essai(s)") + '<div class="card"><p style="margin:0"><b>' + esc(P.prompt) + '</b></p>' + (P.display ? '<p class="mut small" style="margin:6px 0 0">Sur la télé : ' + esc(P.display) + '</p>' : "") + '</div>';
    h += this.secrets(v);
    if (P.canAnswer) {
      h += '<div class="card" style="border-color:rgba(76,201,240,.6)"><h3>🧩 C\'est à vous de saisir la réponse</h3>';
      if (P.type === "sequence") {
        h += '<div class="slots">' + Array.from({ length: P.length }, (_, i) => { const id = this.sel[i], o = id && P.options.find(x => x.id === id); return '<div class="' + (o ? "f" : "") + '">' + (o ? (o.icon ? '<i>' + esc(o.icon) + '</i>' : "") + (o.icon && o.icon.length <= 2 && /[A-Z]/.test(o.icon) ? "" : esc(o.label)) : i + 1) + '</div>'; }).join("") + '</div>' +
          '<div class="sopts">' + P.options.map(o => '<button data-sq="' + esc(o.id) + '"' + (this.sel.length >= P.length ? " disabled" : "") + '>' + (o.icon ? '<i>' + esc(o.icon) + '</i>' : "") + esc(o.label) + '</button>').join("") + '</div>' +
          '<div class="seg" style="margin-top:8px"><button id="sqUndo">↶ Effacer</button><button id="sqGo" class="' + (this.sel.length === P.length ? "on" : "") + '"' + (this.sel.length === P.length && !this.pending.answer ? "" : " disabled") + '>✔ VALIDER</button></div>';
      } else if (P.type === "code") {
        h += '<div class="codev">' + (esc(this.code) || '<span class="mut">' + "_ ".repeat(P.length) + '</span>') + '</div><div class="keys">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => '<button data-kd="' + n + '">' + n + '</button>').join("") + '<button data-kd="del">↶</button><button data-kd="0">0</button><button data-kd="ok" style="background:var(--gd);color:#1c1200"' + (this.code.length === P.length && !this.pending.answer ? "" : " disabled") + '>✔</button></div>';
      } else {
        h += '<div class="vopts">' + P.options.map((o, i) => '<button data-ch="' + esc(o.id) + '"><span class="l">' + LET[i] + '</span><div><b>' + esc(o.label) + '</b></div></button>').join("") + '</div>';
      }
      h += '<div class="fb" id="fb"></div></div>';
    } else h += '<div class="card center"><p>📣 Saisie de la réponse : <b>' + esc(P.holder) + '</b>. Donnez vos indices à voix haute !</p></div><div class="fb" id="fb"></div>';
    if (P.tries.length) h += '<div class="card"><h3>Essais ratés</h3><ul class="ul">' + P.tries.map(t => '<li>' + esc(Array.isArray(t.given) ? t.given.map(x => (P.options.find(o => o.id === x) || { label: x }).label).join(" → ") : t.given) + ' — ' + esc(t.fb) + '</li>').join("") + '</ul></div>';
    return h + this.powers(v);
  },
  bind(v) {
    $$("[data-want]").forEach(b => b.onclick = () => this.act("want", { role: b.dataset.want }, "want"));
    const r = $("#rdy"); if (r) r.onclick = () => this.act("ready", {}, "ready");
    $$("[data-eq]").forEach(b => b.onclick = () => this.act("equip", { item: b.dataset.eq }, "equip"));
    $$("[data-vote]").forEach(b => b.onclick = () => { if (this.act("vote", { choice: b.dataset.vote }, "vote")) { $$("[data-vote]").forEach(x => x.classList.toggle("on", x === b)); } });
    $$("[data-pw]").forEach(b => b.onclick = () => this.powerSheet(v, b.dataset.pw));
    $$("[data-sq]").forEach(b => b.onclick = () => { const P = v.scene.puzzle; if (this.sel.length < P.length) { this.sel.push(b.dataset.sq); navigator.vibrate && navigator.vibrate(15); this.render(true); } });
    const u = $("#sqUndo"); if (u) u.onclick = () => { this.sel.pop(); this.render(true); };
    const g = $("#sqGo"); if (g) g.onclick = () => { if (this.act("answer", { answer: this.sel.slice() }, "answer")) this.render(true); };
    $$("[data-kd]").forEach(b => b.onclick = () => { const P = v.scene.puzzle, d = b.dataset.kd; if (d === "del") this.code = this.code.slice(0, -1); else if (d === "ok") { if (this.code.length === P.length) this.act("answer", { answer: this.code }, "answer"); } else if (this.code.length < P.length) this.code += d; navigator.vibrate && navigator.vibrate(12); this.render(true); });
    $$("[data-ch]").forEach(b => b.onclick = () => this.act("answer", { answer: b.dataset.ch }, "answer"));
  },
  powerSheet(v, id) {
    const p = v.me.powers.find(x => x.id === id); if (!p) return; const old = $("#sheet"); if (old) old.remove();
    document.body.insertAdjacentHTML("beforeend", '<div class="sheet" id="sheet"><div class="in"><div class="h">' + p.icon + " " + esc(p.name) + '</div><p class="mut">' + esc(p.desc) + '</p><p class="small mut">Utilisations restantes : ' + p.left + '. L\'équipe verra que vous l\'avez utilisé, pas ce que vous découvrez.</p><button class="pbtn" id="shGo">UTILISER</button><button class="pbtn alt" id="shX">Annuler</button></div></div>');
    $("#shGo").onclick = () => { this.act("power", { power: id }, "power"); $("#sheet").remove(); };
    $("#shX").onclick = () => $("#sheet").remove();
    $("#sheet").onclick = e => { if (e.target.id === "sheet") $("#sheet").remove(); };
  }
};

window.addEventListener("error", e => { if (IS_TV && window.SG_TV) TV.toast("Erreur : " + (e.message || "inconnue")); });
if (IS_TV) TV.boot(); else PH.boot();
</script>
</body>
</html>
