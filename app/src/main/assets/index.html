<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Oche Fléchettes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout : tableau de score façon ardoise de pub (TV) + pupitre de saisie (téléphone), une seule ambiance sombre assumée */
[hidden]{display:none!important}
:root{
  --bg:#101311;          /* ardoise */
  --panel:#181d1a;
  --line:#2a322d;
  --sisal:#efe6cf;       /* fibre de la cible */
  --muted:#9aa395;
  --red:#d2412f;         /* segments rouges */
  --green:#2a8a57;       /* segments verts */
  --gold:#e3b04b;
  --ink:#101311;
  --f-num:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-ui:"Barlow Semi Condensed","Arial Narrow","Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--sisal);font-family:var(--f-ui);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
.brand{font-family:var(--f-num);font-weight:900;font-size:28px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle,var(--red) 0 18%,var(--green) 19% 34%,var(--sisal) 35% 52%,var(--ink) 53% 68%,var(--red) 69% 80%,var(--ink) 81%)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sisal);color:var(--ink)}
.pill{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);display:flex;gap:6px;align-items:center}
.pill b{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.on b{background:var(--green)}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600}

/* ---------- réglage d'une partie ---------- */
.setup{max-width:560px;margin:0 auto;display:grid;gap:18px}
.setup h2{font-family:var(--f-num);font-weight:800;font-size:34px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.lbl{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;margin-bottom:8px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.choices button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left}
.choices button b{display:block;font-family:var(--f-num);font-size:26px;font-weight:800}
.choices button span{font-size:13px;color:var(--muted)}
.choices button[aria-pressed="true"]{border-color:var(--sisal);box-shadow:inset 0 0 0 1px var(--sisal)}
.counts{display:flex;gap:8px}
.counts button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:var(--f-num);font-size:26px;font-weight:800}
.counts button[aria-pressed="true"]{background:var(--sisal);color:var(--ink)}
.names{display:grid;gap:8px}
.names input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--sisal);font:inherit;font-size:18px}
.go{background:var(--green);border:0;border-radius:12px;padding:16px;font-family:var(--f-num);font-weight:800;font-size:26px;letter-spacing:.05em;text-transform:uppercase}
.tvwait{max-width:640px;margin:8vh auto;text-align:center;display:grid;gap:12px}
.tvwait h2{font-family:var(--f-num);font-weight:900;font-size:clamp(40px,6vw,80px);margin:0;text-transform:uppercase}
.qr{width:240px;height:240px;margin:0 auto;border-radius:12px;background:#fff;padding:8px}
.addr{font-family:var(--f-num);font-weight:800;font-size:clamp(28px,3.5vw,52px)!important;color:var(--sisal)!important;letter-spacing:.03em}
.tvwait p{color:var(--muted);font-size:clamp(16px,1.6vw,22px);margin:0}

/* ---------- partie ---------- */
.game{display:grid;gap:16px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:13px}
.meta strong{color:var(--sisal);font-family:var(--f-num);font-size:22px;letter-spacing:.04em}
.board{display:grid;gap:10px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.pl{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px;min-width:0;position:relative}
.pl.cur{background:var(--sisal);color:var(--ink);border-color:var(--sisal)}
.pl.cur .st,.pl.cur .last{color:#4b5148}
.pl .nm{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.pl.cur .nm::before{content:"";width:0;height:0;border-left:9px solid var(--red);border-top:6px solid transparent;border-bottom:6px solid transparent}
.big{font-family:var(--f-num);font-weight:900;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.last{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.2em}
.st{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.st b{font-weight:700}
.finish{font-family:var(--f-num);font-weight:800;font-size:20px;letter-spacing:.04em;color:var(--green)}
.pl.cur .finish{color:#1d6a42}
.bust{color:var(--red);font-weight:700}

/* cricket */
.cricket{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cwrap{overflow-x:auto}
.cricket th,.cricket td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
.cricket th{font-weight:700;font-size:15px;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.cricket th.cur{background:var(--sisal);color:var(--ink);border-radius:8px 8px 0 0}
.cricket td.tg{font-family:var(--f-num);font-weight:900;font-size:30px;color:var(--sisal)}
.cricket tr.dead td.tg{color:var(--line);text-decoration:line-through}
.mk{font-family:var(--f-num);font-weight:900;font-size:30px;line-height:1}
.mk.m3{color:var(--green)}
.cricket tr.pts td{font-family:var(--f-num);font-weight:900;font-size:36px;border-bottom:0}

/* clock */
.target{font-family:var(--f-num);font-weight:900;font-size:64px;line-height:.9}
.track{display:grid;grid-template-columns:repeat(20,1fr);gap:2px}
.track i{height:6px;border-radius:2px;background:var(--line)}
.track i.ok{background:var(--green)}
.pl.cur .track i{background:#cfc5ab}.pl.cur .track i.ok{background:#1d6a42}

/* saisie */
.pad{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;align-content:start}
.padhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.padhead .who{font-weight:700;font-size:20px}
.padhead .hint{color:var(--muted);font-size:14px}
.screen{font-family:var(--f-num);font-weight:900;font-size:56px;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 14px;font-variant-numeric:tabular-nums;min-height:72px}
.screen small{font-size:16px;font-family:var(--f-ui);font-weight:600;color:var(--muted);margin-right:8px}
.screen.warn{color:var(--red)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 0;font-family:var(--f-num);font-weight:800;font-size:30px}
.k:active{background:var(--line)}
.k.ok{background:var(--green);border-color:var(--green)}
.k.del{color:var(--red)}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.quick button{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 0;font-weight:700;font-variant-numeric:tabular-nums}
.mult{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mult button{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 0;font-weight:700;font-size:18px}
.mult button[aria-pressed="true"]{background:var(--sisal);color:var(--ink)}
.mult button[data-m="2"][aria-pressed="true"]{background:var(--green);color:var(--sisal)}
.mult button[data-m="3"][aria-pressed="true"]{background:var(--red);color:var(--sisal)}
.tkeys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.darts{display:flex;gap:8px;min-height:44px}
.darts span{flex:1;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:24px;color:var(--muted)}
.darts span.f{border-style:solid;color:var(--sisal)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.err{color:var(--red);font-weight:600;min-height:1.2em;font-size:14px}

.layout{display:grid;gap:16px}
/* vue TV */
body.tv .pad{display:none}
body.tv.padon .layout{grid-template-columns:minmax(0,1fr) 380px}
body.tv.padon .pad{display:grid}
body.tv .big{font-size:clamp(64px,9vw,160px)}
body.tv .target{font-size:clamp(64px,9vw,160px)}
body.tv .pl .nm{font-size:clamp(18px,2vw,32px)}
body.tv .st,body.tv .last{font-size:clamp(13px,1.3vw,20px)}
body.tv .finish{font-size:clamp(20px,2.2vw,36px)}
body.tv .mk,body.tv .cricket td.tg{font-size:clamp(28px,3.4vw,56px)}
body.tv .cricket tr.pts td{font-size:clamp(34px,4vw,64px)}
body.tv .cricket th{font-size:clamp(15px,1.6vw,26px)}
body.tv .meta{font-size:clamp(13px,1.2vw,18px)}
/* vue téléphone : tableau compact */
body.phone .big,body.phone .target{font-size:40px}
body.phone .board{grid-template-columns:repeat(min(var(--n),2),minmax(0,1fr))}
body.phone .pl{padding:10px}
@media (min-width:900px){body.phone .layout{grid-template-columns:minmax(0,1fr) 400px}}

.win{position:fixed;inset:0;background:rgba(10,12,11,.88);display:grid;place-items:center;z-index:20;padding:20px}
.win div{text-align:center;display:grid;gap:14px}
.win .t{font-size:16px;text-transform:uppercase;letter-spacing:.2em;color:var(--gold);font-weight:700}
.win h2{font-family:var(--f-num);font-weight:900;font-size:clamp(48px,9vw,140px);margin:0;line-height:.9;text-transform:uppercase}
.win p{margin:0;color:var(--muted);font-size:18px}
.win .row{justify-content:center}
.win .row button{flex:0 1 auto;padding:12px 20px}
.foot{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><i aria-hidden="true"></i>Oche</div>
  <div class="seg" role="group" aria-label="Rôle de cet appareil" hidden>
    <button id="v-tv" type="button">Écran TV</button>
    <button id="v-phone" type="button">Saisie téléphone</button>
  </div>
  <span class="pill" id="link"><b></b><span>Connexion…</span></span>
  <span class="spacer"></span>
  <button class="ghost" id="padtoggle" type="button" hidden>Saisir avec la télécommande</button>
</div>
<main id="app"></main>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const app=$("#app");
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const MODES={
  "501":{label:"501",sub:"Descendre de 501 à 0",kind:"x01",start:501},
  "301":{label:"301",sub:"Descendre de 301 à 0",kind:"x01",start:301},
  "cricket":{label:"Cricket",sub:"Fermer 15 à 20 et le bull",kind:"cricket"},
  "clock":{label:"Horloge",sub:"Toucher 1 à 20 dans l'ordre",kind:"clock"}
};
const CT=[20,19,18,17,16,15,25];
const IMPOSSIBLE=new Set([163,166,169,172,173,175,176,178,179]);

/* ---------- état partagé ---------- */
// game = {id, mode, names[], v[] (volées), ts}
const Q=new URLSearchParams(location.search);
const IS_TV=Q.has("tv");
const IP=(Q.get("ip")||location.hostname)+":8080";
let game=null;
let view=IS_TV?"tv":"phone";
let padOn=false;
let rev=0;
let draft="";          // saisie x01 en cours
let darts=[];          // saisie cricket en cours
let mult=1;
let errMsg="";
let room=null;

/* ---------- moteur de jeu ---------- */
function parseDart(t){ if(t==="M")return null; const m={S:1,D:2,T:3}[t[0]]; return {m,t:+t.slice(1)} }
function compute(g){
  const md=MODES[g.mode], n=g.names.length;
  const P=g.names.map(name=>({name,visits:0,scored:0,best:0,last:null,busts:0,ton:0,max:0,
    rem:md.start||0,marks:{},cmarks:0,pts:0,target:1,hits:0}));
  P.forEach(p=>CT.forEach(t=>p.marks[t]=0));
  let winner=null;
  g.v.forEach((v,i)=>{
    if(winner!==null)return;
    const pi=i%n,p=P[pi]; p.visits++;
    if(md.kind==="x01"){
      if(v>p.rem){p.busts++;p.last={bust:true,v};}
      else{p.rem-=v;p.scored+=v;p.best=Math.max(p.best,v);if(v>=100)p.ton++;if(v===180)p.max++;p.last={v};if(p.rem===0)winner=pi;}
    }else if(md.kind==="cricket"){
      const list=String(v).split(",").filter(Boolean);
      list.forEach(tok=>{const d=parseDart(tok);if(!d||!CT.includes(d.t))return;
        const before=p.marks[d.t],after=before+d.m;p.marks[d.t]=after;p.cmarks+=d.m;
        const extra=after-Math.max(before,3);
        if(extra>0&&P.some((o,j)=>j!==pi&&o.marks[d.t]<3))p.pts+=extra*d.t;});
      p.last={txt:list.map(t=>t==="M"?"—":t.replace("D25","DB").replace("S25","B")).join(" ")};
      const closed=CT.every(t=>p.marks[t]>=3);
      if(closed&&P.every((o,j)=>j===pi||p.pts>=o.pts))winner=pi;
    }else{
      const h=+v;p.hits+=h;p.target+=h;p.last={v:h};if(p.target>20)winner=pi;
    }
  });
  const cur=winner===null?g.v.length%n:null;
  return {P,winner,cur,round:Math.floor(g.v.length/n)+1,md};
}

/* finitions classiques (fin sur un double) */
const SINGLE=[],ALL=[];
for(let i=20;i>=1;i--){ALL.push({l:"T"+i,v:3*i})}
ALL.push({l:"Bull",v:50});
for(let i=20;i>=1;i--){ALL.push({l:"D"+i,v:2*i})}
ALL.push({l:"25",v:25});
for(let i=20;i>=1;i--){ALL.push({l:String(i),v:i})}
const DOUBLES=[{l:"Bull",v:50}];for(let i=20;i>=1;i--)DOUBLES.push({l:"D"+i,v:2*i});
const FIN={};
(function(){
  const pref=["D20","D16","D18","D12","D10","D8","Bull"];
  const dScore=d=>{const k=pref.indexOf(d.l);return k<0?pref.length:k};
  const orderedD=[...DOUBLES].sort((a,b)=>dScore(a)-dScore(b));
  for(let r=2;r<=170;r++){
    let best=null;
    for(const d of orderedD){if(d.v===r){best=[d.l];break}}
    if(!best)for(const d of orderedD){for(const a of ALL){if(a.v+d.v===r){best=[a.l,d.l];break}}if(best)break}
    if(!best)outer:for(const a of ALL){for(const d of orderedD){for(const b of ALL){if(a.v+b.v+d.v===r){best=[a.l,b.l,d.l];break outer}}}}
    if(best)FIN[r]=best.join(" · ");
  }
})();

/* ---------- synchronisation (serveur intégré à l'appli TV) ---------- */
function save(){store.set("oche.game",game)}
function commit(){game&&(game.ts=Date.now());save();render();push()}
function share(){}
function setPill(on){const pill=$("#link");pill.classList.toggle("on",on);
  pill.lastElementChild.textContent=IS_TV?"Téléphone : http://"+IP:(on?"Relié à la télé":"Télé injoignable")}
function push(){
  fetch("/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({g:game})})
   .then(r=>r.json()).then(d=>{if(d&&d.rev)rev=d.rev;setPill(true)}).catch(()=>setPill(false));
}
function adopt(g){
  if(g===null||g===undefined){if(game){game=null;draft="";darts=[];render()}return}
  if(typeof g!=="object"||!MODES[g.mode]||!Array.isArray(g.names)||!Array.isArray(g.v))return;
  if(g.names.length<1||g.names.length>4)return;
  game={id:String(g.id),mode:g.mode,names:g.names.map(x=>String(x).slice(0,20)),v:g.v.slice(0,600),ts:+g.ts||0};
  draft="";darts=[];mult=1;errMsg="";save();render();
}
async function poll(){
  try{const r=await fetch("/state",{cache:"no-store"});const d=await r.json();setPill(true);
    if(d.rev>rev){rev=d.rev;adopt(d.d&&d.d.g)}}
  catch(e){setPill(false)}
  setTimeout(poll,700);
}

/* ---------- actions ---------- */
function newGame(mode,names){
  game={id:Math.random().toString(36).slice(2,8),mode,names,v:[],ts:0};
  draft="";darts=[];mult=1;errMsg="";commit();
}
function addVisit(v){if(!game)return;const c=compute(game);if(c.winner!==null)return;game.v.push(v);draft="";darts=[];mult=1;errMsg="";commit()}
function undo(){if(!game||!game.v.length)return;game.v.pop();draft="";darts=[];errMsg="";commit()}
function quit(){game=null;store.set("oche.game",null);draft="";darts=[];render();push()}

/* ---------- rendu ---------- */
function setView(v){view=v;store.set("oche.view",v);render()}
function render(){
  document.body.className=view+(padOn?" padon":"");
  $("#v-tv").setAttribute("aria-pressed",view==="tv");
  $("#v-phone").setAttribute("aria-pressed",view==="phone");
  $("#padtoggle").hidden=!(view==="tv"&&game);
  $("#padtoggle").textContent=padOn?"Masquer le pavé":"Saisir avec la télécommande";
  const focusId=document.activeElement&&document.activeElement.id;
  if(!game){app.innerHTML=view==="tv"&&!padOn?tvWait():setupHTML();bindSetup();}
  else{app.innerHTML=gameHTML();bindGame();}
  if(focusId){const el=document.getElementById(focusId);if(el)el.focus()}
}
function tvWait(){
  let qr="";try{if(window.Android&&Android.qr)qr=Android.qr()}catch(e){}
  return `<div class="tvwait"><h2>Prêt à jouer</h2>
  ${qr?`<img class="qr" src="${qr}" alt="QR code vers la page de saisie">`:""}
  <p>Sur l'iPhone, scannez ce code avec l'appareil photo, ou ouvrez Safari à l'adresse :</p>
  <p class="addr">http://${esc(IP)}</p>
  <p>Le téléphone doit être sur le même Wi-Fi que la télé.</p>
  <p><button class="ghost" id="tvsetup" type="button">Jouer avec la télécommande</button></p></div>`;
}
let setupMode=store.get("oche.mode","501"),setupN=store.get("oche.n",2),setupNames=store.get("oche.names",["Joueur 1","Joueur 2","Joueur 3","Joueur 4"]);
function setupHTML(){
  return `<form class="setup" id="setup"><h2>Nouvelle partie</h2>
  <div><div class="lbl">Jeu</div><div class="choices">${Object.entries(MODES).map(([k,m])=>`<button type="button" id="m-${k}" data-mode="${k}" aria-pressed="${k===setupMode}"><b>${m.label}</b><span>${m.sub}</span></button>`).join("")}</div></div>
  <div><div class="lbl">Joueurs</div><div class="counts">${[1,2,3,4].map(i=>`<button type="button" id="n-${i}" data-n="${i}" aria-pressed="${i===setupN}">${i}</button>`).join("")}</div></div>
  <div class="names">${Array.from({length:setupN},(_,i)=>`<input id="name-${i}" maxlength="20" value="${esc(setupNames[i]||"Joueur "+(i+1))}" aria-label="Nom du joueur ${i+1}">`).join("")}</div>
  <button class="go" id="start" type="submit">Lancer la partie</button></form>`;
}
function readNames(){for(let i=0;i<setupN;i++){const el=$("#name-"+i);if(el)setupNames[i]=el.value.trim()||("Joueur "+(i+1))}store.set("oche.names",setupNames)}
function bindSetup(){
  const tvs=$("#tvsetup");if(tvs)tvs.onclick=()=>{padOn=true;render()};
  const f=$("#setup");if(!f)return;
  f.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{readNames();setupMode=b.dataset.mode;store.set("oche.mode",setupMode);render()});
  f.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{readNames();setupN=+b.dataset.n;store.set("oche.n",setupN);render()});
  f.onsubmit=e=>{e.preventDefault();readNames();newGame(setupMode,setupNames.slice(0,setupN))};
}

function marks(n){n=Math.min(n,3);return n===0?"":n===1?"/":n===2?"✕":"Ⓧ"}
function gameHTML(){
  const c=compute(game),md=c.md,n=game.names.length;
  let board="";
  if(md.kind==="cricket"){
    board=`<div class="cwrap"><table class="cricket"><thead><tr>${(()=>{const h=c.P.map((p,i)=>`<th class="${i===c.cur?"cur":""}">${esc(p.name)}</th>`);h.splice(n===1?1:Math.floor(n/2),0,"<th></th>");return h.join("")})()}</tr></thead><tbody>
    ${CT.map(t=>{const dead=c.P.every(p=>p.marks[t]>=3);
      const cells=c.P.map(p=>`<td><span class="mk ${p.marks[t]>=3?"m3":""}">${marks(p.marks[t])}</span></td>`);
      const tg=`<td class="tg">${t===25?"B":t}</td>`;
      const mid=n===1?1:Math.floor(n/2);cells.splice(mid,0,tg);
      return `<tr class="${dead?"dead":""}">${cells.join("")}</tr>`}).join("")}
    <tr class="pts">${(()=>{const cells=c.P.map(p=>`<td>${p.pts}</td>`);cells.splice(n===1?1:Math.floor(n/2),0,"<td></td>");return cells.join("")})()}</tr>
    <tr>${(()=>{const cells=c.P.map(p=>`<td class="st" style="justify-content:center">MPR ${p.visits?(p.cmarks/p.visits).toFixed(2):"–"}</td>`);cells.splice(n===1?1:Math.floor(n/2),0,"<td></td>");return cells.join("")})()}</tr>
    </tbody></table></div>`;
  }else{
    board=`<div class="board" style="--n:${n}">${c.P.map((p,i)=>{
      const cur=i===c.cur;
      if(md.kind==="x01"){
        const avg=p.visits?(p.scored/p.visits).toFixed(1):"–";
        const fin=cur&&FIN[p.rem]&&p.rem<=170?`<div class="finish">${FIN[p.rem]}</div>`:"";
        const last=p.last?(p.last.bust?`<span class="bust">Bust (${p.last.v})</span>`:`Dernière volée : ${p.last.v}`):"";
        return `<div class="pl ${cur?"cur":""}"><div class="nm">${esc(p.name)}</div><div class="big">${p.rem}</div>${fin}<div class="last">${last}</div>
        <div class="st"><span>Moy. <b>${avg}</b></span><span>Meilleure <b>${p.best||"–"}</b></span><span>100+ <b>${p.ton}</b></span>${p.max?`<span>180 <b>${p.max}</b></span>`:""}</div></div>`;
      }
      const t=Math.min(p.target,20);
      return `<div class="pl ${cur?"cur":""}"><div class="nm">${esc(p.name)}</div><div class="target">${p.target>20?"✓":t}</div>
      <div class="track">${Array.from({length:20},(_,k)=>`<i class="${k<p.target-1?"ok":""}"></i>`).join("")}</div>
      <div class="last">${p.last?"Dernière volée : "+p.last.v+" touche"+(p.last.v>1?"s":""):""}</div>
      <div class="st"><span>Réussite <b>${p.visits?Math.round(100*p.hits/(p.visits*3))+" %":"–"}</b></span></div></div>`;
    }).join("")}</div>`;
  }
  const meta=`<div class="meta"><strong>${md.label}</strong><span>Tour ${c.round}</span>${c.cur!==null?`<span>Au tour de ${esc(game.names[c.cur])}</span>`:""}</div>`;
  const win=c.winner!==null?`<div class="win" role="dialog" aria-label="Fin de partie"><div><div class="t">Partie terminée</div><h2>${esc(game.names[c.winner])}</h2><p>remporte la partie en ${c.P[c.winner].visits} volée${c.P[c.winner].visits>1?"s":""}</p>
    <div class="row"><button class="go" id="again" type="button">Revanche</button><button class="ghost" id="undo2" type="button">Annuler la dernière volée</button><button class="ghost" id="menu" type="button">Autre jeu</button></div></div></div>`:"";
  return `<div class="layout"><section class="game">${meta}${board}</section>${padHTML(c)}</div>${win}`;
}
function padHTML(c){
  if(c.cur===null)return `<aside class="pad"></aside>`;
  const md=c.md,p=c.P[c.cur];
  let body="",hint="";
  if(md.kind==="x01"){
    const v=draft===""?null:+draft;
    const warn=v!==null&&(v>180||IMPOSSIBLE.has(v));
    const bust=v!==null&&!warn&&v>p.rem;
    hint=`Reste ${p.rem}${FIN[p.rem]&&p.rem<=170?" · "+FIN[p.rem]:""}`;
    body=`<div class="screen ${warn||bust?"warn":""}">${bust?"<small>Bust</small>":warn?"<small>Impossible</small>":""}${draft===""?"0":draft}</div>
    <div class="quick">${[26,41,45,60,81,85,100,121,140,180].map(q=>`<button type="button" id="q-${q}" data-q="${q}">${q}</button>`).join("")}</div>
    <div class="keys">${[7,8,9,4,5,6,1,2,3].map(k=>`<button class="k" type="button" id="k-${k}" data-k="${k}">${k}</button>`).join("")}
    <button class="k del" type="button" id="k-del" aria-label="Effacer">⌫</button><button class="k" type="button" id="k-0" data-k="0">0</button><button class="k ok" type="button" id="k-ok">OK</button></div>`;
  }else if(md.kind==="cricket"){
    hint=`Points ${p.pts}`;
    body=`<div class="darts">${[0,1,2].map(i=>`<span class="${darts[i]?"f":""}">${darts[i]?(darts[i]==="M"?"—":darts[i].replace("S25","B").replace("D25","DB")):"Fléchette "+(i+1)}</span>`).join("")}</div>
    <div class="mult">${[[1,"Simple"],[2,"Double"],[3,"Triple"]].map(([m,l])=>`<button type="button" id="mu-${m}" data-m="${m}" aria-pressed="${mult===m}">${l}</button>`).join("")}</div>
    <div class="tkeys">${[20,19,18,17,16,15].map(t=>`<button class="k" type="button" id="t-${t}" data-t="${t}">${t}</button>`).join("")}
    <button class="k" type="button" id="t-25" data-t="25">Bull</button><button class="k" type="button" id="t-0" data-t="0">Raté</button></div>
    <div class="row"><button class="k del" type="button" id="c-del">⌫</button><button class="k ok" type="button" id="c-ok">Valider</button></div>`;
  }else{
    hint=`Cible ${Math.min(p.target,20)}`;
    body=`<div class="lbl">Touches sur cette volée</div><div class="keys">${[0,1,2,3].map(h=>`<button class="k ${h?"":"del"}" type="button" id="h-${h}" data-h="${h}">${h}</button>`).join("")}</div>`;
  }
  return `<aside class="pad" aria-label="Saisie des scores"><div class="padhead"><span class="who">${esc(p.name)}</span><span class="hint">${hint}</span></div>${body}
  <div class="err" role="status">${esc(errMsg)}</div>
  <div class="foot"><button class="ghost" type="button" id="undo">Annuler la dernière volée</button><button class="ghost" type="button" id="quit">Terminer la partie</button></div></aside>`;
}
let confirmQuit=false;
function bindGame(){
  const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onclick=f};
  on("undo",undo);on("undo2",undo);
  on("quit",()=>{if(!confirmQuit){confirmQuit=true;$("#quit").textContent="Confirmer : terminer";setTimeout(()=>{confirmQuit=false;const q=$("#quit");if(q)q.textContent="Terminer la partie"},4000);return}confirmQuit=false;quit()});
  on("again",()=>newGame(game.mode,game.names));
  on("menu",quit);
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{if(draft.length<3){draft=(draft+b.dataset.k).replace(/^0+(?=\d)/,"");errMsg="";render()}});
  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{draft=b.dataset.q;errMsg="";render()});
  on("k-del",()=>{draft=draft.slice(0,-1);render()});
  on("k-ok",submitX01);
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mult=+b.dataset.m;render()});
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    if(darts.length>=3)return;const t=+b.dataset.t;
    if(t===0)darts.push("M");else{let m=mult;if(t===25&&m===3){errMsg="Pas de triple sur le bull.";render();return}darts.push(({1:"S",2:"D",3:"T"})[m]+t)}
    mult=1;errMsg="";render();
  });
  on("c-del",()=>{darts.pop();render()});
  on("c-ok",()=>{const d=darts.slice();while(d.length<3)d.push("M");addVisit(d.join(","))});
  app.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>addVisit(+b.dataset.h));
}
function submitX01(){
  const v=draft===""?0:+draft;
  if(v>180){errMsg="Une volée ne dépasse pas 180.";render();return}
  if(IMPOSSIBLE.has(v)){errMsg=v+" est impossible en trois fléchettes.";render();return}
  addVisit(v);
}

/* navigation à la télécommande (flèches) */
document.addEventListener("keydown",e=>{
  const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  const d=dirs[e.key];
  if(!d){
    if(game&&/^[0-9]$/.test(e.key)&&MODES[game.mode].kind==="x01"&&document.activeElement.tagName!=="INPUT"){if(draft.length<3){draft=(draft+e.key).replace(/^0+(?=\d)/,"");render()}}
    return;
  }
  const a=document.activeElement;
  if(a&&a.tagName==="INPUT"&&(e.key==="ArrowLeft"||e.key==="ArrowRight"))return;
  const els=[...document.querySelectorAll("button,input")].filter(el=>el.offsetParent!==null&&!el.disabled);
  if(!els.length)return;
  if(!a||!els.includes(a)){e.preventDefault();els[0].focus();return}
  const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let best=null,bs=Infinity;
  for(const el of els){if(el===a)continue;const q=el.getBoundingClientRect(),x=q.left+q.width/2-cx,y=q.top+q.height/2-cy;
    const along=x*d[0]+y*d[1];if(along<=4)continue;const across=Math.abs(x*d[1]+y*d[0]);const s=along+across*2.5;if(s<bs){bs=s;best=el}}
  if(best){e.preventDefault();best.focus();best.scrollIntoView({block:"nearest"})}
});
